<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sekme Gücü</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070c;
    color: #e8ecf1;
    font-family: system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
    /* Dokunurken kaydırma, yakınlaştırma, metin seçme ve uzun-basma menüsü olmasın */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas {
    display: block;
    background: #0b1220;
    border: 2px solid #223;
    border-radius: 6px;
    /* 520x540 oranını koruyarak ekrana sığ: genişlik ya da yükseklik hangisi darsa */
    width: min(98vw, calc((100dvh - 40px) * 520 / 540));
    aspect-ratio: 520 / 540;
    height: auto;
  }
  @supports not (height: 100dvh) {
    canvas { width: min(98vw, calc((100vh - 40px) * 520 / 540)); }
  }
  #hint {
    font-size: 12px;
    color: #7c8aa5;
    text-align: center;
    max-width: 500px;
    padding: 0 8px;
  }
  @media (pointer: coarse) {
    #hint .kb { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="540"></canvas>
  <div id="hint">Ekranın herhangi bir yerine basılı tut: yükseklik kazan<span class="kb"> · Boşluk / ↑ · R: yeniden · M: ses · P: duraklat</span></div>
</div>
<script>
// Sekme Gücü — saf oyun mantığı (DOM/canvas/window kullanılmaz)

var CANVAS_W = 520;
var CANVAS_H = 540;
var BALL_X = 160;
var BALL_R = 12;
var FLOOR_Y = 480;
var CEIL_Y = 30;
var GRAVITY = 900;
var THRUST = -700;
var BOUNCE_V = -480;
var MAX_VY = 900;
var SPEED0 = 200;
var SPEED_MAX = 340;
var GAP_H0 = 170;
var GAP_MIN = 120;
// Zorluk eğrisi: doğrusal değil, doygunluğa giden üstel yaklaşım.
// İlk dakikada hızlı sertleşir, sonra yavaşlar ve bir tavanda durur;
// böylece uzun koşular adil kalır, "sonsuz hızlanma" ile zorla bitmez.
var DIFF_TAU = 75;
var WALL_W = 28;
var SPAWN_GRACE = 2.2;
var SPAWN_INTERVAL_MIN = 1.3;
var SPAWN_INTERVAL_MAX = 1.9;
var SPAWN_RAMP = 0.01;

function nextRand(state) {
  state.rngA = (state.rngA + 0x6D2B79F5) | 0;
  var t = state.rngA;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// 0 (başlangıç) → 1 (tavan) arasında, t saniyede.
function difficulty(t) {
  return 1 - Math.exp(-t / DIFF_TAU);
}

// --- Bölümler ---------------------------------------------------------------
// Her bölüm GATES_PER_LEVEL kapıdır. Son bölümün son kapısı geçilince oyun kazanılır.
// Yeni öğeler bölümle açılır:
//   2+  yıldız: kapının ortasında durur; toplanınca bir kalkan verir (en çok 1)
//   3+  hareketli kapı: boşluk yukarı-aşağı salınır, genliği bölümle büyür
//   6+  çift duvar: art arda iki duvar, boşlukları birbirine kaydırılmış
// Kalkan, bir duvar çarpmasını yutar (tavanı değil).
var LEVEL_COUNT = 10;
var GATES_PER_LEVEL = 8;
var STAR_FROM = 2;
var MOVE_FROM = 3;
var DOUBLE_FROM = 6;
var STAR_R = 9;
var MAX_SHIELD = 1;
var DOUBLE_DX = 96;
var DOUBLE_SHIFT = 46;
var MARGIN = 40;
// Art arda iki kapının ağız üstü arasındaki en büyük fark. Top yalnızca zeminden
// sekerek yükselir (basılı tutmak düşüşü yavaşlatır, havada tutmaz); alçak bir
// kapıdan hemen sonra çok yüksek bir kapı hızlanan oyunda fiziksel olarak
// yetişilemez olabiliyordu. Bu sınır her dizilimi oynanabilir tutar.
var MAX_JUMP = 150;

function createState(seed) {
  return {
    rngA: (seed || 1) >>> 0,
    y: FLOOR_Y - BALL_R - 60,
    vy: 0,
    t: 0,
    speed: SPEED0,
    gapH: GAP_H0,
    lastGapY: -1,
    spawnTimer: SPAWN_GRACE,
    obstacles: [],
    bounces: 0,
    score: 0,
    level: 1,
    stars: 0,
    shield: 0,
    shieldUsed: 0,
    distance: 0,
    status: 'playing',
    overReason: ''
  };
}

function clampGapY(gapY, gapH) {
  var minTop = CEIL_Y + MARGIN;
  var maxTop = FLOOR_Y - MARGIN - gapH;
  if (maxTop < minTop) maxTop = minTop;
  return Math.max(minTop, Math.min(maxTop, gapY));
}

function makeWall(state, x, baseY, gapH) {
  var lv = state.level;
  var w = { x: x, baseY: baseY, gapY: baseY, gapH: gapH, passed: false, hit: false, move: null, star: null };
  if (lv >= MOVE_FROM && nextRand(state) < Math.min(0.7, 0.18 * (lv - MOVE_FROM + 1))) {
    w.move = {
      amp: Math.min(48, 22 + 4 * (lv - MOVE_FROM)),
      freq: 0.9 + nextRand(state) * 0.8,
      phase: nextRand(state) * Math.PI * 2
    };
  }
  if (lv >= STAR_FROM && nextRand(state) < 0.4) w.star = { taken: false };
  return w;
}

function spawn(state) {
  var gapH = state.gapH;
  var minTop = CEIL_Y + MARGIN;
  var maxTop = FLOOR_Y - MARGIN - gapH;
  var span = Math.max(10, maxTop - minTop);
  var gapY = minTop + nextRand(state) * span;
  if (state.lastGapY >= 0) {
    gapY = Math.max(state.lastGapY - MAX_JUMP, Math.min(state.lastGapY + MAX_JUMP, gapY));
  }
  gapY = clampGapY(gapY, gapH);
  state.obstacles.push(makeWall(state, CANVAS_W + WALL_W, gapY, gapH));
  state.lastGapY = gapY;
  if (state.level >= DOUBLE_FROM && nextRand(state) < 0.3) {
    var shift = (nextRand(state) < 0.5 ? -1 : 1) * DOUBLE_SHIFT;
    var second = makeWall(state, CANVAS_W + WALL_W + DOUBLE_DX, clampGapY(gapY + shift, gapH), gapH);
    second.move = null; // çift duvarın ikincisi sabit: iki hareketli üst üste adil değil
    state.obstacles.push(second);
    state.lastGapY = second.gapY;
    return DOUBLE_DX / state.speed; // sonraki duvar ikinci parçaya normal aralıkla gelsin
  }
  return 0;
}

function step(state, input, dt) {
  if (state.status !== 'playing') return state;

  var accel = GRAVITY;
  if (input.action) accel += THRUST;
  state.vy += accel * dt;
  if (state.vy > MAX_VY) state.vy = MAX_VY;
  if (state.vy < -MAX_VY) state.vy = -MAX_VY;
  state.y += state.vy * dt;

  if (state.y + BALL_R >= FLOOR_Y) {
    state.y = FLOOR_Y - BALL_R;
    state.vy = BOUNCE_V;
    state.bounces++;
  }

  if (state.y - BALL_R <= CEIL_Y) {
    state.status = 'over';
    state.overReason = 'Tavana çarptın';
    return state;
  }

  state.t += dt;
  var d = difficulty(state.t);
  state.speed = SPEED0 + (SPEED_MAX - SPEED0) * d;
  state.gapH = GAP_H0 - (GAP_H0 - GAP_MIN) * d;

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    var extra = spawn(state);
    var interval = SPAWN_INTERVAL_MAX - state.t * SPAWN_RAMP;
    if (interval < SPAWN_INTERVAL_MIN) interval = SPAWN_INTERVAL_MIN;
    state.spawnTimer = interval + extra;
  }

  for (var i = 0; i < state.obstacles.length; i++) {
    var o = state.obstacles[i];
    o.x -= state.speed * dt;
    if (o.move) {
      o.gapY = clampGapY(o.baseY + o.move.amp * Math.sin(o.move.phase + state.t * o.move.freq), o.gapH);
    }

    // Yıldız: kapının ortasında
    if (o.star && !o.star.taken) {
      var sx = o.x + WALL_W / 2;
      var sy = o.gapY + o.gapH / 2;
      if (Math.abs(sx - BALL_X) < BALL_R + STAR_R && Math.abs(sy - state.y) < BALL_R + STAR_R) {
        o.star.taken = true;
        state.stars++;
        if (state.shield < MAX_SHIELD) state.shield++;
      }
    }

    if (!o.passed && o.x + WALL_W < BALL_X) {
      o.passed = true;
      state.score++;
      if (state.score % GATES_PER_LEVEL === 0) {
        if (state.level >= LEVEL_COUNT) {
          state.status = 'won';
          state.overReason = 'Bütün bölümleri geçtin';
          return state;
        }
        state.level++;
      }
    }
    if (!o.hit && o.x < BALL_X + BALL_R && o.x + WALL_W > BALL_X - BALL_R) {
      if (state.y - BALL_R < o.gapY || state.y + BALL_R > o.gapY + o.gapH) {
        if (state.shield > 0) {
          state.shield--;
          state.shieldUsed++;
          o.hit = true; // kalkan bu duvarı deler; aynı duvar ikinci kez öldürmez
        } else {
          state.status = 'over';
          state.overReason = 'Duvara çarptın';
          return state;
        }
      }
    }
  }
  var kept = [];
  for (var j = 0; j < state.obstacles.length; j++) {
    if (state.obstacles[j].x + WALL_W > -10) kept.push(state.obstacles[j]);
  }
  state.obstacles = kept;

  state.distance += state.speed * dt;
  return state;
}

var CONST = {
  CANVAS_W: CANVAS_W, CANVAS_H: CANVAS_H, BALL_X: BALL_X, BALL_R: BALL_R,
  FLOOR_Y: FLOOR_Y, CEIL_Y: CEIL_Y, WALL_W: WALL_W,
  SPEED0: SPEED0, SPEED_MAX: SPEED_MAX, GAP_H0: GAP_H0, GAP_MIN: GAP_MIN,
  LEVEL_COUNT: LEVEL_COUNT, GATES_PER_LEVEL: GATES_PER_LEVEL, STAR_R: STAR_R,
  STAR_FROM: STAR_FROM, MOVE_FROM: MOVE_FROM, DOUBLE_FROM: DOUBLE_FROM, MAX_JUMP: MAX_JUMP
};
var API = { createState: createState, step: step, difficulty: difficulty, CONST: CONST };
if (typeof module !== 'undefined') module.exports = API;
if (typeof window !== 'undefined') window.GameLogic = API;

</script>
<script>
// Sekme Gücü — yalnızca çizim, state değiştirmez
// view: { best, muted, phase: 'ready'|'playing'|'paused'|'over', fx, touch, newBest, canRestart }
//   fx: { particles: [{x,y,life,max,color}], shake: 0..1, squash: 0..1, trail: [{x,y}] }

var W0 = 520;
var H0 = 540;
var FLOOR_Y = 480;
var CEIL_Y = 30;
var BALL_X = 160;
var BALL_R = 12;
var WALL_W = 28;

function overlay(ctx, lines) {
  ctx.fillStyle = 'rgba(5,7,12,0.72)';
  ctx.fillRect(0, 0, W0, H0);
  ctx.textAlign = 'center';
  var y = H0 / 2 - (lines.length - 1) * 16;
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    ctx.fillStyle = l.color || '#e8ecf1';
    ctx.font = l.font || '18px system-ui, sans-serif';
    ctx.fillText(l.text, W0 / 2, y);
    y += l.gap || 32;
  }
  ctx.textAlign = 'left';
}

function starShape(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var rr = i % 2 === 0 ? r : r * 0.45;
    var px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function draw(ctx, state, view) {
  view = view || {};
  var fx = view.fx || {};
  var best = view.best || 0;
  var phase = view.phase || state.status;
  // Canvas piksel boyutu main.js'de DPR'ye göre ayarlanır; burada mantıksal 520x540 ile çizilir.
  var scale = ctx.canvas.width / W0;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, W0, H0);

  // Ekran sarsıntısı (≤ 200 ms, zamanlamayı main.js yapar)
  var shake = fx.shake || 0;
  if (shake > 0) {
    var amp = 7 * shake;
    ctx.translate((Math.random() * 2 - 1) * amp, (Math.random() * 2 - 1) * amp);
  }

  ctx.strokeStyle = '#223352';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, CEIL_Y);
  ctx.lineTo(W0, CEIL_Y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y);
  ctx.lineTo(W0, FLOOR_Y);
  ctx.stroke();

  for (var i = 0; i < state.obstacles.length; i++) {
    var o = state.obstacles[i];
    // Hareketli kapı mor tonlu, delinen (kalkanla) duvar soluk
    ctx.fillStyle = o.hit ? '#141c2c' : (o.passed ? '#16233b' : (o.move ? '#2b2650' : '#1f3150'));
    ctx.fillRect(o.x, CEIL_Y, WALL_W, o.gapY - CEIL_Y);
    ctx.fillRect(o.x, o.gapY + o.gapH, WALL_W, FLOOR_Y - (o.gapY + o.gapH));
    // Kapı ağzını belirginleştiren ince kenar
    ctx.fillStyle = o.passed ? '#2a3c5c' : (o.move ? '#b39dfa' : '#5ac8fa');
    ctx.fillRect(o.x, o.gapY - 3, WALL_W, 3);
    ctx.fillRect(o.x, o.gapY + o.gapH, WALL_W, 3);
  }

  // Yıldızlar (kapı ortasında; toplanınca kalkan)
  for (var si = 0; si < state.obstacles.length; si++) {
    var so = state.obstacles[si];
    if (!so.star || so.star.taken) continue;
    starShape(ctx, so.x + WALL_W / 2, so.gapY + so.gapH / 2, 9, '#ffd166');
  }

  // İz
  var trail = fx.trail || [];
  for (var t = 0; t < trail.length; t++) {
    var a = (t + 1) / (trail.length + 1);
    ctx.fillStyle = 'rgba(90,200,250,' + (0.25 * a).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(trail[t].x, trail[t].y, BALL_R * (0.4 + 0.5 * a), 0, Math.PI * 2);
    ctx.fill();
  }

  // Top — zemine çarpınca kısa basılma
  var sq = fx.squash || 0;
  var sx = 1 + 0.35 * sq;
  var sy = 1 - 0.3 * sq;
  ctx.fillStyle = state.status === 'over' ? '#e05656' : '#5ac8fa';
  ctx.save();
  ctx.translate(BALL_X, state.y + BALL_R * (1 - sy));
  ctx.scale(sx, sy);
  ctx.beginPath();
  ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Kalkan halkası
  if (state.shield > 0 && state.status === 'playing') {
    ctx.strokeStyle = 'rgba(255,209,102,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(BALL_X, state.y, BALL_R + 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Parçacıklar
  var ps = fx.particles || [];
  for (var p = 0; p < ps.length; p++) {
    var q = ps[p];
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  ctx.fillStyle = '#e8ecf1';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Kapı: ' + state.score, 14, 24);
  ctx.textAlign = 'center';
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillStyle = '#9fb3d1';
  var lvCount = view.levelCount || 10;
  var per = view.gatesPerLevel || 8;
  ctx.fillText('Bölüm ' + state.level + '/' + lvCount + '  ·  ' + (state.score % per) + '/' + per, W0 / 2, 23);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#e8ecf1';
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillText('Rekor: ' + best, W0 - 14, 24);
  ctx.textAlign = 'left';
  if (state.shield > 0) starShape(ctx, W0 - 24, FLOOR_Y + 24, 8, '#ffd166');

  // Bölüm geçişi yazısı (main.js süreyi tutar)
  if (view.banner && view.banner.a > 0) {
    ctx.globalAlpha = Math.min(1, view.banner.a);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8ecf1';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(view.banner.title, W0 / 2, 150);
    if (view.banner.sub) {
      ctx.font = '17px system-ui, sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(view.banner.sub, W0 / 2, 182);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  if (view.muted) {
    ctx.fillStyle = '#7c8aa5';
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText('sessiz', 14, FLOOR_Y + 28);
  }

  var tapWord = view.touch ? 'Dokun' : 'Boşluk / dokun';
  if (phase === 'ready') {
    overlay(ctx, [
      { text: 'Sekme Gücü', font: 'bold 30px system-ui, sans-serif', gap: 40 },
      { text: 'Basılı tut: top yükselir · bırak: düşer' },
      { text: 'Kapıları ıskalama, tavana değme', gap: 44 },
      { text: tapWord + ' ve başla', font: 'bold 20px system-ui, sans-serif', color: '#5ac8fa' }
    ]);
  } else if (phase === 'paused') {
    overlay(ctx, [
      { text: 'Duraklatıldı', font: 'bold 26px system-ui, sans-serif', gap: 40 },
      { text: tapWord + ' ve devam et', color: '#5ac8fa' }
    ]);
  } else if (phase === 'won') {
    overlay(ctx, [
      { text: 'Kazandın!', font: 'bold 32px system-ui, sans-serif', color: '#ffd166', gap: 40 },
      { text: state.overReason },
      { text: 'Kapı: ' + state.score + '   Yıldız: ' + state.stars, gap: 44 },
      view.canRestart
        ? { text: (view.touch ? 'Dokun' : 'Dokun ya da R') + ': yeniden oyna', font: '16px system-ui, sans-serif', color: '#5ac8fa' }
        : { text: ' ', font: '16px system-ui, sans-serif' }
    ]);
  } else if (phase === 'over') {
    var lines = [
      { text: 'Oyun bitti', font: 'bold 28px system-ui, sans-serif', gap: 36 },
      { text: state.overReason },
      { text: 'Bölüm ' + state.level + '’e kadar geldin', font: '16px system-ui, sans-serif', color: '#9fb3d1' }
    ];
    if (view.newBest) lines.push({ text: 'Yeni rekor!', font: 'bold 20px system-ui, sans-serif', color: '#ffd166' });
    lines.push({ text: 'Kapı: ' + state.score + '   Rekor: ' + best, gap: 44 });
    lines.push(view.canRestart
      ? { text: (view.touch ? 'Dokun' : 'Dokun ya da R') + ': yeniden başla', font: '16px system-ui, sans-serif', color: '#5ac8fa' }
      : { text: ' ', font: '16px system-ui, sans-serif' });
    overlay(ctx, lines);
  }
}

if (typeof module !== 'undefined') module.exports = { draw: draw };
if (typeof window !== 'undefined') window.GameRender = { draw: draw };

</script>
<script>
// Sekme Gücü — döngü, girdi, ses, efektler; logic + render'ı bağlar
//
// Akış (phase): ready → playing ⇄ paused → over | won → (dokun/R) → playing
// Mobil: ekranın her yeri dokunma alanıdır; parmak canvas dışına kayınca da bırakma
// algılanır; sekme arka plana geçince oyun kendiliğinden duraklar.

var RESTART_LOCK_MS = 450; // ölümden hemen sonraki dokunuş yanlışlıkla yeniden başlatmasın
var SHAKE_MS = 180;
var SQUASH_MS = 120;
var TRAIL_LEN = 6;

function bootstrap() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DT = 1 / 60;
  var C = window.GameLogic.CONST;

  // Keskin çizim: canvas'ın piksel boyutu ekran yoğunluğuna göre, görünen boyutu CSS'ten.
  var dpr = Math.min(3, Math.max(1, (window.devicePixelRatio || 1)));
  canvas.width = Math.round(C.CANVAS_W * dpr);
  canvas.height = Math.round(C.CANVAS_H * dpr);

  var touch = false;
  var input = { action: false };
  var muted = false;
  var best = 0;
  try {
    var saved = window.localStorage.getItem('sekmeguc-best');
    if (saved) best = parseInt(saved, 10) || 0;
  } catch (e) {}

  var audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    } catch (e) {
      audioCtx = null;
    }
    return audioCtx;
  }
  function beep(freq, dur, type) {
    if (muted) return;
    var ac = ensureAudio();
    if (!ac) return;
    try {
      if (ac.state === 'suspended' && ac.resume) ac.resume();
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.08;
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      osc.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  function buzz(ms) {
    if (muted) return;
    try {
      if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(ms);
    } catch (e) {}
  }

  // Efekt durumu — oyun mantığından ayrı; testler mantığı bundan bağımsız doğrular.
  var fx = { particles: [], shake: 0, squash: 0, trail: [] };
  var shakeLeft = 0;
  var squashLeft = 0;
  function burst(x, y, n, color, speed) {
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = speed * (0.4 + Math.random() * 0.6);
      fx.particles.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.5, max: 0.5, color: color });
    }
    if (fx.particles.length > 160) fx.particles.splice(0, fx.particles.length - 160);
  }
  function updateFx(dt) {
    var kept = [];
    for (var i = 0; i < fx.particles.length; i++) {
      var p = fx.particles[i];
      p.life -= dt;
      if (p.life <= 0) continue;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 600 * dt;
      kept.push(p);
    }
    fx.particles = kept;
    shakeLeft = Math.max(0, shakeLeft - dt * 1000);
    squashLeft = Math.max(0, squashLeft - dt * 1000);
    fx.shake = shakeLeft / SHAKE_MS;
    fx.squash = squashLeft / SQUASH_MS;
  }

  function newGame() {
    var seed = Date.now() % 2147483647;
    return window.GameLogic.createState(seed);
  }

  var state = newGame();
  var phase = 'ready';
  var overAt = 0;
  var newBest = false;
  var prevBounces = state.bounces;
  var prevScore = state.score;
  var prevLevel = state.level;
  var prevStars = state.stars;
  var prevShieldUsed = state.shieldUsed;
  var banner = { title: 'Bölüm 1', sub: '', a: 0 };

  function nowMs() { return Date.now(); }

  function startPlaying() {
    if (phase === 'ready') banner = { title: 'Bölüm 1', sub: '', a: 1.4 };
    phase = 'playing';
    ensureAudio();
  }
  function restart() {
    state = newGame();
    prevBounces = state.bounces;
    prevScore = state.score;
    prevLevel = state.level;
    prevStars = state.stars;
    prevShieldUsed = state.shieldUsed;
    banner = { title: 'Bölüm 1', sub: '', a: 1.4 };
    newBest = false;
    fx.particles = [];
    fx.trail = [];
    shakeLeft = 0;
    squashLeft = 0;
    startPlaying();
  }
  function canRestart() {
    return nowMs() - overAt >= RESTART_LOCK_MS;
  }

  // Ortak "bas" ve "bırak" — klavye ve dokunuş aynı yoldan geçer.
  function press() {
    if (phase === 'ready' || phase === 'paused') { startPlaying(); input.action = true; return; }
    if (phase === 'over' || phase === 'won') { if (canRestart()) { restart(); input.action = true; } return; }
    input.action = true;
  }
  function release() {
    input.action = false;
  }

  function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (e.repeat) return;
      press();
    } else if (e.code === 'KeyR') {
      e.preventDefault();
      restart(); // R bilinçli bir tuş: kilit uygulanmaz
    } else if (e.code === 'KeyM') {
      e.preventDefault();
      muted = !muted;
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      e.preventDefault();
      if (phase === 'playing') pause();
      else if (phase === 'paused') startPlaying();
    }
  }
  function onKeyUp(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      release();
    }
  }
  function onPointerDown(e) {
    if (e.pointerType === 'touch' || e.pointerType === 'pen') touch = true;
    if (e.cancelable) e.preventDefault();
    press();
  }
  function onPointerUp(e) {
    if (e && e.cancelable) e.preventDefault();
    release();
  }
  function pause() {
    if (phase !== 'playing') return;
    phase = 'paused';
    release();
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  // Bütün ekran dokunma alanı; bırakma pencere düzeyinde dinlenir ki parmak kayınca kaçmasın.
  window.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointerup', onPointerUp, { passive: false });
  window.addEventListener('pointercancel', onPointerUp);
  window.addEventListener('blur', function () { release(); pause(); });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) pause();
    });
  }

  var acc = 0;
  var last = null;

  function frame(ts) {
    if (last === null) last = ts;
    var frameDt = (ts - last) / 1000;
    last = ts;
    if (frameDt > 0.25) frameDt = 0.25;

    if (phase === 'playing') {
      acc += frameDt;
      var steps = 0;
      while (acc >= DT && steps < 5) {
        state = window.GameLogic.step(state, input, DT);
        acc -= DT;
        steps++;

        if (state.bounces !== prevBounces) {
          beep(220, 0.06, 'square');
          squashLeft = SQUASH_MS;
          burst(C.BALL_X, C.FLOOR_Y, 4, '#2f4a73', 120);
          prevBounces = state.bounces;
        }
        if (state.score !== prevScore) {
          beep(660 + Math.min(state.score, 30) * 12, 0.08, 'sine');
          buzz(8);
          burst(C.BALL_X, state.y, 10, '#5ac8fa', 220);
          prevScore = state.score;
        }
        if (state.stars !== prevStars) {
          beep(990, 0.07, 'triangle');
          beep(1320, 0.09, 'triangle');
          burst(C.BALL_X, state.y, 12, '#ffd166', 200);
          prevStars = state.stars;
        }
        if (state.shieldUsed !== prevShieldUsed) {
          beep(300, 0.12, 'square');
          buzz(30);
          shakeLeft = SHAKE_MS * 0.6;
          burst(C.BALL_X + 14, state.y, 16, '#ffd166', 260);
          prevShieldUsed = state.shieldUsed;
        }
        if (state.level !== prevLevel) {
          var sub = state.level === C.STAR_FROM ? 'Yıldız topla: bir çarpmayı affeder'
            : state.level === C.MOVE_FROM ? 'Mor kapılar hareket eder'
            : state.level === C.DOUBLE_FROM ? 'Çift duvarlar geliyor' : '';
          banner = { title: 'Bölüm ' + state.level, sub: sub, a: sub ? 2.2 : 1.4 };
          beep(523, 0.08, 'sine'); beep(784, 0.12, 'sine');
          prevLevel = state.level;
        }
        if (state.status === 'won') {
          beep(523, 0.1, 'sine'); beep(659, 0.1, 'sine'); beep(784, 0.2, 'sine');
          buzz(40);
          burst(C.BALL_X, state.y, 40, '#ffd166', 360);
          if (state.score > best) {
            best = state.score;
            newBest = true;
            try { window.localStorage.setItem('sekmeguc-best', String(best)); } catch (e) {}
          }
          phase = 'won';
          overAt = nowMs();
          input.action = false;
          acc = 0;
          break;
        }
        if (state.status === 'over') {
          beep(110, 0.25, 'sawtooth');
          buzz(60);
          shakeLeft = SHAKE_MS;
          burst(C.BALL_X, state.y, 24, '#e05656', 320);
          if (state.score > best) {
            best = state.score;
            newBest = true;
            try { window.localStorage.setItem('sekmeguc-best', String(best)); } catch (e) {}
          }
          phase = 'over';
          overAt = nowMs();
          input.action = false;
          acc = 0;
          break;
        }
      }
      fx.trail.push({ x: C.BALL_X, y: state.y });
      if (fx.trail.length > TRAIL_LEN) fx.trail.shift();
    } else {
      acc = 0;
    }
    updateFx(frameDt);
    if (banner.a > 0 && phase === 'playing') banner.a = Math.max(0, banner.a - frameDt);

    window.GameRender.draw(ctx, state, {
      best: best, muted: muted, phase: phase, fx: fx, touch: touch,
      newBest: newBest, canRestart: (phase === 'over' || phase === 'won') && canRestart(),
      banner: banner, levelCount: C.LEVEL_COUNT, gatesPerLevel: C.GATES_PER_LEVEL
    });
    window.requestAnimationFrame(frame);
  }

  window.requestAnimationFrame(frame);
}

if (typeof window !== 'undefined') {
  window.GameMain = { bootstrap: bootstrap };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
}
if (typeof module !== 'undefined') module.exports = { bootstrap: bootstrap };

</script>

</body>
</html>
