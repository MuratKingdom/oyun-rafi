<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bopgate</title>
<style>
  :root {
    --font: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
    --cyan: #5ac8fa; --mor: #b39dfa; --altin: #ffd166; --turuncu: #ff9f43; --pembe: #ff5d7a; --yesil: #46d39a;
    --metin: #e8ecf1; --soluk: #8fa3c4;
    --cam: rgba(16,24,44,0.86); --cizgi: rgba(90,200,250,0.35);
    --hud: 76px; /* alttaki ipucu + düğmeler; main.js HUD_PX ile aynı */
  }
  @media (pointer: coarse) { :root { --hud: 60px; } }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(120% 80% at 50% 0%, #121c36 0%, #05070c 60%) #05070c;
    color: var(--metin);
    font-family: var(--font);
    height: 100%;
    overflow: hidden;
    /* Dokunurken kaydırma, yakınlaştırma, metin seçme ve uzun-basma menüsü olmasın */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas {
    display: block;
    background: #0b1220;
    border: 1px solid var(--cizgi);
    border-radius: 14px;
    box-shadow: 0 0 28px rgba(90,200,250,0.16), inset 0 0 0 1px rgba(255,255,255,0.03);
    /* Mantıksal alan 520 x --h (main.js ayarlar: 540–1000). Oranı koruyarak ekrana sığ;
       uzun telefonda alan da uzadığı için üstte/altta boşluk kalmaz. */
    --h: 540; --w: 520; /* görünen mantıksal genişlik: büyük görünümde 420 (main.js) */
    /* Durum/gezinme çubuğu payı (Android edge-to-edge) düşülür; tarayıcıda env() 0'dır */
    width: min(calc((100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) * 0.98), 760px,
      calc((100dvh - var(--hud) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * var(--w) / var(--h)));
    aspect-ratio: var(--w) / var(--h);
    height: auto;
  }
  @supports not (height: 100dvh) {
    canvas { width: min(98vw, 760px, calc((100vh - var(--hud) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * var(--w) / var(--h))); }
  }
  #hint {
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: #61708d;
    text-align: center;
    max-width: 500px;
    padding: 0 8px;
  }
  .dugmeler { display: flex; gap: 8px; justify-content: center; min-height: 0; padding: 0 8px; box-sizing: border-box; max-width: 100%; }
  .dugmeler button { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform 0.08s ease; }
  .dugmeler button:active { transform: scale(0.95); }
  #magazaBtn {
    font: 800 15px var(--font); letter-spacing: 0.02em;
    color: #1a1206; background: linear-gradient(180deg, #ffe08a, var(--turuncu)); border: 0; border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
    box-shadow: 0 0 18px rgba(255,159,67,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  #gorevBtn {
    font: 800 15px var(--font); letter-spacing: 0.02em;
    color: var(--metin); background: var(--cam); border: 1px solid var(--cizgi); border-radius: 999px;
    padding: 10px 18px; cursor: pointer; box-shadow: 0 0 14px rgba(90,200,250,0.18);
  }
  #gorevBtn[hidden], #liderBtn[hidden] { display: none; }
  #muzikBtn, #sesBtn, #dilBtn, #liderBtn, #ayarBtn, #kolayBtn {
    font: inherit; font-size: 18px; width: 44px; height: 44px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(143,163,196,0.35); background: var(--cam); color: var(--metin); cursor: pointer;
  }
  #dilBtn { font: 900 13px var(--font); letter-spacing: 0.04em; }
  #muzikBtn.kapali { opacity: 0.45; text-decoration: line-through; }
  #kolayBtn { opacity: 0.55; }
  #kolayBtn.acik { opacity: 1; border-color: var(--yesil); box-shadow: 0 0 12px rgba(70,211,154,0.5); }
  .ayar-kutu { position: relative; display: flex; }
  #ayarBtn[aria-expanded="true"] { border-color: var(--cyan); box-shadow: 0 0 12px rgba(90,200,250,0.45); }
  #ayarlar {
    position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 5;
    display: flex; gap: 6px; padding: 6px; border-radius: 999px;
    background: var(--cam); border: 1px solid var(--cizgi); box-shadow: 0 0 18px rgba(90,200,250,0.22);
  }
  #ayarlar[hidden] { display: none; }
  #devamBtn {
    font: 900 15px var(--font); color: #fff; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ff8aa0, #e0405e);
    box-shadow: 0 0 20px rgba(255,93,122,0.55), inset 0 1px 0 rgba(255,255,255,0.4);
    padding: 10px 20px; cursor: pointer; animation: nabiz 1s ease-in-out infinite;
  }
  #devamBtn[hidden], #reklamDevamBtn[hidden], #ikiKatBtn[hidden] { display: none; }
  #reklamDevamBtn, #ikiKatBtn {
    font: 900 15px var(--font); color: #05070c; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    background: linear-gradient(180deg, #a6ecff, var(--cyan)); box-shadow: 0 0 18px rgba(90,200,250,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  #ikiKatBtn { color: #1a1206; background: linear-gradient(180deg, #ffe08a, var(--turuncu)); box-shadow: 0 0 18px rgba(255,159,67,0.5); animation: nabiz 1.2s ease-in-out infinite; }
  @keyframes nabiz { 50% { transform: scale(1.06); } }

  /* --- Mağaza ve görevler paneli --- */
  #magaza {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(3,5,10,0.78);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
  }
  #magaza[hidden], #magazaBtn[hidden] { display: none; }
  #magaza .panel {
    width: min(440px, 100%); max-height: 100%;
    display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(180deg, rgba(24,34,60,0.97), rgba(10,14,26,0.97));
    border: 1px solid var(--cizgi); border-radius: 22px; padding: 16px;
    box-shadow: 0 0 34px rgba(90,200,250,0.22), inset 0 1px 0 rgba(255,255,255,0.06);
    box-sizing: border-box;
  }
  #magaza header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #magaza h2 {
    margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--mor)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #magaza .cuzdan {
    color: var(--altin); font-weight: 900; font-size: 17px; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,209,102,0.12); border: 1px solid rgba(255,209,102,0.45);
  }
  #magaza .kapat {
    font: 800 14px var(--font); color: var(--metin); background: rgba(255,255,255,0.06);
    border: 1px solid rgba(143,163,196,0.35); border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  #magaza .sekmeler {
    display: grid; grid-template-columns: repeat(4, 1fr) 0.7fr; gap: 4px; padding: 4px;
    background: rgba(0,0,0,0.3); border-radius: 14px;
  }
  #magaza [data-sekme] {
    font: 800 14px var(--font); color: var(--soluk); background: transparent; border: 0;
    border-radius: 10px; padding: 9px 4px; cursor: pointer;
  }
  #magaza [data-sekme][aria-selected="true"] {
    color: #05070c; background: linear-gradient(180deg, #8fe0ff, var(--cyan));
    box-shadow: 0 0 14px rgba(90,200,250,0.5);
  }
  #magaza .liste { overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 2px; }
  #magaza .urun {
    display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(143,163,196,0.18); border-radius: 16px; padding: 10px;
  }
  #magaza .urun:has(.kusanildi) { border-color: rgba(90,200,250,0.6); box-shadow: 0 0 14px rgba(90,200,250,0.2); }
  #magaza .onizleme { width: 76px; height: 55px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  #magaza .ad { font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
  @media (max-width: 400px) {
    #magaza .panel { padding: 12px; }
    #magaza .urun { grid-template-columns: 60px minmax(0, 1fr) auto; gap: 9px; padding: 8px; }
    #magaza .onizleme { width: 60px; height: 44px; }
    #magaza .guc .basamak { width: 60px; letter-spacing: 1px; }
    #magaza .urun button { min-width: 80px; font-size: 13px; padding: 0 10px; }
    #magaza .ad { font-size: 15px; }
  }
  #magaza .urun button {
    font: 900 14px var(--font); min-width: 96px; min-height: 42px;
    border-radius: 999px; border: 0; cursor: pointer; color: #05070c;
    background: linear-gradient(180deg, #8fe0ff, var(--cyan));
  }
  #magaza .urun button.al {
    color: #1a1206; background: linear-gradient(180deg, #ffe08a, var(--turuncu));
    box-shadow: 0 0 12px rgba(255,159,67,0.35);
  }
  #magaza .urun button.kusanildi {
    background: transparent; color: var(--cyan); border: 1px solid rgba(90,200,250,0.5); cursor: default; box-shadow: none;
  }
  #magaza .urun button:disabled.al { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
  /* Yıldızı yetmeyen ürün: soluk turuncu yerine altın çerçeveli, okunur fiyat */
  #magaza .urun button.al.yetmez:disabled {
    opacity: 1; color: rgba(255,209,102,0.8); background: rgba(255,209,102,0.06);
    border: 1px solid rgba(255,209,102,0.35);
  }
  #magaza .not { font-size: 12px; color: var(--soluk); margin: 0; line-height: 1.4; }
  #magaza .urun button.para {
    color: #fff; background: linear-gradient(180deg, #c58bff, #7a4dff); box-shadow: 0 0 14px rgba(150,100,255,0.45);
  }
  #magaza .urun button.para:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; }
  #magaza .urun.premium { border-color: rgba(197,139,255,0.45); }
  #magaza .paket { grid-template-columns: 44px minmax(0, 1fr) auto; }
  #magaza .paket .paket-ikon { font-size: 30px; text-align: center; filter: drop-shadow(0 0 8px rgba(197,139,255,0.6)); }
  #magaza .paket .etki { display: block; font-size: 12.5px; color: var(--soluk); margin-top: 3px; font-weight: 500; }
  #magaza .paket.en-iyi { border-color: rgba(255,209,102,0.7); box-shadow: 0 0 16px rgba(255,209,102,0.25); }
  #magaza .geri-yukle {
    font: 800 13px var(--font); color: var(--soluk); background: transparent; border: 1px solid rgba(143,163,196,0.35);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; align-self: center;
  }
  #magaza .guc .basamak { width: 76px; text-align: center; color: var(--altin); font-size: 18px; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,209,102,0.6); }
  #magaza .guc .etki { display: block; font-size: 12.5px; color: var(--soluk); margin-top: 3px; font-weight: 500; }
  #magaza .seri {
    margin: 0; padding: 10px 12px; border-radius: 14px; color: var(--altin); font-weight: 800; font-size: 14px;
    background: rgba(255,209,102,0.08); border: 1px solid rgba(255,209,102,0.3);
  }
  #magaza .gorev {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 10px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(143,163,196,0.18); border-radius: 16px; padding: 12px 14px;
  }
  #magaza .gorev .ad { font-size: 15px; }
  #magaza .gorev .odul { color: var(--altin); font-size: 13px; font-weight: 800; white-space: nowrap; }
  #magaza .gorev .cubuk { grid-column: 1 / -1; height: 8px; background: rgba(0,0,0,0.35); border-radius: 4px; overflow: hidden; }
  #magaza .gorev .cubuk i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--mor)); border-radius: 4px; box-shadow: 0 0 8px rgba(90,200,250,0.6); }
  #magaza .gorev.bitti { border-color: rgba(70,211,154,0.5); }
  #magaza .gorev.bitti .cubuk i { background: var(--yesil); box-shadow: 0 0 8px rgba(70,211,154,0.6); }
  #magaza .gorev.bitti .ad { color: var(--yesil); }
  @media (prefers-reduced-motion: reduce) { #devamBtn { animation: none; } .dugmeler button { transition: none; } }
  /* Dokunmatikte ipucu tekrarı gereksiz: açılış ekranı zaten "Basılı tut · yüksel · kapıdan geç" diyor */
  @media (pointer: coarse) {
    #hint { display: none; }
  }
  /* Dar telefon: dört düğme tek satıra sığsın (ayrıntılı kurallardan sonra gelmeli) */
  @media (max-width: 440px) {
    .dugmeler { gap: 5px; padding: 0 6px; }
    #magazaBtn, #gorevBtn { padding: 8px 10px; font-size: 12.5px; }
    #muzikBtn, #sesBtn, #dilBtn, #liderBtn, #ayarBtn, #kolayBtn { width: 34px; height: 34px; font-size: 15px; }
    #dilBtn { font-size: 11px; }
  }
  @media (max-width: 380px) {
    #magazaBtn, #gorevBtn { padding: 7px 8px; font-size: 12px; }
    #muzikBtn, #sesBtn, #dilBtn, #liderBtn, #ayarBtn, #kolayBtn { width: 31px; height: 31px; font-size: 14px; }
  }
  @media (max-width: 340px) {
    .dugmeler { gap: 3px; padding: 0 3px; }
    #magazaBtn, #gorevBtn { padding: 6px 7px; font-size: 11px; letter-spacing: 0; }
    #muzikBtn, #sesBtn, #dilBtn, #liderBtn, #ayarBtn, #kolayBtn { width: 27px; height: 27px; font-size: 12px; }
    #dilBtn { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="540"></canvas>
  <div id="hint"><span data-i18n="Ekranın herhangi bir yerine basılı tut: yükseklik kazan">Ekranın herhangi bir yerine basılı tut: yükseklik kazan</span><span class="kb" data-i18n=" · Boşluk / ↑ · R: yeniden · M: ses · P: duraklat"> · Boşluk / ↑ · R: yeniden · M: ses · P: duraklat</span></div>
  <div class="dugmeler"><button id="devamBtn" type="button" data-ui hidden>❤ Devam</button><button id="reklamDevamBtn" type="button" data-ui hidden>📺 Reklamla devam</button><button id="ikiKatBtn" type="button" data-ui hidden>📺 ★ x2</button><button id="magazaBtn" type="button" data-ui hidden data-i18n="🛒 Mağaza">🛒 Mağaza</button><button id="gorevBtn" type="button" data-ui hidden>📋 Görevler</button><button id="liderBtn" class="ikon" type="button" data-ui hidden aria-label="Liderlik tablosu" data-i18n-aria="Liderlik tablosu">🏆</button><span class="ayar-kutu" data-ui><button id="ayarBtn" class="ikon" type="button" data-ui aria-label="Ayarlar" data-i18n-aria="Ayarlar" aria-expanded="false" aria-controls="ayarlar">⚙</button><span id="ayarlar" data-ui hidden><button id="kolayBtn" class="ikon" type="button" data-ui aria-label="Kolay mod" data-i18n-aria="Kolay mod">🐢</button><button id="muzikBtn" class="ikon" type="button" data-ui aria-label="Müzik" data-i18n-aria="Müzik">🎵</button><button id="sesBtn" class="ikon" type="button" data-ui aria-label="Efekt sesleri" data-i18n-aria="Efekt sesleri">🔊</button><button id="dilBtn" class="ikon" type="button" data-ui aria-label="Dil" data-i18n-aria="Dil">TR</button></span></span></div>
</div>
<div id="magaza" data-ui hidden role="dialog" aria-label="Mağaza">
  <div class="panel">
    <header><h2 data-i18n="Mağaza">Mağaza</h2><span class="cuzdan">★ 0</span><button class="kapat" type="button" data-i18n="Kapat">Kapat</button></header>
    <div class="sekmeler" role="tablist">
      <button type="button" role="tab" data-sekme="ball" aria-selected="true" data-i18n="Top">Top</button>
      <button type="button" role="tab" data-sekme="map" aria-selected="false" data-i18n="Harita">Harita</button>
      <button type="button" role="tab" data-sekme="upg" aria-selected="false" data-i18n="Güç">Güç</button>
      <button type="button" role="tab" data-sekme="quests" aria-selected="false" data-i18n="Görevler">Görevler</button>
      <button type="button" role="tab" data-sekme="premium" aria-selected="false">💎</button>
    </div>
    <div class="liste"></div>
    <p class="not" data-i18n="Yıldız kazanmak için: oyunda yıldız topla, günlük görevleri bitir, her 10 bölümlük eşik +5.">Yıldız kazanmak için: oyunda yıldız topla, günlük görevleri bitir, her 10 bölümlük eşik +5.</p>
  </div>
</div>
<script src="i18n.js"></script>
<script src="logic.js"></script>
<script src="shop.js"></script>
<script src="monetize.js"></script>
<script src="cloud.js"></script>
<script src="quests.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
