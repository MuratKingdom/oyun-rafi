<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sekme Gücü</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070c;
    color: #e8ecf1;
    font-family: system-ui, sans-serif;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  canvas {
    background: #0b1220;
    border: 2px solid #223;
    max-width: 96vw;
    height: auto;
    touch-action: manipulation;
  }
  #hint {
    font-size: 12px;
    color: #7c8aa5;
    text-align: center;
    max-width: 500px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="540"></canvas>
  <div id="hint">Boşluk / Yukarı ok / dokunuş (basılı tut): yükseklik kazan · R: yeniden başla · M: sesi kapat</div>
</div>
<script src="logic.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
