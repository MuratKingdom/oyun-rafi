<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambar Hesabı</title>
<style>
  html, body { margin: 0; background: #141821; color: #e8ecf3; font-family: system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; padding: 12px; }
  canvas { width: 100%; max-width: 480px; aspect-ratio: 1 / 1; touch-action: none; border-radius: 8px; }
  p { margin: 8px 0 0; font-size: 14px; color: #8a94a8; text-align: center; }
</style>
</head>
<body>
<main>
  <canvas id="game" width="480" height="480"></canvas>
  <p>Boşluk/B: ambar kur · X: ambar yık · tıkla: boş yere kur, ambara yık · Kışa yetecek tahılı sakla · R: yeniden · M: ses</p>
</main>
<script>/* logic.js */
'use strict';
// Ambar Hesabı — saf oyun mantığı. DOM yok, canvas yok.
// Tek kaynak (tahıl), sınırlı ambar kapasitesi. Hasat mevsiminde gelen fazlalık
// ancak yer varsa saklanır; kışın gelir yoktur. Her ambar kapasite verir ama bakım ister.

var C = {
  W: 480, H: 480,
  SEASON_T: 12,                 // saniye / mevsim
  SEASONS: ['İlkbahar', 'Yaz', 'Sonbahar', 'Kış'],
  INCOME: [4, 9, 2.5, 0],       // tahıl/sn, yıl çarpanıyla ölçeklenir
  EAT0: 3.0, EAT_STEP: 0.15,    // köy tüketimi/sn: EAT0 + EAT_STEP * (yıl-1)
  SILO_CAP: 30,                 // ambar başına kapasite
  SILO_COST: 14,                // yeni ambar maliyeti (tahıl)
  SILO_REFUND: 4,               // yıkınca geri gelen
  UPKEEP: 0.1,                 // ambar başına bakım/çürüme (tahıl/sn)
  MAX_SILO: 10, START_SILO: 1, START_GRAIN: 20,
  YEARS: 6,                     // 6 yıl dayanırsan kazanırsın
  FACTOR_MIN: 0.8, FACTOR_MAX: 1.2
};

function rng(s) { // mulberry32, durum state içinde
  s.rng = (s.rng + 0x6D2B79F5) >>> 0;
  var t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function rollFactor(s) {
  var f = C.FACTOR_MIN + (C.FACTOR_MAX - C.FACTOR_MIN) * rng(s);
  return Math.round(f * 20) / 20; // 0.05 adım
}

function createState(seed) {
  var s = {
    seed: seed >>> 0, rng: seed >>> 0,
    status: 'playing', overReason: '',
    time: 0, year: 1, season: 0, seasonT: 0,
    grain: C.START_GRAIN, silos: C.START_SILO,
    factor: 1, nextFactor: 1,
    wasted: 0, score: 0, events: []
  };
  s.factor = 1; // ilk yıl adil başlangıç
  s.nextFactor = rollFactor(s);
  return s;
}

function capacity(s) { return s.silos * C.SILO_CAP; }
function eatRate(s) { return C.EAT0 + C.EAT_STEP * (s.year - 1); }
function incomeRate(s) { return C.INCOME[s.season] * s.factor; }
function netRate(s) { return incomeRate(s) - eatRate(s) - s.silos * C.UPKEEP; }

function build(s) {
  if (s.silos >= C.MAX_SILO) { s.events.push({ type: 'deny', why: 'Ambar yeri dolu' }); return false; }
  if (s.grain < C.SILO_COST) { s.events.push({ type: 'deny', why: 'Yetersiz tahıl' }); return false; }
  s.grain -= C.SILO_COST; s.silos++;
  s.events.push({ type: 'build', slot: s.silos - 1 });
  return true;
}

function demolish(s) {
  if (s.silos <= 1) { s.events.push({ type: 'deny', why: 'Son ambar yıkılamaz' }); return false; }
  s.silos--;
  s.grain += C.SILO_REFUND;
  var cap = capacity(s);
  if (s.grain > cap) { s.wasted += s.grain - cap; s.grain = cap; }
  s.events.push({ type: 'demolish', slot: s.silos });
  return true;
}

function step(prev, input, dt) {
  var s = prev;
  s.events = [];
  input = input || {};
  if (input.restart) {
    var n = createState((s.seed * 1664525 + 1013904223) >>> 0);
    n.events.push({ type: 'restart' });
    return n;
  }
  if (s.status !== 'playing') return s;

  if (input.action) build(s);
  if (input.demolish) demolish(s);

  s.time += dt; s.seasonT += dt;
  var inc = incomeRate(s) * dt;
  var out = (eatRate(s) + s.silos * C.UPKEEP) * dt;
  s.grain += inc - out;
  var cap = capacity(s);
  if (s.grain > cap) {
    var over = s.grain - cap;
    s.wasted += over; s.grain = cap;
    s.events.push({ type: 'spill', amount: over });
  }
  s.score = Math.floor(s.time);

  if (s.grain < 0) {
    s.grain = 0;
    s.status = 'over';
    s.overReason = 'Ambar boşaldı: köy ' + C.SEASONS[s.season].toLowerCase() + ' mevsiminde aç kaldı (yıl ' + s.year + ')';
    s.events.push({ type: 'lose' });
    return s;
  }

  if (s.seasonT >= C.SEASON_T) {
    s.seasonT -= C.SEASON_T;
    s.season++;
    if (s.season >= 4) {
      s.season = 0;
      if (s.year >= C.YEARS) {
        s.status = 'won';
        s.score = Math.floor(s.time) + Math.floor(s.grain);
        s.events.push({ type: 'win' });
        return s;
      }
      s.year++;
      s.factor = s.nextFactor;
      s.nextFactor = rollFactor(s);
      s.events.push({ type: 'year', year: s.year });
    } else {
      s.events.push({ type: 'season', season: s.season });
    }
  }
  return s;
}

var GameLogicExports = { C: C, createState: createState, step: step,
  capacity: capacity, eatRate: eatRate, incomeRate: incomeRate, netRate: netRate };
if (typeof module !== 'undefined') module.exports = GameLogicExports;
if (typeof window !== 'undefined') window.GameLogic = GameLogicExports;
</script>
<script>/* render.js */
'use strict';
// Ambar Hesabı — yalnızca çizim. state'i değiştirmez.

var SEASON_COL = ['#7fbf6a', '#e2c044', '#c9803a', '#9fb4c8'];

function slotRect(i) {
  var col = i % 5, row = Math.floor(i / 5);
  return { x: 32 + col * 86, y: 170 + row * 128, w: 72, h: 112 };
}

function bar(ctx, x, y, w, h, frac, col, back) {
  ctx.fillStyle = back || '#232a38'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
}

function draw(ctx, s, view) {
  view = view || {};
  var C = view.C, L = view.L;
  var W = C.W, H = C.H;
  var sh = view.shake || { x: 0, y: 0 };
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#141821'; ctx.fillRect(0, 0, W, H);
  ctx.translate(sh.x, sh.y);

  var cap = L.capacity(s), net = L.netRate(s);
  var sc = SEASON_COL[s.season];

  // Üst bilgi
  ctx.font = 'bold 18px system-ui, sans-serif'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = '#e8ecf3';
  ctx.fillText('Yıl ' + s.year + '/' + C.YEARS + ' · ' + C.SEASONS[s.season], 16, 12);
  ctx.textAlign = 'right';
  ctx.fillText('Skor ' + s.score + '  Rekor ' + (view.best || 0), W - 16, 12);
  ctx.textAlign = 'left';
  bar(ctx, 16, 38, W - 32, 6, s.seasonT / C.SEASON_T, sc);

  // Tahıl / kapasite
  var full = cap > 0 ? s.grain / cap : 0;
  var spillOn = view.spillFlash > 0;
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillStyle = spillOn ? '#ff6b6b' : (s.grain < 12 ? '#ff9f43' : '#f2d16b');
  ctx.fillText('Tahıl ' + Math.floor(s.grain) + ' / ' + cap, 16, 54);
  ctx.font = '16px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = net >= 0 ? '#7fd17f' : '#ff7b7b';
  ctx.fillText((net >= 0 ? '+' : '') + net.toFixed(1) + '/sn', W - 16, 62);
  ctx.textAlign = 'left';
  bar(ctx, 16, 88, W - 32, 14, full, spillOn ? '#ff6b6b' : '#f2d16b');

  ctx.font = '14px system-ui, sans-serif'; ctx.fillStyle = '#9aa4b8';
  ctx.fillText('Hasat bu yıl %' + Math.round(s.factor * 100) + ' · gelecek yıl %' + Math.round(s.nextFactor * 100) +
    ' · tüketim ' + L.eatRate(s).toFixed(2) + '/sn · taşan ' + Math.floor(s.wasted), 16, 112);
  ctx.fillText('Ambar: ' + C.SILO_COST + ' tahıl, +' + C.SILO_CAP + ' yer, bakım ' + C.UPKEEP + '/sn', 16, 130);

  // Ambarlar
  for (var i = 0; i < C.MAX_SILO; i++) {
    var r = slotRect(i);
    if (i < s.silos) {
      ctx.fillStyle = '#3a3226'; ctx.fillRect(r.x, r.y, r.w, r.h);
      var fh = (r.h - 20) * full;
      ctx.fillStyle = spillOn ? '#ff8a6b' : '#e8c35a';
      ctx.fillRect(r.x + 6, r.y + r.h - 6 - fh, r.w - 12, fh);
      ctx.strokeStyle = '#b08a52'; ctx.lineWidth = 3; ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.beginPath(); ctx.moveTo(r.x - 4, r.y); ctx.lineTo(r.x + r.w / 2, r.y - 16); ctx.lineTo(r.x + r.w + 4, r.y); ctx.closePath();
      ctx.fillStyle = '#8c3b2e'; ctx.fill();
    } else {
      ctx.strokeStyle = '#2f3746'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]); ctx.strokeRect(r.x, r.y, r.w, r.h); ctx.setLineDash([]);
      if (i === s.silos) {
        ctx.fillStyle = s.grain >= C.SILO_COST ? '#7fd17f' : '#55607a';
        ctx.font = 'bold 28px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('+', r.x + r.w / 2, r.y + r.h / 2 - 16);
        ctx.textAlign = 'left';
      }
    }
  }

  // Tarla şeridi
  ctx.fillStyle = sc; ctx.globalAlpha = 0.35; ctx.fillRect(0, H - 40, W, 40); ctx.globalAlpha = 1;
  ctx.fillStyle = '#e8ecf3'; ctx.font = '14px system-ui, sans-serif';
  ctx.fillText('Gelir ' + L.incomeRate(s).toFixed(1) + '/sn' + (s.season === 3 ? ' (kışın hasat yok)' : '') + (view.muted ? ' · ses kapalı' : ''), 16, H - 28);

  // Uyarı / ret mesajı
  if (view.msg && view.msgT > 0) {
    ctx.textAlign = 'center'; ctx.font = 'bold 16px system-ui, sans-serif'; ctx.fillStyle = '#ff9f43';
    ctx.fillText(view.msg, W / 2, H - 64); ctx.textAlign = 'left';
  }

  // Parçacıklar
  var ps = view.particles || [];
  for (var p = 0; p < ps.length; p++) {
    ctx.globalAlpha = Math.max(0, ps[p].life / ps[p].max); ctx.fillStyle = ps[p].color;
    ctx.fillRect(ps[p].x - 2, ps[p].y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Bitiş ekranı
  if (s.status === 'over' || s.status === 'won') {
    ctx.fillStyle = 'rgba(10,12,18,0.82)'; ctx.fillRect(0, 170, W, 170);
    ctx.textAlign = 'center';
    ctx.fillStyle = s.status === 'won' ? '#7fd17f' : '#ff6b6b';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillText(s.status === 'won' ? C.YEARS + ' yıl dayandın!' : 'Köy aç kaldı', W / 2, 190);
    ctx.fillStyle = '#e8ecf3'; ctx.font = '15px system-ui, sans-serif';
    ctx.fillText(s.status === 'won' ? 'Kalan tahıl skora eklendi.' : s.overReason, W / 2, 230);
    ctx.fillText('Skor ' + s.score + ' · Rekor ' + (view.best || 0) + ' · taşan ' + Math.floor(s.wasted), W / 2, 260);
    ctx.fillStyle = '#f2d16b'; ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('R / Boşluk / tıkla: yeniden başla', W / 2, 300);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

var GameRenderExports = { draw: draw, slotRect: slotRect };
if (typeof module !== 'undefined') module.exports = GameRenderExports;
if (typeof window !== 'undefined') window.GameRender = GameRenderExports;
</script>
<script>/* main.js */
'use strict';
// Ambar Hesabı — döngü, girdi, ses. logic + render'ı bağlar.
var ctrl = null;

function bootstrap() {
  if (ctrl) return ctrl;
  var L = window.GameLogic, R = window.GameRender, C = L.C;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DT = 1 / 60;
  var state = L.createState(newSeed());
  var pressed = { action: false, demolish: false, restart: false }; // basış mandalları
  var acc = 0, last = null, muted = false, audio = null;
  var shakeT = 0, spillFlash = 0, spillToneT = 0, msg = '', msgT = 0, particles = [], best = loadBest();

  function newSeed() { return (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0; }
  function loadBest() { try { return parseInt(localStorage.getItem('ambarhesabi.best') || '0', 10) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('ambarhesabi.best', String(v)); } catch (e) { /* yok say */ } }

  function ensureAudio() {
    if (audio || muted) return;
    try { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); } catch (e) { audio = null; }
  }
  function tone(freq, dur, type, vol) {
    if (!audio || muted) return;
    try {
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* sessiz devam */ }
  }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 140;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4, max: 0.4, color: color });
    }
  }
  function slotCenter(i) { var r = R.slotRect(i); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }

  function handleEvents(s) {
    for (var i = 0; i < s.events.length; i++) {
      var e = s.events[i], c;
      if (e.type === 'build') { c = slotCenter(e.slot); tone(440, 0.08, 'triangle'); tone(660, 0.1, 'triangle', 0.1); burst(c.x, c.y, '#e8c35a', 14); }
      else if (e.type === 'demolish') { c = slotCenter(e.slot); tone(150, 0.12, 'square', 0.1); burst(c.x, c.y, '#8c3b2e', 12); shakeT = 0.1; }
      else if (e.type === 'deny') { tone(110, 0.08, 'sawtooth', 0.08); msg = e.why; msgT = 1.2; }
      else if (e.type === 'spill') { spillFlash = 0.15; if (spillToneT <= 0) { tone(880, 0.05, 'sine', 0.06); spillToneT = 0.4; } }
      else if (e.type === 'season') tone(523, 0.12, 'sine', 0.08);
      else if (e.type === 'year') { tone(523, 0.1, 'triangle'); tone(784, 0.18, 'triangle'); msg = 'Yeni yıl: tüketim arttı'; msgT = 1.5; }
      else if (e.type === 'lose') { tone(140, 0.35, 'sawtooth', 0.18); shakeT = 0.2; }
      else if (e.type === 'win') { tone(988, 0.3, 'triangle'); burst(240, 240, '#7fd17f', 30); }
    }
    if (s.status !== 'playing' && s.score > best) { best = s.score; saveBest(best); }
  }

  function codeOf(ev) {
    if (ev.code) return ev.code;
    var k = ev.key;
    if (k === ' ') return 'Space';
    if (k === 'r' || k === 'R') return 'KeyR';
    if (k === 'm' || k === 'M') return 'KeyM';
    if (k === 'b' || k === 'B') return 'KeyB';
    if (k === 'x' || k === 'X') return 'KeyX';
    return k;
  }
  var BUILD = { Space: 1, KeyB: 1, ArrowUp: 1, KeyW: 1, Enter: 1 };
  var DEMO = { KeyX: 1, ArrowDown: 1, KeyS: 1, Backspace: 1 };
  window.addEventListener('keydown', function (ev) {
    var code = codeOf(ev);
    ensureAudio();
    if (code === 'KeyR' || ((code === 'Space' || code === 'Enter') && state.status !== 'playing')) {
      pressed.restart = true; if (ev.preventDefault) ev.preventDefault(); return;
    }
    if (code === 'KeyM') { muted = !muted; return; }
    if (BUILD[code]) { if (!ev.repeat) pressed.action = true; if (ev.preventDefault) ev.preventDefault(); }
    else if (DEMO[code]) { if (!ev.repeat) pressed.demolish = true; if (ev.preventDefault) ev.preventDefault(); }
  });

  function toCanvas(ev) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: C.W, height: C.H };
    return { x: (ev.clientX - r.left) * C.W / (r.width || C.W), y: (ev.clientY - r.top) * C.H / (r.height || C.H) };
  }
  canvas.addEventListener('pointerdown', function (ev) {
    ensureAudio();
    if (ev.preventDefault) ev.preventDefault();
    if (state.status !== 'playing') { pressed.restart = true; return; }
    var p = toCanvas(ev);
    for (var i = 0; i < C.MAX_SILO; i++) {
      var r = R.slotRect(i);
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y - 16 && p.y <= r.y + r.h) {
        if (i < state.silos) pressed.demolish = true; else pressed.action = true;
        return;
      }
    }
  });

  function frame(ts) {
    if (last === null) last = ts;
    acc += Math.min(0.25, (ts - last) / 1000); last = ts;
    var n = 0;
    while (acc >= DT && n < 5) {
      var inp = { action: pressed.action, demolish: pressed.demolish, restart: pressed.restart };
      pressed.action = false; pressed.demolish = false; pressed.restart = false;
      state = L.step(state, inp, DT);
      handleEvents(state);
      acc -= DT; n++;
    }
    if (n === 5) acc = 0;
    var el = n * DT;
    shakeT = Math.max(0, shakeT - el); spillFlash = Math.max(0, spillFlash - el);
    spillToneT = Math.max(0, spillToneT - el); msgT = Math.max(0, msgT - el);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i]; p.life -= el; p.x += p.vx * el; p.y += p.vy * el;
      if (p.life <= 0) particles.splice(i, 1);
    }
    var sh = shakeT > 0 ? { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 } : { x: 0, y: 0 };
    R.draw(ctx, state, { C: C, L: L, best: best, muted: muted, shake: sh, particles: particles,
      spillFlash: spillFlash, msg: msg, msgT: msgT });
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);

  ctrl = { getState: function () { return state; } };
  return ctrl;
}

if (typeof window !== 'undefined') {
  window.GameMain = { bootstrap: bootstrap };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap); else bootstrap();
}
if (typeof module !== 'undefined') module.exports = { bootstrap };
</script>
</body>
</html>
