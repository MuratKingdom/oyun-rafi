<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sekme Gücü</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070c;
    color: #e8ecf1;
    font-family: system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
    /* Dokunurken kaydırma, yakınlaştırma, metin seçme ve uzun-basma menüsü olmasın */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas {
    display: block;
    background: #0b1220;
    border: 2px solid #223;
    border-radius: 6px;
    /* Mantıksal alan 520 x --h (main.js ayarlar: 540–1000). Oranı koruyarak ekrana sığ;
       uzun telefonda alan da uzadığı için üstte/altta boşluk kalmaz. */
    --h: 540;
    width: min(98vw, 760px, calc((100dvh - 76px) * 520 / var(--h)));
    aspect-ratio: 520 / var(--h);
    height: auto;
  }
  @supports not (height: 100dvh) {
    canvas { width: min(98vw, 760px, calc((100vh - 76px) * 520 / var(--h))); }
  }
  #hint {
    font-size: 12px;
    color: #7c8aa5;
    text-align: center;
    max-width: 500px;
    padding: 0 8px;
  }
  .dugmeler { display: flex; gap: 8px; justify-content: center; min-height: 0; padding: 0 8px; box-sizing: border-box; max-width: 100%; }
  .dugmeler button { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gorevBtn {
    font: 600 15px system-ui, sans-serif;
    color: #e8ecf1; background: #1c2a44; border: 1px solid #2c4369; border-radius: 999px;
    padding: 9px 16px; cursor: pointer;
  }
  #gorevBtn[hidden] { display: none; }
  #muzikBtn, #sesBtn {
    font: inherit; font-size: 18px; min-width: 44px; padding: 6px 8px; border-radius: 10px;
    border: 1px solid #2c3d5c; background: #16233b; color: #e8ecf1; cursor: pointer;
  }
  #muzikBtn.kapali { opacity: 0.45; text-decoration: line-through; }
  #magaza .seri { margin: 2px 0 4px; color: #ffd166; font-weight: 600; font-size: 14px; }
  #magaza .gorev {
    display: grid; grid-template-columns: 1fr auto; gap: 6px 10px;
    background: #14203a; border-radius: 10px; padding: 10px 12px;
  }
  #magaza .gorev .odul { color: #ffd166; font-size: 13px; font-weight: 600; white-space: nowrap; }
  #magaza .gorev .cubuk { grid-column: 1 / -1; height: 6px; background: #22324f; border-radius: 3px; overflow: hidden; }
  #magaza .gorev .cubuk i { display: block; height: 100%; background: #5ac8fa; }
  #magaza .gorev.bitti .cubuk i { background: #46d39a; }
  #magaza .gorev.bitti .ad { color: #46d39a; }
  #magazaBtn {
    font: 600 15px system-ui, sans-serif;
    color: #05070c; background: #ffd166; border: 0; border-radius: 999px;
    padding: 9px 18px; cursor: pointer;
  }
  #magaza {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(5,7,12,0.92);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
  }
  #magaza[hidden], #magazaBtn[hidden] { display: none; }
  #magaza .panel {
    width: min(440px, 100%); max-height: 100%;
    display: flex; flex-direction: column; gap: 10px;
    background: #0f1828; border: 1px solid #263a5c; border-radius: 12px; padding: 14px;
    box-sizing: border-box;
  }
  #magaza header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #magaza h2 { margin: 0; font-size: 20px; }
  #magaza .cuzdan { color: #ffd166; font-weight: 700; font-size: 18px; }
  #magaza .kapat, #magaza [data-sekme] {
    font: 600 14px system-ui, sans-serif; color: #e8ecf1;
    background: #1c2a44; border: 1px solid #2c4369; border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  #magaza .sekmeler { display: flex; flex-wrap: wrap; gap: 6px; }
  #magaza [data-sekme][aria-selected="true"] { background: #5ac8fa; color: #05070c; border-color: #5ac8fa; }
  #magaza .liste { overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 8px; }
  #magaza .urun {
    display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 12px;
    background: #14203a; border-radius: 10px; padding: 8px;
  }
  #magaza .onizleme { width: 72px; height: 52px; border-radius: 6px; }
  #magaza .ad { font-size: 16px; }
  #magaza .urun button {
    font: 700 14px system-ui, sans-serif; min-width: 92px; min-height: 40px;
    border-radius: 8px; border: 0; cursor: pointer; background: #5ac8fa; color: #05070c;
  }
  #magaza .urun button.al { background: #ffd166; }
  #magaza .urun button.kusanildi { background: transparent; color: #7c8aa5; border: 1px solid #2c4369; cursor: default; }
  #magaza .urun button:disabled.al { opacity: 0.45; cursor: not-allowed; }
  #magaza .not { font-size: 12px; color: #7c8aa5; margin: 0; }
  #magaza .guc .basamak { width: 72px; text-align: center; color: #ffd166; font-size: 18px; letter-spacing: 2px; }
  #magaza .guc .etki { display: block; font-size: 12.5px; color: #9fb3d1; margin-top: 2px; }
  #devamBtn {
    font: 700 15px system-ui, sans-serif; color: #fff; background: #e0566b; border: 0; border-radius: 999px;
    padding: 9px 18px; cursor: pointer; animation: nabiz 1s ease-in-out infinite;
  }
  #devamBtn[hidden] { display: none; }
  @keyframes nabiz { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { #devamBtn { animation: none; } }
  @media (pointer: coarse) {
    #hint .kb { display: none; }
  }
  /* Dar telefon: dört düğme tek satıra sığsın (ayrıntılı kurallardan sonra gelmeli) */
  @media (max-width: 440px) {
    .dugmeler { gap: 6px; }
    #magazaBtn, #gorevBtn { padding: 8px 10px; font-size: 13px; }
    #muzikBtn, #sesBtn { min-width: 36px; padding: 5px; font-size: 16px; }
  }
  @media (max-width: 340px) {
    .dugmeler { gap: 4px; padding: 0 4px; }
    #magazaBtn, #gorevBtn { padding: 7px 7px; font-size: 12px; }
    #muzikBtn, #sesBtn { min-width: 32px; padding: 4px; font-size: 14px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="540"></canvas>
  <div id="hint">Ekranın herhangi bir yerine basılı tut: yükseklik kazan<span class="kb"> · Boşluk / ↑ · R: yeniden · M: ses · P: duraklat</span></div>
  <div class="dugmeler"><button id="devamBtn" type="button" data-ui hidden>❤ Devam</button><button id="magazaBtn" type="button" data-ui hidden>🛒 Mağaza</button><button id="gorevBtn" type="button" data-ui hidden>📋 Görevler</button><button id="muzikBtn" class="ikon" type="button" data-ui aria-label="Müzik">🎵</button><button id="sesBtn" class="ikon" type="button" data-ui aria-label="Efekt sesleri">🔊</button></div>
</div>
<div id="magaza" data-ui hidden role="dialog" aria-label="Mağaza">
  <div class="panel">
    <header><h2>Mağaza</h2><span class="cuzdan">★ 0</span><button class="kapat" type="button">Kapat</button></header>
    <div class="sekmeler" role="tablist">
      <button type="button" role="tab" data-sekme="ball" aria-selected="true">Top</button>
      <button type="button" role="tab" data-sekme="map" aria-selected="false">Harita</button>
      <button type="button" role="tab" data-sekme="upg" aria-selected="false">Güç</button>
      <button type="button" role="tab" data-sekme="quests" aria-selected="false">Görevler</button>
    </div>
    <div class="liste"></div>
    <p class="not">Yıldız kazanmak için: oyunda yıldız topla, günlük görevleri bitir, her 10 bölümlük eşik +5. Gerçek para yok.</p>
  </div>
</div>
<script>
// Sekme Gücü — saf oyun mantığı (DOM/canvas/window kullanılmaz)
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

var CANVAS_W = 520;
var CANVAS_H = 540;
var BALL_X = 160;
var BALL_R = 12;
var FLOOR_Y = 480;
var CEIL_Y = 30;
var GRAVITY = 900;
var THRUST = -700;
var BOUNCE_V = -480;
var MAX_VY = 900;
var SPEED0 = 200;
var SPEED_MAX = 340;
var GAP_H0 = 170;
var GAP_MIN = 120;
// Zorluk eğrisi: doğrusal değil, doygunluğa giden üstel yaklaşım.
// İlk dakikada hızlı sertleşir, sonra yavaşlar ve bir tavanda durur;
// böylece uzun koşular adil kalır, "sonsuz hızlanma" ile zorla bitmez.
var DIFF_TAU = 75;
var WALL_W = 28;
var SPAWN_GRACE = 2.2;
var SPAWN_INTERVAL_MIN = 1.3;
var SPAWN_INTERVAL_MAX = 1.9;
var SPAWN_RAMP = 0.01;

function nextRand(state) {
  state.rngA = (state.rngA + 0x6D2B79F5) | 0;
  var t = state.rngA;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// 0 (başlangıç) → 1 (tavan) arasında, t saniyede.
function difficulty(t) {
  return 1 - Math.exp(-t / DIFF_TAU);
}

// Sonsuz bölge ilerlemesi: ilk eşiğe kadar 0, sonra ENDLESS_LEVELS bölümde 1'e çıkar
function endless(level) {
  return Math.max(0, Math.min(1, ((level || 1) - LEVEL_COUNT) / ENDLESS_LEVELS));
}

// --- Bölümler ---------------------------------------------------------------
// Her bölüm GATES_PER_LEVEL kapıdır. Oyun sonsuzdur: bitiş yok, yalnız ölünce biter.
// Her LEVEL_COUNT bölümde bir eşik geçilir (state.milestones; ödülde bonus).
// Eşik sonrası (sonsuz bölge) zorluk ENDLESS_LEVELS bölüm boyunca yavaşça bir tavana çıkar:
// hız +ENDLESS_SPEED, kapı en dar GAP_MIN - ENDLESS_GAP, doğma aralığı ENDLESS_SPAWN_MIN'e iner.
// Tavanda bile her dizilim geçilebilir kalır (MAX_JUMP, bot ölçümü: README).
// Yeni öğeler bölümle açılır:
//   2+  yıldız: kapının ortasında durur; toplanınca bir kalkan verir (en çok 1)
//   3+  hareketli kapı: boşluk yukarı-aşağı salınır, genliği bölümle büyür
//   4+  nefes alan kapı: ağız ortası sabit kalır, boyu daralıp genişler (hareketliyle birleşmez)
//   5+  güç: kapının ortasında yıldız yerine çıkabilir —
//         ⏱ yavaşlatma (dünya POWER_SLOW_F hızında akar) ya da küçülme (top yarıçapı POWER_SMALL_F)
//   6+  çift duvar: art arda iki duvar, boşlukları birbirine kaydırılmış
//   7+  zemin dikeni: duvarın hemen ardında zeminde dikenli şerit; üstüne sekmek öldürür,
//       basılı tutup havada kalarak geçilir
// Kalkan, bir duvar ya da diken çarpmasını yutar (tavanı değil).
var LEVEL_COUNT = 10; // eşik uzunluğu (bölüm)
var ENDLESS_LEVELS = 20;
var ENDLESS_SPEED = 40;
var ENDLESS_GAP = 15;
var ENDLESS_SPAWN_MIN = 1.15;
var GATES_PER_LEVEL = 8;
var STAR_FROM = 2;
var MOVE_FROM = 3;
var DOUBLE_FROM = 6;
var PULSE_FROM = 4;
var POWER_FROM = 5;
var SPIKE_FROM = 7;
var POWER_SLOW_F = 0.65;
var POWER_SLOW_T = 4;
var POWER_SMALL_F = 0.6;
var POWER_SMALL_T = 6;
var PULSE_MIN = 0.72; // nefes alan kapı en dar halinde normal boyun bu oranı
var SPIKE_DX = 30;    // duvarın arka kenarından şeridin başına
var SPIKE_W = 70;
var STAR_R = 9;
var MAX_SHIELD = 1;
var DOUBLE_DX = 96;
var DOUBLE_SHIFT = 46;
var MARGIN = 40;
// Art arda iki kapının ağız üstü arasındaki en büyük fark. Top yalnızca zeminden
// sekerek yükselir (basılı tutmak düşüşü yavaşlatır, havada tutmaz); alçak bir
// kapıdan hemen sonra çok yüksek bir kapı hızlanan oyunda fiziksel olarak
// yetişilemez olabiliyordu. Bu sınır her dizilimi oynanabilir tutar.
var MAX_JUMP = 150;

// --- Geometri --------------------------------------------------------------
// Oyun alanının mantıksal yüksekliği cihaza göre değişebilir (dikey telefonda uzun).
// Genişlik ve zaman sabit kalır; dikey olan her şey (yerçekimi, itiş, sekme hızı,
// kapı boyu, salınım, sıçrama sınırı) alanla aynı oranda (k) ölçeklenir. Böylece
// oyun geometrik olarak aynı kalır: botla ölçülen denge her ekran boyunda geçerli.
var MIN_H = 540;
var MAX_H = 1000;

function makeGeo(height) {
  var H = Math.round(Math.max(MIN_H, Math.min(MAX_H, height || CANVAS_H)));
  var floorY = H - (CANVAS_H - FLOOR_Y);
  return { H: H, ceilY: CEIL_Y, floorY: floorY, k: (floorY - CEIL_Y) / (FLOOR_Y - CEIL_Y) };
}

// opts.height: mantıksal alan yüksekliği (540–1000); verilmezse 540 (klasik kare alan)
// opts.mods: mağazadaki kalıcı güçlendirmeler { maxShield, startShield, powerMul, magnet }
function createState(seed, opts) {
  var g = makeGeo(opts && opts.height);
  var m = (opts && opts.mods) || {};
  var maxShield = typeof m.maxShield === 'number' ? m.maxShield : MAX_SHIELD;
  return {
    maxShield: maxShield,
    powerMul: m.powerMul || 1,
    magnet: m.magnet || 1,
    revives: 0,
    geo: g,
    rngA: (seed || 1) >>> 0,
    y: g.floorY - BALL_R - 60 * g.k,
    vy: 0,
    t: 0,
    speed: SPEED0,
    gapH: GAP_H0 * g.k,
    lastGapY: -1,
    spawnTimer: SPAWN_GRACE,
    obstacles: [],
    bounces: 0,
    score: 0,
    level: 1,
    stars: 0,
    shield: Math.min(maxShield, m.startShield || 0),
    shieldUsed: 0,
    movingPassed: 0,
    milestones: 0,
    slowT: 0,
    smallT: 0,
    powers: 0,
    spikesPassed: 0,
    distance: 0,
    status: 'playing',
    overReason: ''
  };
}

function clampGapY(g, gapY, gapH) {
  var minTop = g.ceilY + MARGIN * g.k;
  var maxTop = g.floorY - MARGIN * g.k - gapH;
  if (maxTop < minTop) maxTop = minTop;
  return Math.max(minTop, Math.min(maxTop, gapY));
}

function makeWall(state, x, baseY, gapH) {
  var lv = state.level;
  var w = { x: x, baseY: baseY, gapY: baseY, gapH: gapH, baseH: gapH, passed: false, hit: false,
    move: null, star: null, pulse: null, power: null, spike: null };
  if (lv >= MOVE_FROM && nextRand(state) < Math.min(0.7, 0.18 * (lv - MOVE_FROM + 1))) {
    w.move = {
      amp: Math.min(48, 22 + 4 * (lv - MOVE_FROM)) * state.geo.k,
      freq: 0.9 + nextRand(state) * 0.8,
      phase: nextRand(state) * Math.PI * 2
    };
  }
  if (!w.move && lv >= PULSE_FROM && nextRand(state) < Math.min(0.45, 0.15 * (lv - PULSE_FROM + 1))) {
    w.pulse = { freq: 1.6 + nextRand(state) * 0.8, phase: nextRand(state) * Math.PI * 2 };
  }
  if (lv >= POWER_FROM && nextRand(state) < 0.16) {
    w.power = { kind: nextRand(state) < 0.5 ? 'slow' : 'small', taken: false };
  } else if (lv >= STAR_FROM && nextRand(state) < 0.4) {
    w.star = { taken: false };
  }
  if (lv >= SPIKE_FROM && nextRand(state) < Math.min(0.4, 0.2 + 0.07 * (lv - SPIKE_FROM))) {
    w.spike = { dx: SPIKE_DX, w: SPIKE_W, hit: false, passed: false };
  }
  return w;
}

function spawn(state) {
  var g = state.geo;
  var gapH = state.gapH;
  var minTop = g.ceilY + MARGIN * g.k;
  var maxTop = g.floorY - MARGIN * g.k - gapH;
  var span = Math.max(10, maxTop - minTop);
  var gapY = minTop + nextRand(state) * span;
  if (state.lastGapY >= 0) {
    var jump = MAX_JUMP * g.k;
    gapY = Math.max(state.lastGapY - jump, Math.min(state.lastGapY + jump, gapY));
  }
  gapY = clampGapY(g, gapY, gapH);
  state.obstacles.push(makeWall(state, CANVAS_W + WALL_W, gapY, gapH));
  state.lastGapY = gapY;
  if (state.level >= DOUBLE_FROM && nextRand(state) < 0.3) {
    var shift = (nextRand(state) < 0.5 ? -1 : 1) * DOUBLE_SHIFT * g.k;
    var second = makeWall(state, CANVAS_W + WALL_W + DOUBLE_DX, clampGapY(g, gapY + shift, gapH), gapH);
    second.move = null; // çift duvarın ikincisi sabit: iki hareketli üst üste adil değil
    second.pulse = null;
    second.spike = null; // iki duvarın arasına diken koyma: yer yok
    if (state.obstacles[state.obstacles.length - 1].spike) state.obstacles[state.obstacles.length - 1].spike = null;
    state.obstacles.push(second);
    state.lastGapY = second.gapY;
    return DOUBLE_DX / state.speed; // sonraki duvar ikinci parçaya normal aralıkla gelsin
  }
  return 0;
}

// Topun anlık yarıçapı (küçülme gücü açıkken daha küçük)
function radius(state) {
  return state.smallT > 0 ? BALL_R * POWER_SMALL_F : BALL_R;
}

// Engelin altındaki diken şeridi topun x'ini örtüyor mu
function spikeUnderBall(o, r) {
  if (!o.spike || o.spike.hit) return false;
  var x0 = o.x + WALL_W + o.spike.dx;
  return x0 < BALL_X + r && x0 + o.spike.w > BALL_X - r;
}

function step(state, input, dt) {
  if (state.status !== 'playing') return state;

  var g = state.geo || (state.geo = makeGeo(CANVAS_H));
  if (state.slowT > 0) state.slowT = Math.max(0, state.slowT - dt);
  if (state.smallT > 0) state.smallT = Math.max(0, state.smallT - dt);
  var r = radius(state);
  // Yavaşlatma yalnız dünyayı (duvarların kayması, doğma sıklığı) etkiler; topun
  // düşüşü aynı kalır ki kontrol hissi değişmesin.
  var wf = state.slowT > 0 ? POWER_SLOW_F : 1;
  var accel = GRAVITY * g.k;
  if (input.action) accel += THRUST * g.k;
  state.vy += accel * dt;
  var maxVy = MAX_VY * g.k;
  if (state.vy > maxVy) state.vy = maxVy;
  if (state.vy < -maxVy) state.vy = -maxVy;
  state.y += state.vy * dt;

  if (state.y + r >= g.floorY) {
    state.y = g.floorY - r;
    state.vy = BOUNCE_V * g.k;
    state.bounces++;
    for (var si = 0; si < state.obstacles.length; si++) {
      var so = state.obstacles[si];
      if (!spikeUnderBall(so, r)) continue;
      if (state.shield > 0) {
        state.shield--;
        state.shieldUsed++;
        so.spike.hit = true;
      } else {
        state.status = 'over';
        state.overReason = 'Dikene düştün';
        return state;
      }
    }
  }

  if (state.y - r <= g.ceilY) {
    state.status = 'over';
    state.overReason = 'Tavana çarptın';
    return state;
  }

  state.t += dt;
  var d = difficulty(state.t);
  var e = endless(state.level);
  state.speed = SPEED0 + (SPEED_MAX + ENDLESS_SPEED * e - SPEED0) * d;
  state.gapH = (GAP_H0 - (GAP_H0 - (GAP_MIN - ENDLESS_GAP * e)) * d) * g.k;

  state.spawnTimer -= dt * wf;
  if (state.spawnTimer <= 0) {
    var extra = spawn(state);
    var interval = SPAWN_INTERVAL_MAX - state.t * SPAWN_RAMP;
    var imin = SPAWN_INTERVAL_MIN - (SPAWN_INTERVAL_MIN - ENDLESS_SPAWN_MIN) * e;
    if (interval < imin) interval = imin;
    state.spawnTimer = interval + extra;
  }

  for (var i = 0; i < state.obstacles.length; i++) {
    var o = state.obstacles[i];
    o.x -= state.speed * wf * dt;
    if (o.move) {
      o.gapY = clampGapY(g, o.baseY + o.move.amp * Math.sin(o.move.phase + state.t * o.move.freq), o.gapH);
    }
    if (o.pulse) {
      // 0..1 arası nefes; ağız ortası sabit
      var b = 0.5 + 0.5 * Math.sin(o.pulse.phase + state.t * o.pulse.freq);
      var bh = o.baseH || o.gapH;
      o.gapH = bh * (PULSE_MIN + (1 - PULSE_MIN) * b);
      o.gapY = o.baseY + (bh - o.gapH) / 2;
    }

    // Yıldız: kapının ortasında
    if (o.star && !o.star.taken) {
      var sx = o.x + WALL_W / 2;
      var sy = o.gapY + o.gapH / 2;
      var pr = r + STAR_R * (state.magnet || 1);
      if (Math.abs(sx - BALL_X) < pr && Math.abs(sy - state.y) < pr) {
        o.star.taken = true;
        state.stars++;
        var cap = typeof state.maxShield === 'number' ? state.maxShield : MAX_SHIELD;
        if (state.shield < cap) state.shield++;
      }
    }
    // Güç: yıldızla aynı yerde; alınınca süresi (yeniden) başlar
    if (o.power && !o.power.taken) {
      var px = o.x + WALL_W / 2;
      var py = o.gapY + o.gapH / 2;
      var pr2 = r + STAR_R * (state.magnet || 1);
      if (Math.abs(px - BALL_X) < pr2 && Math.abs(py - state.y) < pr2) {
        o.power.taken = true;
        state.powers++;
        if (o.power.kind === 'slow') state.slowT = POWER_SLOW_T * (state.powerMul || 1);
        else state.smallT = POWER_SMALL_T * (state.powerMul || 1);
      }
    }
    if (o.spike && !o.spike.passed && o.x + WALL_W + o.spike.dx + o.spike.w < BALL_X - r) {
      o.spike.passed = true;
      if (!o.spike.hit) state.spikesPassed++;
    }

    if (!o.passed && o.x + WALL_W < BALL_X) {
      o.passed = true;
      state.score++;
      if (o.move) state.movingPassed++;
      if (state.score % GATES_PER_LEVEL === 0) {
        if (state.level % LEVEL_COUNT === 0) state.milestones++;
        state.level++;
      }
    }
    if (!o.hit && o.x < BALL_X + r && o.x + WALL_W > BALL_X - r) {
      if (state.y - r < o.gapY || state.y + r > o.gapY + o.gapH) {
        if (state.shield > 0) {
          state.shield--;
          state.shieldUsed++;
          o.hit = true; // kalkan bu duvarı deler; aynı duvar ikinci kez öldürmez
        } else {
          state.status = 'over';
          state.overReason = 'Duvara çarptın';
          return state;
        }
      }
    }
  }
  var kept = [];
  for (var j = 0; j < state.obstacles.length; j++) {
    var oj = state.obstacles[j];
    var tail = oj.spike ? WALL_W + oj.spike.dx + oj.spike.w : WALL_W;
    if (oj.x + tail > -10) kept.push(oj);
  }
  state.obstacles = kept;

  state.distance += state.speed * wf * dt;
  return state;
}

// Ölünce devam (yıldızla ödenir, ödemeyi main.js/shop.js yapar): top ortaya alınır,
// önündeki REVIVE_CLEAR px içindeki ve altındaki engeller kaldırılır, yeni duvar biraz gecikir.
var REVIVE_CLEAR = 300;
var REVIVE_GRACE = 1.2;
function revive(state) {

    var o = state.obstacles[i];
    var tail = o.x + WALL_W + (o.spike ? o.spike.dx + o.spike.w : 0);
    if (tail < BALL_X - BALL_R - 4 || o.x > BALL_X + REVIVE_CLEAR) kept.push(o);

  state.y = (g.ceilY + g.floorY) / 2;
  state.vy = 0;
  state.spawnTimer = Math.max(state.spawnTimer, REVIVE_GRACE);

  state.overReason = '';

var CONST = {
  CANVAS_W: CANVAS_W, CANVAS_H: CANVAS_H, BALL_X: BALL_X, BALL_R: BALL_R,

  SPEED0: SPEED0, SPEED_MAX: SPEED_MAX, GAP_H0: GAP_H0, GAP_MIN: GAP_MIN,
  LEVEL_COUNT: LEVEL_COUNT, GATES_PER_LEVEL: GATES_PER_LEVEL, STAR_R: STAR_R,
  STAR_FROM: STAR_FROM, MOVE_FROM: MOVE_FROM, DOUBLE_FROM: DOUBLE_FROM, MAX_JUMP: MAX_JUMP,
  MIN_H: MIN_H, MAX_H: MAX_H,
  ENDLESS_LEVELS: ENDLESS_LEVELS, ENDLESS_SPEED: ENDLESS_SPEED, ENDLESS_GAP: ENDLESS_GAP, ENDLESS_SPAWN_MIN: ENDLESS_SPAWN_MIN,
  PULSE_FROM: PULSE_FROM, POWER_FROM: POWER_FROM, SPIKE_FROM: SPIKE_FROM, PULSE_MIN: PULSE_MIN,
  POWER_SLOW_F: POWER_SLOW_F, POWER_SLOW_T: POWER_SLOW_T, POWER_SMALL_F: POWER_SMALL_F, POWER_SMALL_T: POWER_SMALL_T,
  SPIKE_DX: SPIKE_DX, SPIKE_W: SPIKE_W, MAX_SHIELD: MAX_SHIELD, REVIVE_CLEAR: REVIVE_CLEAR

var API = { createState: createState, step: step, difficulty: difficulty, endless: endless, revive: revive, makeGeo: makeGeo, radius: radius, CONST: CONST };

<script>
// Sekme Gücü — mağaza: katalog, cüzdan, satın alma, kuşanma (saf mantık; DOM yok)

(function () {

  { id: 'gunbatimi', name: 'Gün Batımı', price: 150, deco: 'sun',
    c: { bg: '#2a1530', line: '#5a2f4a', wall: '#4a2340', wallPassed: '#331a2e', wallMove: '#5a2a5e', edge: '#ffb36b', edgeMove: '#ff7fb0', deco: 'rgba(255,170,90,0.16)' } },
  { id: 'orman', name: 'Orman', price: 200, deco: 'trees',
    c: { bg: '#0e1f17', line: '#24443a', wall: '#1d3b2c', wallPassed: '#152a20', wallMove: '#2d3b1d', edge: '#8fe388', edgeMove: '#e3d488', deco: 'rgba(60,120,80,0.55)' } },
  { id: 'neon', name: 'Neon', price: 350, deco: 'grid',
    c: { bg: '#07050f', line: '#ff2bd6', wall: '#1a0f33', wallPassed: '#120a24', wallMove: '#2a0f3a', edge: '#2bf0ff', edgeMove: '#ff2bd6', deco: 'rgba(255,43,214,0.18)' } },
  { id: 'buz', name: 'Buz', price: 450, deco: 'flakes',
    c: { bg: '#e8f3fb', line: '#9ac0da', wall: '#b9d6ea', wallPassed: '#d3e5f2', wallMove: '#c9c2ec', edge: '#2a7fb8', edgeMove: '#6a4fc4', deco: 'rgba(120,170,210,0.6)', text: '#12324a', textDim: '#4f7591' } }
];

var CATALOG = { ball: BALLS, map: MAPS };

// Kalıcı güçlendirmeler: yıldızın oyun içi karşılığı. Her basamak bir kez alınır, geri satılmaz.

var UPGRADES = [
  { id: 'kalkan', name: 'Kalkan kapasitesi', prices: [200, 600], values: [1, 2, 3],
    desc: function (v) { return 'Aynı anda en çok ' + v + ' kalkan'; } },
  { id: 'baslangic', name: 'Başlangıç kalkanı', prices: [450], values: [0, 1],

];

// Ölünce devam: koşu başına en çok REVIVE_MAX kez, fiyat her seferinde ikiye katlanır
var REVIVE_BASE = 15;
var REVIVE_MAX = 3;

function find(kind, id) {
  var list = CATALOG[kind] || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

function findUpgrade(id) {
  for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].id === id) return UPGRADES[i];
  return null;
}

function createProfile() {
  var upg = {};
  UPGRADES.forEach(function (u) { upg[u.id] = 0; });
  return { coins: 0, owned: { ball: ['klasik'], map: ['gece'] }, equipped: { ball: 'klasik', map: 'gece' }, upg: upg };

// Dışarıdan gelen (localStorage) veriyi doğrular; tanınmayan her şeyi atar.
function sanitize(raw) {
  var p = createProfile();
  if (!raw || typeof raw !== 'object') return p;
  var coins = Math.floor(Number(raw.coins));
  p.coins = isFinite(coins) && coins > 0 ? Math.min(coins, 999999) : 0;
  ['ball', 'map'].forEach(function (kind) {
    var owned = raw.owned && Array.isArray(raw.owned[kind]) ? raw.owned[kind] : [];
    owned.forEach(function (id) {
      if (find(kind, id) && p.owned[kind].indexOf(id) < 0) p.owned[kind].push(id);
    });
    var eq = raw.equipped && raw.equipped[kind];
    if (eq && p.owned[kind].indexOf(eq) >= 0) p.equipped[kind] = eq;
  });

    var lv = Math.floor(Number(raw.upg && raw.upg[u.id]));

function load(storage) {

}

function save(storage, p) {
  try { if (storage) storage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}

}

function buy(p, kind, id) {
  var item = find(kind, id);
  if (!item) return { ok: false, reason: 'yok' };
  if (owns(p, kind, id)) return { ok: false, reason: 'zaten-var' };
  if (p.coins < item.price) return { ok: false, reason: 'yetersiz' };
  p.coins -= item.price;
  p.owned[kind].push(id);
  p.equipped[kind] = id;
  return { ok: true };
}

function equip(p, kind, id) {
  if (!owns(p, kind, id)) return false;
  p.equipped[kind] = id;
  return true;
}

// Bir koşunun ödülü: toplanan yıldız + geçilen her eşik (10 bölüm) için MILESTONE_BONUS.
// Bölüm başına ayrı ödül yok: kazanç, ekranda toplanan yıldızla aynı kalsın.
// Oyun sonsuzdur; eşik sayısı state.milestones'ta, eski kayıtlar için bölümden de hesaplanır.
var MILESTONE_BONUS = 5;
function reward(state) {
  var levelsDone = Math.max(0, (state.level || 1) - 1);
  var ms = typeof state.milestones === 'number' ? state.milestones : Math.floor(levelsDone / 10);
  return (state.stars || 0) + MILESTONE_BONUS * ms;
}

// { ok, reason } — reason: 'yok' | 'tamam' (son basamak) | 'yetersiz'
function buyUpgrade(p, id) {
  var u = findUpgrade(id);
  if (!u) return { ok: false, reason: 'yok' };
  var lv = p.upg[id] || 0;
  if (lv >= u.prices.length) return { ok: false, reason: 'tamam' };
  if (p.coins < u.prices[lv]) return { ok: false, reason: 'yetersiz' };

  p.upg[id] = lv + 1;
  return { ok: true };
}

function upgradeValue(p, id) {
  var u = findUpgrade(id);
  return u.values[Math.min((p && p.upg && p.upg[id]) || 0, u.values.length - 1)];
}

function mods(p) {

function equippedMap(p) { return find('map', p.equipped.map) || MAPS[0]; }

var Shop = {

  createProfile: createProfile, sanitize: sanitize, load: load, save: save,

  equippedBall: equippedBall, equippedMap: equippedMap,
  UPGRADES: UPGRADES, findUpgrade: findUpgrade, buyUpgrade: buyUpgrade, upgradeValue: upgradeValue, mods: mods,

<script>
// Sekme Gücü — günlük görevler ve giriş serisi (saf mantık; DOM yok)
//
// Her gün 3 görev: tarih anahtarından (YYYY-AA-GG) deterministik seçilir, yani aynı gün
// aynı cihazda hep aynı görevler gelir. Tamamlanan görevin ödülü kendiliğinden verilir.
// Giriş serisi: ardışık her gün ilk açılışta 3, 4, 5, 6, 7 (tavan) yıldız; gün atlanırsa sıfırlanır.
// Kayıt ayrı anahtardadır ('sekmeguc-gunluk'); bozuk/eski kayıt güvenle yeniden kurulur.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

var DAILY_KEY = 'sekmeguc-gunluk';
var QUESTS_PER_DAY = 3;

// kind: run_* tek koşuda, day_* gün boyunca birikir
var TEMPLATES = [
  { kind: 'run_stars', targets: [3, 5, 8], rewards: [5, 6, 8], text: 'Bir koşuda {n} yıldız topla' },
  { kind: 'run_gates', targets: [10, 20, 30], rewards: [4, 6, 8], text: 'Bir koşuda {n} kapı geç' },
  { kind: 'reach_level', targets: [3, 4, 6], rewards: [4, 6, 9], text: '{n}. bölüme ulaş' },
  { kind: 'day_gates', targets: [25, 40, 60], rewards: [4, 6, 8], text: 'Bugün toplam {n} kapı geç' },
  { kind: 'day_runs', targets: [3, 5], rewards: [3, 5], text: 'Bugün {n} oyun oyna' },
  { kind: 'day_shield', targets: [1, 2], rewards: [4, 6], text: 'Kalkanla {n} çarpmadan kurtul' },
  { kind: 'day_moving', targets: [3, 6], rewards: [4, 6], text: '{n} hareketli (mor) kapıdan geç' },
  // 'win' adı eski kayıtlarla uyum için kaldı: oyun sonsuz, görev ilk eşiği (10. bölüm) geçmek
  { kind: 'win', targets: [1], rewards: [15], text: '10. bölümü geç (ilk eşik)' }
];

function pad(n) { return (n < 10 ? '0' : '') + n; }
function dayKey(date) {
  var d = date || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
// İki gün anahtarı arasındaki takvim farkı (gün)
function dayDiff(a, b) {
  function toUtc(k) { var p = k.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  return Math.round((toUtc(b) - toUtc(a)) / 86400000);
}
function validKey(k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); }

function hash(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function describe(q) {
  var tpl = null;
  for (var i = 0; i < TEMPLATES.length; i++) if (TEMPLATES[i].kind === q.kind) tpl = TEMPLATES[i];
  return tpl ? tpl.text.replace('{n}', q.target) : q.kind;
}

// Günün 3 görevi: farklı türlerden, tarihten deterministik
function generate(key) {
  var h = hash('sekmeguc:' + key);
  var pool = TEMPLATES.slice();
  var out = [];
  while (out.length < QUESTS_PER_DAY && pool.length) {
    h = (Math.imul(h, 1103515245) + 12345) >>> 0;
    var tpl = pool.splice(h % pool.length, 1)[0];
    h = (Math.imul(h, 1103515245) + 12345) >>> 0;
    var ti = h % tpl.targets.length;
    out.push({ kind: tpl.kind, target: tpl.targets[ti], reward: tpl.rewards[ti], progress: 0, done: false });
  }
  return out;
}

function fresh() {
  return { day: '', streak: 0, lastLogin: '', quests: [] };
}

function sanitize(raw) {
  var d = fresh();
  if (!raw || typeof raw !== 'object') return d;
  if (validKey(raw.day)) d.day = raw.day;
  if (validKey(raw.lastLogin)) d.lastLogin = raw.lastLogin;
  var st = Math.floor(Number(raw.streak));
  d.streak = isFinite(st) && st > 0 ? Math.min(st, 3650) : 0;
  // Görevler kayıttan değil, günün anahtarından yeniden üretilir; kayıttan yalnız ilerleme alınır
  if (d.day) {
    d.quests = generate(d.day);
    var saved = Array.isArray(raw.quests) ? raw.quests : [];
    for (var i = 0; i < d.quests.length; i++) {
      var s = saved[i];
      if (s && s.kind === d.quests[i].kind) {
        var pr = Math.floor(Number(s.progress));
        d.quests[i].progress = isFinite(pr) && pr > 0 ? Math.min(pr, d.quests[i].target) : 0;
        d.quests[i].done = !!s.done && d.quests[i].progress >= d.quests[i].target;
      }
    }
  }
  return d;
}

function load(storage) {
  try {
    var txt = storage && storage.getItem(DAILY_KEY);
    return sanitize(txt ? JSON.parse(txt) : null);
  } catch (e) {
    return fresh();
  }
}
function save(storage, d) {
  try { if (storage) storage.setItem(DAILY_KEY, JSON.stringify(d)); } catch (e) {}
}

function loginRewardFor(streak) { return Math.min(7, 2 + streak); }

// Günün ilk açılışı: görevleri yenile, seriyi ilerlet. Dönen: { coins, streak } (yeni gün değilse coins 0)
function ensureDay(d, key) {
  var res = { coins: 0, streak: d.streak };
  if (d.day !== key) {
    d.day = key;
    d.quests = generate(key);
  }
  if (d.lastLogin !== key) {
    var gap = d.lastLogin ? dayDiff(d.lastLogin, key) : 99;
    d.streak = gap === 1 ? d.streak + 1 : 1;
    d.lastLogin = key;
    res.coins = loginRewardFor(d.streak);
    res.streak = d.streak;
  }
  return res;
}

// Bir koşu bitti: ilerlemeyi işle. run: { stars, score, level, shieldUsed, movingPassed, status }
// Dönen: yeni tamamlanan görevler [{ text, reward }]; ödüller toplamı çağıran tarafından cüzdana eklenir
function applyRun(d, run) {
  var done = [];
  for (var i = 0; i < d.quests.length; i++) {
    var q = d.quests[i];
    if (q.done) continue;
    var v;
    switch (q.kind) {
      case 'run_stars': v = Math.max(q.progress, run.stars || 0); break;
      case 'run_gates': v = Math.max(q.progress, run.score || 0); break;
      case 'reach_level': v = Math.max(q.progress, run.level || 1); break;
      case 'day_gates': v = q.progress + (run.score || 0); break;
      case 'day_runs': v = q.progress + 1; break;
      case 'day_shield': v = q.progress + (run.shieldUsed || 0); break;
      case 'day_moving': v = q.progress + (run.movingPassed || 0); break;
      case 'win': v = (run.level || 1) > 10 || run.status === 'won' ? 1 : q.progress; break;
      default: v = q.progress;
    }
    q.progress = Math.min(q.target, v);
    if (q.progress >= q.target) {
      q.done = true;
      done.push({ text: describe(q), reward: q.reward });
    }
  }
  return done;
}

var Quests = {
  DAILY_KEY: DAILY_KEY, TEMPLATES: TEMPLATES, dayKey: dayKey, dayDiff: dayDiff,
  generate: generate, describe: describe, fresh: fresh, sanitize: sanitize,
  load: load, save: save, ensureDay: ensureDay, applyRun: applyRun, loginRewardFor: loginRewardFor
};
if (typeof module !== 'undefined') module.exports = Quests;
if (typeof window !== 'undefined') window.GameQuests = Quests;
})();

<script>
// Sekme Gücü — ses ve müzik: ayarlar, efekt tablosu, prosedürel müzik (saf mantık; WebAudio yok)
//
// Müzik dosya değildir: her harita kendi tonu ve dizisiyle 4 ölçülük bir döngü çalar
// (bas + arpej + ezgi). Ezgi harita adından belirlenimli üretilir; tempo bölümle hızlanır.
// Çalma işini main.js yapar; burada yalnız "hangi nota, ne zaman" hesaplanır ki test edilebilsin.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

var SETTINGS_KEY = 'sekmeguc-ses';
var STEPS_PER_BAR = 16;
var BARS = 4;
var BPM0 = 100;
var BPM_STEP = 4;
var BPM_MAX = 136;

// --- Ayarlar ---------------------------------------------------------------
function defaults() { return { music: true, sfx: true }; }
function sanitize(raw) {
  var s = defaults();
  if (raw && typeof raw === 'object') {
    if (raw.music === false) s.music = false;
    if (raw.sfx === false) s.sfx = false;
  }
  return s;
}
function load(storage) {
  try {
    var t = storage && storage.getItem(SETTINGS_KEY);
    return sanitize(t ? JSON.parse(t) : null);
  } catch (e) { return defaults(); }
}
function save(storage, s) {
  try { if (storage) storage.setItem(SETTINGS_KEY, JSON.stringify(sanitize(s))); } catch (e) {}
}

// --- Nota yardımcıları -----------------------------------------------------
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

var MINOR = [0, 2, 3, 5, 7, 8, 10];
var MAJOR = [0, 2, 4, 5, 7, 9, 11];
var DORIAN = [0, 2, 3, 5, 7, 9, 10];
var PENTA = [0, 2, 4, 7, 9, 12, 14];

// Harita → ton (MIDI kök), dizi, akor dizisi (dizi derecesi), dalga biçimi
var TUNES = {
  gece: { root: 57, scale: MINOR, prog: [0, 5, 2, 6], lead: 'triangle' },      // La minör
  gunbatimi: { root: 60, scale: MAJOR, prog: [0, 4, 5, 3], lead: 'sine' },     // Do majör
  orman: { root: 62, scale: DORIAN, prog: [0, 3, 0, 4], lead: 'triangle' },    // Re dorian
  neon: { root: 55, scale: MINOR, prog: [0, 6, 5, 4], lead: 'square' },        // Sol minör
  buz: { root: 64, scale: PENTA, prog: [0, 3, 4, 2], lead: 'sine' }            // Mi pentatonik
};

function tune(mapId) { return TUNES[mapId] || TUNES.gece; }

function hash(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// Dizi derecesinden MIDI (oktav taşmalarını sarar)
function degree(t, d, octave) {
  var n = t.scale.length;
  var o = Math.floor(d / n);
  var i = ((d % n) + n) % n;
  return t.root + t.scale[i] + 12 * (o + (octave || 0));
}

function bpm(level) {
  return Math.min(BPM_MAX, BPM0 + BPM_STEP * Math.max(0, (level || 1) - 1));
}
function stepDur(level) { return 60 / bpm(level) / 4; } // 16'lık nota süresi (sn)

// Bir ölçünün notaları: [{ step, ch: 'bass'|'arp'|'lead', freq, len (adım), type }]
// level ilerledikçe katmanlar eklenir: 1–2 bas+arpej, 3+ ezgi, 6+ bas sekizliğe çıkar.
function bar(mapId, barIndex, level) {
  var t = tune(mapId);
  var chord = t.prog[((barIndex % BARS) + BARS) % BARS];
  var notes = [];
  var bassEvery = level >= 6 ? 2 : 4;
  for (var s = 0; s < STEPS_PER_BAR; s += bassEvery) {
    var bd = chord + ((s / bassEvery) % 2 === 1 && bassEvery === 4 ? 4 : 0);
    notes.push({ step: s, ch: 'bass', freq: midiToFreq(degree(t, bd, -2)), len: bassEvery === 2 ? 1.5 : 3, type: 'triangle' });
  }
  var arp = [0, 2, 4, 2];
  for (var a = 0; a < STEPS_PER_BAR; a += 2) {
    notes.push({ step: a, ch: 'arp', freq: midiToFreq(degree(t, chord + arp[(a / 2) % 4], 0)), len: 1, type: 'square' });
  }
  if (level >= 3) {
    // Ezgi: harita + ölçüden belirlenimli; akor tonlarına yakın, ara sıra sus
    var h = hash(mapId + ':' + (((barIndex % BARS) + BARS) % BARS));
    for (var m = 0; m < STEPS_PER_BAR; m += 4) {
      h = (Math.imul(h, 1103515245) + 12345) >>> 0;
      if ((h >>> 8) % 5 === 0) continue;
      var off = [0, 2, 4, 5, 7][(h >>> 12) % 5];
      notes.push({ step: m + ((h >>> 20) % 2) * 2, ch: 'lead', freq: midiToFreq(degree(t, chord + off, 1)), len: 2, type: t.lead });
    }
  }
  notes.sort(function (x, y) { return x.step - y.step; });
  return notes;
}

// İleriye bakan sıralayıcı: her çağrıda [now, now + horizon) aralığına düşen adımları
// play(note, time) ile bir kez verir. Tempo değişirse sonraki adımdan itibaren uygulanır.
function createSequencer(startTime) {
  return { next: startTime || 0, step: 0, bar: 0 };
}
function pump(seq, now, horizon, mapId, level, play) {
  if (seq.next < now - 0.25) seq.next = now; // sekme arkaplandaydı: geri kalanı atla
  var count = 0;
  while (seq.next < now + horizon && count < 64) {
    var notes = bar(mapId, seq.bar, level);
    var sd = stepDur(level);
    for (var i = 0; i < notes.length; i++) {
      if (notes[i].step === seq.step) play(notes[i], seq.next, notes[i].len * sd);
    }
    seq.next += sd;
    seq.step++;
    if (seq.step >= STEPS_PER_BAR) { seq.step = 0; seq.bar = (seq.bar + 1) % BARS; }
    count++;
  }
  return count;
}

// --- Efektler -------------------------------------------------------------
// Her efekt notalar dizisi: { f: Hz, d: sn, at: başlangıç gecikmesi, type, to?: Hz (kayma) }
var SFX = {
  bounce: [{ f: 180, to: 120, d: 0.07, at: 0, type: 'square' }],
  gate: [{ f: 660, d: 0.08, at: 0, type: 'sine' }],
  star: [{ f: 990, d: 0.07, at: 0, type: 'triangle' }, { f: 1320, d: 0.09, at: 0.06, type: 'triangle' }],
  slow: [{ f: 880, to: 330, d: 0.28, at: 0, type: 'sine' }],
  small: [{ f: 600, to: 1500, d: 0.2, at: 0, type: 'sine' }],
  shield: [{ f: 300, to: 180, d: 0.14, at: 0, type: 'square' }],
  level: [{ f: 523, d: 0.08, at: 0, type: 'sine' }, { f: 784, d: 0.12, at: 0.08, type: 'sine' }],
  win: [{ f: 523, d: 0.1, at: 0, type: 'sine' }, { f: 659, d: 0.1, at: 0.1, type: 'sine' }, { f: 784, d: 0.1, at: 0.2, type: 'sine' }, { f: 1046, d: 0.3, at: 0.3, type: 'triangle' }],
  over: [{ f: 220, to: 70, d: 0.4, at: 0, type: 'sawtooth' }],
  buy: [{ f: 880, d: 0.06, at: 0, type: 'triangle' }, { f: 1175, d: 0.08, at: 0.05, type: 'triangle' }],
  quest: [{ f: 784, d: 0.1, at: 0, type: 'triangle' }, { f: 1046, d: 0.14, at: 0.09, type: 'triangle' }]
};

// Kapı sesi skorla hafifçe yükselir (tavanlı)
function gateFreq(score) { return 660 + Math.min(score, 30) * 12; }

var AudioAPI = {
  SETTINGS_KEY: SETTINGS_KEY, STEPS_PER_BAR: STEPS_PER_BAR, BARS: BARS, BPM_MAX: BPM_MAX,
  defaults: defaults, sanitize: sanitize, load: load, save: save,
  midiToFreq: midiToFreq, tune: tune, TUNES: TUNES, bpm: bpm, stepDur: stepDur, bar: bar,
  createSequencer: createSequencer, pump: pump, SFX: SFX, gateFreq: gateFreq
};
if (typeof module !== 'undefined') module.exports = AudioAPI;
if (typeof window !== 'undefined') window.GameAudio = AudioAPI;
})();

<script>
// Sekme Gücü — yalnızca çizim, state değiştirmez
// view: { best, muted, phase: 'ready'|'playing'|'paused'|'over'|'won', fx, touch, newBest, canRestart,
//         theme: {deco, c:{...}}, skin: {shape, color}, coins, earned }  (theme/skin: shop.js kataloğu)
//   fx: { particles: [{x,y,life,max,color}], shake: 0..1, squash: 0..1, trail: [{x,y}] }
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

var W0 = 520;
// Dikey ölçüler oyun durumunun geometrisinden gelir (uzun telefonda alan uzar); setGeo ayarlar.
var DEFAULT_GEO = { H: 540, ceilY: 30, floorY: 480 };
var H0 = 540;
var FLOOR_Y = 480;
var CEIL_Y = 30;
function setGeo(g) {
  g = g || DEFAULT_GEO;
  H0 = g.H; FLOOR_Y = g.floorY; CEIL_Y = g.ceilY;
}
var BALL_X = 160;
var BALL_R = 12;
var WALL_W = 28;
var SMALL_F = 0.6; // logic.js POWER_SMALL_F ile aynı
var PULSE_EDGE = '#7dffb0';
var SPIKE_COL = '#ff5d6c';

function ballR(state) { return state.smallT > 0 ? BALL_R * SMALL_F : BALL_R; }

// Güç simgesi: yavaşlatma = saat, küçülme = içe bakan oklar
function powerIcon(ctx, kind, cx, cy, r) {
  ctx.save();
  ctx.lineWidth = 2;
  if (kind === 'slow') {
    ctx.fillStyle = '#1b3a52';
    ctx.strokeStyle = '#6fe0ff';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - r * 0.65);
    ctx.moveTo(cx, cy); ctx.lineTo(cx + r * 0.5, cy + r * 0.2);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#3d1f45';
    ctx.strokeStyle = '#ff9df0';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff9df0';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function spikes(ctx, x0, w, y) {
  var n = Math.max(3, Math.round(w / 12));
  var tw = w / n;
  ctx.fillStyle = SPIKE_COL;
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    ctx.moveTo(x0 + i * tw, y);
    ctx.lineTo(x0 + i * tw + tw / 2, y - 11);
    ctx.lineTo(x0 + (i + 1) * tw, y);
  }
  ctx.fill();
}

function overlay(ctx, lines) {
  ctx.fillStyle = 'rgba(5,7,12,0.72)';
  ctx.fillRect(0, 0, W0, H0);
  ctx.textAlign = 'center';
  var y = H0 / 2 - (lines.length - 1) * 16;
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    ctx.fillStyle = l.color || '#e8ecf1';
    ctx.font = l.font || '18px system-ui, sans-serif';
    ctx.fillText(l.text, W0 / 2, y);
    y += l.gap || 32;
  }
  ctx.textAlign = 'left';
}

function starShape(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var rr = i % 2 === 0 ? r : r * 0.45;
    var px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

var DEFAULT_THEME = { deco: 'dots', c: { bg: '#0b1220', line: '#223352', wall: '#1f3150', wallPassed: '#16233b', wallMove: '#2b2650', edge: '#5ac8fa', edgeMove: '#b39dfa', deco: 'rgba(200,220,255,0.35)' } };
var DEFAULT_SKIN = { shape: 'circle', color: '#5ac8fa' };

// Top şekli (0,0 merkezli). Mağaza önizlemesi de bunu kullanır.
function drawBall(ctx, shape, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  if (shape === 'square') {
    ctx.rect(-r * 0.9, -r * 0.9, r * 1.8, r * 1.8);
  } else if (shape === 'diamond') {
    ctx.moveTo(0, -r * 1.15); ctx.lineTo(r * 1.0, 0); ctx.lineTo(0, r * 1.15); ctx.lineTo(-r * 1.0, 0);
    ctx.closePath();
  } else if (shape === 'star') {
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rr = i % 2 === 0 ? r * 1.25 : r * 0.6;
      if (i === 0) ctx.moveTo(Math.cos(ang) * rr, Math.sin(ang) * rr); else ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
    }
    ctx.closePath();
  } else {
    ctx.arc(0, 0, r, 0, Math.PI * 2);
  }
  ctx.fill();
  if (shape === 'ring') {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.save();
    ctx.scale(1, 0.35);
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// Arka plan süsü: kaymalı (paralaks) ama deterministik; dist = katedilen yol.
function drawDeco(ctx, theme, dist, geo) {
  if (geo) setGeo(geo);
  var col = theme.c.deco;
  var d = dist || 0;
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  var i, x;
  if (theme.deco === 'sun') {
    // Ufukta yarım güneş + soluk çizgiler; oyun alanında engel gibi görünmesin
    ctx.beginPath();
    ctx.arc(400, FLOOR_Y, 60, Math.PI, Math.PI * 2);
    ctx.fill();
    for (i = 0; i < 3; i++) ctx.fillRect(0, FLOOR_Y - 14 - i * 16, W0, 1);
  } else if (theme.deco === 'trees') {
    for (i = 0; i < 9; i++) {
      x = ((i * 83 - d * 0.25) % (W0 + 80) + W0 + 80) % (W0 + 80) - 40;
      var h = 60 + (i * 37) % 70;
      ctx.beginPath();
      ctx.moveTo(x, FLOOR_Y); ctx.lineTo(x + 26, FLOOR_Y - h); ctx.lineTo(x + 52, FLOOR_Y);
      ctx.closePath();
      ctx.fill();
    }
  } else if (theme.deco === 'grid') {
    ctx.lineWidth = 1;
    var off = (d * 0.5) % 40;
    for (x = -off; x < W0; x += 40) { ctx.beginPath(); ctx.moveTo(x, CEIL_Y); ctx.lineTo(x, FLOOR_Y); ctx.stroke(); }
    for (var y = CEIL_Y; y < FLOOR_Y; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W0, y); ctx.stroke(); }
  } else if (theme.deco === 'flakes') {
    for (i = 0; i < 26; i++) {
      x = ((i * 61 - d * 0.15) % W0 + W0) % W0;
      var fy = CEIL_Y + 10 + ((i * 97) % (FLOOR_Y - CEIL_Y - 20));
      ctx.fillRect(x - 1.5, fy - 1.5, 3, 3);
    }
  } else {
    for (i = 0; i < 30; i++) {
      x = ((i * 53 - d * 0.1) % W0 + W0) % W0;
      ctx.fillRect(x, CEIL_Y + 8 + ((i * 71) % (FLOOR_Y - CEIL_Y - 16)), 2, 2);
    }
  }
}

function questLines(view) {
  var q = view.questDone || [];
  var out = [];
  for (var i = 0; i < q.length && i < 3; i++) {
    out.push({ text: '✓ Görev: ' + q[i].text + '  +' + q[i].reward + ' ★', font: '15px system-ui, sans-serif', color: '#46d39a', gap: 26 });
  }
  if (out.length) out[out.length - 1].gap = 40;
  return out;
}

function draw(ctx, state, view) {
  view = view || {};
  var fx = view.fx || {};
  var best = view.best || 0;
  var phase = view.phase || state.status;
  setGeo(state.geo);
  // Canvas piksel boyutu main.js'de DPR'ye göre ayarlanır; burada mantıksal 520x540 ile çizilir.
  var scale = ctx.canvas.width / W0;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  var theme = view.theme || DEFAULT_THEME;
  var tc = theme.c;
  var skin = view.skin || DEFAULT_SKIN;
  var textCol = tc.text || '#e8ecf1';
  var textDim = tc.textDim || '#9fb3d1';
  ctx.fillStyle = tc.bg;
  ctx.fillRect(0, 0, W0, H0);
  drawDeco(ctx, theme, state.distance);

  // Ekran sarsıntısı (≤ 200 ms, zamanlamayı main.js yapar)
  var shake = fx.shake || 0;
  if (shake > 0) {
    var amp = 7 * shake;
    ctx.translate((Math.random() * 2 - 1) * amp, (Math.random() * 2 - 1) * amp);
  }

  ctx.strokeStyle = tc.line;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, CEIL_Y);
  ctx.lineTo(W0, CEIL_Y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y);
  ctx.lineTo(W0, FLOOR_Y);
  ctx.stroke();

  for (var i = 0; i < state.obstacles.length; i++) {
    var o = state.obstacles[i];
    // Hareketli kapı mor tonlu, delinen (kalkanla) duvar soluk
    ctx.fillStyle = o.hit ? tc.wallPassed : (o.passed ? tc.wallPassed : (o.move ? tc.wallMove : tc.wall));
    ctx.globalAlpha = o.hit ? 0.5 : 1;
    ctx.fillRect(o.x, CEIL_Y, WALL_W, o.gapY - CEIL_Y);
    ctx.fillRect(o.x, o.gapY + o.gapH, WALL_W, FLOOR_Y - (o.gapY + o.gapH));
    // Kapı ağzını belirginleştiren ince kenar
    // Nefes alan kapının ağzı yeşil
    ctx.fillStyle = o.passed ? tc.line : (o.move ? tc.edgeMove : (o.pulse ? PULSE_EDGE : tc.edge));
    ctx.fillRect(o.x, o.gapY - 3, WALL_W, 3);
    ctx.fillRect(o.x, o.gapY + o.gapH, WALL_W, 3);
    ctx.globalAlpha = 1;
    if (o.spike) {
      ctx.globalAlpha = o.spike.hit ? 0.3 : 1;
      spikes(ctx, o.x + WALL_W + o.spike.dx, o.spike.w, FLOOR_Y);
      ctx.globalAlpha = 1;
    }
  }

  // Yıldızlar (kapı ortasında; toplanınca kalkan)
  for (var si = 0; si < state.obstacles.length; si++) {
    var so = state.obstacles[si];
    if (!so.star || so.star.taken) continue;
    starShape(ctx, so.x + WALL_W / 2, so.gapY + so.gapH / 2, 9, '#ffd166');
  }
  for (var pi = 0; pi < state.obstacles.length; pi++) {
    var po = state.obstacles[pi];
    if (!po.power || po.power.taken) continue;
    powerIcon(ctx, po.power.kind, po.x + WALL_W / 2, po.gapY + po.gapH / 2, 10);
  }
  var R0 = ballR(state);

  // İz
  var trail = fx.trail || [];
  for (var t = 0; t < trail.length; t++) {
    var a = (t + 1) / (trail.length + 1);
    ctx.globalAlpha = 0.25 * a;
    ctx.fillStyle = skin.color;
    ctx.beginPath();
    ctx.arc(trail[t].x, trail[t].y, R0 * (0.4 + 0.5 * a), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Top — zemine çarpınca kısa basılma
  var sq = fx.squash || 0;
  var sx = 1 + 0.35 * sq;
  var sy = 1 - 0.3 * sq;
  ctx.save();
  ctx.translate(BALL_X, state.y + R0 * (1 - sy));
  ctx.scale(sx, sy);
  drawBall(ctx, skin.shape, R0, state.status === 'over' ? '#e05656' : skin.color);
  ctx.restore();

  // Kalkan halkası
  if (state.shield > 0 && state.status === 'playing') {
    ctx.strokeStyle = 'rgba(255,209,102,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(BALL_X, state.y, R0 + 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Parçacıklar
  var ps = fx.particles || [];
  for (var p = 0; p < ps.length; p++) {
    var q = ps[p];
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

      var b = document.createElement('button');
      if (lv >= max) { b.textContent = 'Tam'; b.disabled = true; b.className = 'kusanildi'; }
      else { b.textContent = '★ ' + u.prices[lv]; b.disabled = profile.coins < u.prices[lv]; b.className = 'al'; }
      b.addEventListener('click', function () {
        if (!Shop.buyUpgrade(profile, u.id).ok) return;
        Shop.save(window.localStorage, profile);
        sfx('buy');
        renderShop();
      });
      row.appendChild(pips); row.appendChild(info); row.appendChild(b);
      list.appendChild(row);
    });
    var foot = document.createElement('p');
    foot.className = 'not';
    foot.textContent = 'Güçlendirmeler kalıcıdır ve bir sonraki koşudan itibaren geçerlidir. Ölünce ★ ' +
      Shop.reviveCost(0) + ' ile devam edebilirsin (koşu başına en çok ' + Shop.REVIVE_MAX + ', fiyat her seferinde ikiye katlanır).';
    list.appendChild(foot);
  }
  function renderShop() {
    if (!shopEl || !profile) return;
    shopEl.querySelector('.cuzdan').textContent = '★ ' + profile.coins;
    var tabs = shopEl.querySelectorAll('[data-sekme]');
    for (var t = 0; t < tabs.length; t++) tabs[t].setAttribute('aria-selected', String(tabs[t].getAttribute('data-sekme') === shopTab));
    var list = shopEl.querySelector('.liste');
    list.innerHTML = '';
    if (shopTab === 'quests') { if (daily) renderQuests(list); return; }
    if (shopTab === 'upg') { renderUpgrades(list); return; }
    Shop.CATALOG[shopTab].forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'urun';
      row.appendChild(preview(item, shopTab));
      var name = document.createElement('span');
      name.className = 'ad';
      name.textContent = item.name;
      row.appendChild(name);
      var b = document.createElement('button');
      var owned = Shop.owns(profile, shopTab, item.id);
      var on = profile.equipped[shopTab] === item.id;
      if (on) { b.textContent = 'Kuşanıldı'; b.disabled = true; b.className = 'kusanildi'; }
      else if (owned) { b.textContent = 'Kuşan'; }
      else { b.textContent = '★ ' + item.price; b.disabled = profile.coins < item.price; b.className = 'al'; }
      b.addEventListener('click', function () {
        if (Shop.owns(profile, shopTab, item.id)) Shop.equip(profile, shopTab, item.id);
        else if (!Shop.buy(profile, shopTab, item.id).ok) return;
        Shop.save(window.localStorage, profile);
        sfx('buy');
        renderShop();
      });
      row.appendChild(b);
      list.appendChild(row);
    });
  }
  function openShop(tab) {
    if (!shopEl || phase === 'playing') return;
    if (typeof tab === 'string') shopTab = tab;
    shopOpen = true;
    release();
    shopEl.hidden = false;
    renderShop();
  }
  function closeShop() {
    if (!shopEl) return;
    shopOpen = false;
    shopEl.hidden = true;
  }
  if (shopEl && shopBtn && profile) {
    shopBtn.addEventListener('click', function () { openShop(shopTab === 'quests' ? 'ball' : shopTab); });
    var questBtn = document.getElementById('gorevBtn');
    if (questBtn) questBtn.addEventListener('click', function () { openShop('quests'); });
    shopEl.querySelector('.kapat').addEventListener('click', closeShop);
    var tabEls = shopEl.querySelectorAll('[data-sekme]');
    for (var ti = 0; ti < tabEls.length; ti++) {
      tabEls[ti].addEventListener('click', function (ev) { shopTab = ev.currentTarget.getAttribute('data-sekme'); renderShop(); });
    }
  }

  function pause() {
    if (phase !== 'playing') return;
    phase = 'paused';
    release();
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  // Bütün ekran dokunma alanı; bırakma pencere düzeyinde dinlenir ki parmak kayınca kaçmasın.
  window.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointerup', onPointerUp, { passive: false });
  window.addEventListener('pointercancel', onPointerUp);
  window.addEventListener('blur', function () { release(); pause(); });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('resize', function () {
    if (phase === 'ready') { state = newGame(); }
  });
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) pause();
    });
  }

  var acc = 0;
  var last = null;

  function frame(ts) {
    if (last === null) last = ts;
    var frameDt = (ts - last) / 1000;
    last = ts;
    if (frameDt > 0.25) frameDt = 0.25;

    if (phase === 'playing') {
      acc += frameDt;
      var steps = 0;
      while (acc >= DT && steps < 5) {
        state = window.GameLogic.step(state, input, DT);
        acc -= DT;
        steps++;

        if (state.bounces !== prevBounces) {
          sfx('bounce');
          squashLeft = SQUASH_MS;
          burst(C.BALL_X, C.FLOOR_Y, 4, '#2f4a73', 120);
          prevBounces = state.bounces;
        }
        if (state.score !== prevScore) {
          beep(Snd ? Snd.gateFreq(state.score) : 660, 0.08, 'sine');
          buzz(8);
          burst(C.BALL_X, state.y, 10, '#5ac8fa', 220);
          prevScore = state.score;
        }
        if (state.stars !== prevStars) {
          sfx('star');
          burst(C.BALL_X, state.y, 12, '#ffd166', 200);
          prevStars = state.stars;
        }
        if (state.powers !== prevPowers) {
          var slowNow = state.slowT === C.POWER_SLOW_T; // bu adımda alındıysa süre tam dolu
          sfx(slowNow ? 'slow' : 'small');
          buzz(12);
          burst(C.BALL_X, state.y, 14, slowNow ? '#6fe0ff' : '#ff9df0', 220);
          prevPowers = state.powers;
        }
        if (state.shieldUsed !== prevShieldUsed) {
          sfx('shield');
          buzz(30);
          shakeLeft = SHAKE_MS * 0.6;
          burst(C.BALL_X + 14, state.y, 16, '#ffd166', 260);
          prevShieldUsed = state.shieldUsed;
        }
        if (state.level !== prevLevel) {
          var sub = state.level === C.STAR_FROM ? 'Yıldız topla: bir çarpmayı affeder'
            : state.level === C.MOVE_FROM ? 'Mor kapılar hareket eder'
            : state.level === C.PULSE_FROM ? 'Yeşil kapılar daralıp genişler'
            : state.level === C.POWER_FROM ? 'Güçler: ⏱ dünyayı yavaşlatır, pembe top küçültür'
            : state.level === C.DOUBLE_FROM ? 'Çift duvarlar geliyor'
            : state.level === C.SPIKE_FROM ? 'Kırmızı dikenlere sekme: basılı tut, havada kal' : '';
          var milestone = state.milestones !== prevMilestones;
          if (milestone) {
            // Her 10 bölümde bir eşik: büyük kutlama, ödülde +MILESTONE_BONUS
            sub = 'Eşik ' + state.milestones + ' geçildi! +' + (Shop ? Shop.MILESTONE_BONUS : 5) + ' ★' + (state.milestones === 1 ? ' · artık sonsuz: zorluk yavaşça artar' : '');
            prevMilestones = state.milestones;
            sfx('win');
            buzz(40);
            burst(C.BALL_X, state.y, 40, '#ffd166', 360);
          } else {
            sfx('level');
          }
          banner = { title: 'Bölüm ' + state.level, sub: sub, a: milestone ? 3 : sub ? 2.2 : 1.4 };
          prevLevel = state.level;
        }
        if (state.status === 'over') {
          sfx('over');
          buzz(60);
          shakeLeft = SHAKE_MS;
          burst(C.BALL_X, state.y, 24, '#e05656', 320);
          if (state.score > best) {
            best = state.score;
            newBest = true;
            try { window.localStorage.setItem('sekmeguc-best', String(best)); } catch (e) {}
          }
          phase = 'over';
          overAt = nowMs();
          input.action = false;
          acc = 0;
          break;
        }
      }
      fx.trail.push({ x: C.BALL_X, y: state.y });
      if (fx.trail.length > TRAIL_LEN) fx.trail.shift();
    } else {
      acc = 0;
    }
    updateFx(frameDt);
    if (banner.a > 0 && phase === 'playing') banner.a = Math.max(0, banner.a - frameDt);

    musicTick();
    settle();
    var rOpen = reviveOpen();
    if (devamBtn) {
      devamBtn.hidden = !rOpen;
      if (rOpen) devamBtn.textContent = '❤ Devam  ★ ' + Shop.reviveCost(state.revives) + '  (' + Math.ceil((REVIVE_MS - (nowMs() - overAt)) / 1000) + ')';
    }
    var showBtns = !rOpen && !shopOpen && !!profile && (phase === 'ready' || phase === 'over' || phase === 'won') && canRestart();
    if (shopBtn) shopBtn.hidden = !showBtns;
    var qb = document.getElementById('gorevBtn');
    if (qb) {
      qb.hidden = !showBtns || !daily;
      if (daily) {
        var left = 0;
        for (var qn = 0; qn < daily.quests.length; qn++) if (!daily.quests[qn].done) left++;
        qb.textContent = '📋 Görevler' + (left ? ' (' + left + ')' : ' ✓');
      }
    }
    window.GameRender.draw(ctx, state, {
      best: best, muted: muted, phase: phase, fx: fx, touch: touch,
      newBest: newBest, canRestart: (phase === 'over' || phase === 'won') && canRestart(),
      banner: banner, levelCount: C.LEVEL_COUNT, gatesPerLevel: C.GATES_PER_LEVEL,
      theme: profile ? Shop.equippedMap(profile) : null, skin: profile ? Shop.equippedBall(profile) : null,
      coins: profile && phase !== 'playing' && phase !== 'paused' ? profile.coins : undefined,
      earned: phase === 'over' || phase === 'won' ? earned : 0,
      questDone: phase === 'over' || phase === 'won' ? questDone : [],
      notice: phase === 'ready' ? notice : '',
      revive: rOpen ? { cost: Shop.reviveCost(state.revives), touch: touch } : null
    });
    window.requestAnimationFrame(frame);
  }

  window.requestAnimationFrame(frame);
}

if (typeof window !== 'undefined') {
  window.GameMain = { bootstrap: bootstrap };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
}
if (typeof module !== 'undefined') module.exports = { bootstrap: bootstrap };
})();

</script>

</body>
</html>
