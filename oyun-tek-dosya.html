<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tek Atış</title>
<style>
  html, body { margin: 0; background: #020617; color: #cbd5e1; font-family: system-ui, sans-serif; text-align: center; }
  canvas { display: block; margin: 8px auto 0; max-width: 100%; height: auto; touch-action: none; }
  p { margin: 6px 0; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game" width="900" height="400"></canvas>
<p>Yukarı/Aşağı: açı · Sol/Sağ: güç · Boşluk: ateş · R: yeniden · M: ses</p>
<script>
'use strict';
// Saf oyun mantığı: DOM yok, canvas yok. Rastgelelik seed'li PRNG'den gelir.
var C = {
  W: 900, H: 400, CX: 60, MUZZLE_Y: 8, G: 400, R: 6,
  ANG_MIN: 10, ANG_MAX: 80, ANG_RATE: 35,
  PW_MIN: 250, PW_MAX: 650, PW_RATE: 160,
  LEVELS: 10, NEXT_DELAY: 0.8, WALL_W: 16
};

function rand(s) {
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  var t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function genLevel(s) {
  var lv = s.level;
  var w = Math.max(50, Math.round(112 - 6 * lv));
  s.target = { x: Math.round(380 + rand(s) * (820 - w - 380)), w: w };
  s.wind = lv >= 2 ? Math.round((rand(s) * 2 - 1) * Math.min(80, 15 * lv)) : 0;
  if (lv >= 3) {
    var wx = Math.round(C.CX + (s.target.x - C.CX) * 0.5);
    s.wall = { x: wx, w: C.WALL_W, h: Math.round(60 + rand(s) * 80) };
  } else {
    s.wall = null;
  }
}

function createState(seed) {
  var s = {
    status: 'playing', overReason: '', score: 0, level: 1, cleared: 0,
    phase: 'aim', angle: 45, power: 450, ball: null, trail: [],
    target: null, wall: null, wind: 0, timer: 0, time: 0, overTime: 0,
    lastPoints: 0, landX: 0, rng: seed | 0
  };
  genLevel(s);
  return s;
}

function lose(s, reason) {
  s.status = 'over';
  s.overReason = reason;
  s.overTime = 0;
}

function fire(s) {
  var a = s.angle * Math.PI / 180;
  s.ball = { x: C.CX, y: C.MUZZLE_Y, vx: s.power * Math.cos(a), vy: s.power * Math.sin(a) };
  s.trail = [];
  s.phase = 'flight';
}

function flight(s, dt) {
  var b = s.ball;
  var px = b.x, py = b.y;
  b.vx += s.wind * dt;
  b.vy -= C.G * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  if (s.trail.length < 400) s.trail.push([b.x, b.y]);
  var w = s.wall;
  if (w && b.x + C.R > w.x && b.x - C.R < w.x + w.w && b.y - C.R < w.h) {
    return lose(s, 'Duvara çarptın');
  }
  if (b.x > C.W + 20 || b.x < -20) return lose(s, 'Alanın dışına çıktın');
  if (b.y <= 0) {
    var k = py / (py - b.y);
    var xl = px + (b.x - px) * k;
    b.x = xl; b.y = 0;
    s.landX = xl;
    var t = s.target;
    if (xl >= t.x && xl <= t.x + t.w) {
      var off = Math.abs(xl - (t.x + t.w / 2)) / (t.w / 2);
      s.lastPoints = 100 + Math.round(50 * (1 - off));
      s.score += s.lastPoints;
      s.cleared++;
      if (s.cleared >= C.LEVELS) { s.status = 'won'; s.overTime = 0; return; }
      s.phase = 'result';
      s.timer = C.NEXT_DELAY;
    } else {
      lose(s, xl < t.x ? 'Hedefin önüne düştü' : 'Hedefi geçtin');
    }
  }
}

function step(s, input, dt) {
  if (s.status !== 'playing') { s.overTime += dt; return; }
  s.time += dt;
  if (s.phase === 'aim') {
    if (input.up) s.angle += C.ANG_RATE * dt;
    if (input.down) s.angle -= C.ANG_RATE * dt;
    if (input.right) s.power += C.PW_RATE * dt;
    if (input.left) s.power -= C.PW_RATE * dt;
    if (typeof input.angle === 'number') s.angle = input.angle;
    if (typeof input.power === 'number') s.power = input.power;
    s.angle = clamp(s.angle, C.ANG_MIN, C.ANG_MAX);
    s.power = clamp(s.power, C.PW_MIN, C.PW_MAX);
    if (input.action) fire(s);
  } else if (s.phase === 'flight') {
    flight(s, dt);
  } else if (s.phase === 'result') {
    s.timer -= dt;
    if (s.timer <= 0) {
      s.level++;
      genLevel(s);
      s.ball = null;
      s.trail = [];
      s.phase = 'aim';
    }
  }
}

if (typeof module !== 'undefined') module.exports = { createState: createState, step: step, C: C };
if (typeof window !== 'undefined') window.GameLogic = { createState: createState, step: step, C: C };

</script>
<script>
'use strict';
// Sadece çizim: state'i değiştirmez.
function draw(ctx, s, view) {
  var W = 900, H = 400, GY = 340;
  var best = (view && view.best) || 0;
  var muted = view && view.muted;
  var shake = 0;
  if (s.status === 'over' && s.overTime < 0.2) shake = (0.2 - s.overTime) * 30;
  ctx.save();
  if (shake) ctx.translate((Math.sin(s.overTime * 200)) * shake, 0);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-20, 0, W + 40, H);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-20, GY, W + 40, H - GY);

  // hedef
  var t = s.target;
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(t.x, GY - 6, t.w, 10);
  ctx.fillStyle = '#bbf7d0';
  ctx.fillRect(t.x + t.w / 2 - 1, GY - 10, 2, 14);

  // duvar
  if (s.wall) {
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(s.wall.x, GY - s.wall.h, s.wall.w, s.wall.h);
  }

  // top izi
  ctx.fillStyle = 'rgba(250,204,21,0.45)';
  for (var i = 0; i < s.trail.length; i += 6) {
    ctx.fillRect(s.trail[i][0] - 1, GY - s.trail[i][1] - 1, 3, 3);
  }

  // top ve top
  if (s.ball) {
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(s.ball.x, GY - s.ball.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // top (namlu)
  var a = s.angle * Math.PI / 180;
  ctx.save();
  ctx.translate(60, GY - 8);
  ctx.rotate(-a);
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(0, -5, 36, 10);
  ctx.restore();
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(60, GY - 8, 13, 0, Math.PI * 2);
  ctx.fill();

  // kısa yörünge önizlemesi (ilk 0.2 sn, rüzgârsız)
  if (s.phase === 'aim' && s.status === 'playing') {
    ctx.fillStyle = 'rgba(226,232,240,0.6)';
    for (var k = 1; k <= 4; k++) {
      var tt = k * 0.05;
      var px = 60 + s.power * Math.cos(a) * tt;
      var py = 8 + s.power * Math.sin(a) * tt - 200 * tt * tt;
      ctx.fillRect(px - 1.5, GY - py - 1.5, 3, 3);
    }
  }

  // yazılar
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Skor ' + s.score, 14, 26);
  ctx.fillText('Seviye ' + Math.min(s.level, 10) + '/10', 14, 50);
  ctx.textAlign = 'right';
  ctx.fillText('Rekor ' + best, W - 14, 26);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText(muted ? 'ses kapalı (M)' : 'ses açık (M)', W - 14, 46);
  ctx.textAlign = 'left';
  ctx.fillText('Açı ' + Math.round(s.angle) + '°   Güç ' + Math.round(s.power), 14, GY + 30);
  var wd = s.wind === 0 ? 'rüzgâr yok' : 'rüzgâr ' + (s.wind > 0 ? '→ ' : '← ') + Math.abs(s.wind);
  ctx.fillText(wd, 14, GY + 52);
  ctx.textAlign = 'center';
  if (s.phase === 'result' && s.status === 'playing') {
    ctx.fillStyle = '#86efac';
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText('İsabet! +' + s.lastPoints, W / 2, 120);
  }
  if (s.phase === 'aim' && s.status === 'playing' && s.cleared === 0 && s.time < 8) {
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Tek atış hakkın var: açıyı ve gücü ayarla, Boşluk ile ateşle', W / 2, 120);
  }
  if (s.status === 'over') {
    ctx.fillStyle = 'rgba(2,6,23,0.7)';
    ctx.fillRect(0, 130, W, 110);
    ctx.fillStyle = '#fca5a5';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText(s.overReason, W / 2, 172);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Skor ' + s.score + ' — R, Boşluk veya dokunuş: yeniden', W / 2, 205);
  } else if (s.status === 'won') {
    ctx.fillStyle = 'rgba(2,6,23,0.7)';
    ctx.fillRect(0, 130, W, 110);
    ctx.fillStyle = '#86efac';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText('On hedefi de vurdun', W / 2, 172);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Skor ' + s.score + ' — R, Boşluk veya dokunuş: yeniden', W / 2, 205);
  }
  ctx.restore();
}

if (typeof module !== 'undefined') module.exports = { draw: draw };
if (typeof window !== 'undefined') window.GameRender = { draw: draw };

</script>
<script>
'use strict';
// Döngü, girdi ve ses; logic + render'ı bağlar.
function bootstrap() {
  var DT = 1 / 60;
  var L = window.GameLogic, R = window.GameRender;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var input = { left: false, right: false, up: false, down: false, action: false, restart: false, angle: null, power: null };
  var muted = false, actx = null, best = 0, last = null, acc = 0, dragging = false;
  try { best = Number(localStorage.getItem('tekatis-best')) || 0; } catch (e) { best = 0; }

  function newSeed() { return (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0; }
  var state = L.createState(newSeed());

  function audio() {
    if (actx || muted) return actx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) { actx = null; }
    return actx;
  }
  function beep(freq, dur, type) {
    if (muted) return;
    try {
      var a = audio();
      if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = 0.06;
      o.connect(g); g.connect(a.destination);
      o.start();
      o.stop(a.currentTime + dur);
    } catch (e) { /* sessiz devam */ }
  }
  function saveBest() {
    if (state.score > best) {
      best = state.score;
      try { localStorage.setItem('tekatis-best', String(best)); } catch (e) { /* kayıt yok */ }
    }
  }
  function reset() { state = L.createState(newSeed()); beep(500, 0.06); }

  function keyMap(e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') return 'up';
    if (k === 'ArrowDown' || k === 's' || k === 'S') return 'down';
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') return 'left';
    if (k === 'ArrowRight' || k === 'd' || k === 'D') return 'right';
    if (k === ' ' || k === 'Enter' || e.code === 'Space') return 'action';
    if (k === 'r' || k === 'R' || e.code === 'KeyR') return 'restart';
    if (k === 'm' || k === 'M') return 'mute';
    return null;
  }
  window.addEventListener('keydown', function (e) {
    var m = keyMap(e);
    if (!m) return;
    if (e.preventDefault) e.preventDefault();
    audio();
    if (m === 'mute') { muted = !muted; return; }
    if (m === 'action' || m === 'restart') { if (!e.repeat) input[m] = true; return; }
    input[m] = true;
  });
  window.addEventListener('keyup', function (e) {
    var m = keyMap(e);
    if (m && m !== 'action' && m !== 'restart' && m !== 'mute') input[m] = false;
  });

  function aimFromPointer(e) {
    var r = canvas.getBoundingClientRect();
    var sx = 900 / (r.width || 900), sy = 400 / (r.height || 400);
    var dx = (e.clientX - r.left) * sx - 60, dy = 332 - (e.clientY - r.top) * sy;
    var ang = Math.atan2(dy, Math.max(dx, 1)) * 180 / Math.PI;
    var pw = 250 + Math.min(1, Math.sqrt(dx * dx + dy * dy) / 400) * 400;
    input.angle = Math.max(10, Math.min(80, ang));
    input.power = pw;
  }
  canvas.addEventListener('pointerdown', function (e) { audio(); dragging = true; aimFromPointer(e); });
  canvas.addEventListener('pointermove', function (e) { if (dragging) aimFromPointer(e); });
  canvas.addEventListener('pointerup', function () {
    if (!dragging) return;
    dragging = false;
    input.action = true;
  });

  function frame(t) {
    if (last === null) last = t;
    acc += Math.min(0.25, (t - last) / 1000);
    last = t;
    if (input.restart || (input.action && state.status !== 'playing' && state.overTime > 0.4)) {
      reset();
      input.restart = false; input.action = false; input.angle = null; input.power = null;
    }
    var n = 0;
    while (acc >= DT && n < 5) {
      var ph = state.phase, st = state.status, cl = state.cleared;
      L.step(state, input, DT);
      if (input.action) { input.action = false; }
      if (!dragging) { input.angle = null; input.power = null; }
      if (ph === 'aim' && state.phase === 'flight') beep(180, 0.12, 'sawtooth');
      if (state.cleared > cl) beep(760, 0.15, 'square');
      if (st === 'playing' && state.status === 'over') { beep(110, 0.3, 'sawtooth'); saveBest(); }
      if (st === 'playing' && state.status === 'won') { beep(980, 0.4, 'square'); saveBest(); }
      acc -= DT; n++;
    }
    if (n === 5) acc = 0;
    R.draw(ctx, state, { best: best, muted: muted });
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
  return { getState: function () { return state; } };
}

if (typeof window !== 'undefined') {
  window.GameMain = { bootstrap: bootstrap };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
}
if (typeof module !== 'undefined') module.exports = { bootstrap: bootstrap };

</script>
</body>
</html>
