<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Komşu Bahçe</title>
<style>
  html,body{margin:0;background:#10161d;color:#cbd5e1;font-family:system-ui,sans-serif;text-align:center}
  canvas{display:block;margin:8px auto 0;max-width:100%;height:auto;touch-action:manipulation}
  p{margin:6px 0;font-size:14px}
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<p>Oklar/WASD: imleç · Boşluk/tık: yerleştir · R: yeniden · M: ses</p>
<script>
// Komşu Bahçe — saf oyun mantığı (DOM yok).
(function () {
  'use strict';
  var N = 5, CELLS = 25, TILE_TIME = 12;
  // PAIR[a][b]: iki komşu türün birbirine katkısı (0 Tarla, 1 Kuyu, 2 Kovan)
  var PAIR = [[-1, 4, 3], [4, -1, -2], [3, -2, -1]];
  var QUOTA = { 5: 4, 10: 14, 15: 28, 20: 44, 25: 60 };
  var KEYS = ['left', 'right', 'up', 'down', 'action', 'restart'];

  function rnd(s) {
    s.rs = (s.rs + 0x6D2B79F5) | 0;
    var t = Math.imul(s.rs ^ (s.rs >>> 15), 1 | s.rs);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function fillQueue(s) { while (s.queue.length < 4) s.queue.push(Math.floor(rnd(s) * 3)); }
  function emptyPrev() { var p = {}; KEYS.forEach(function (k) { p[k] = false; }); return p; }

  function createState(seed) {
    var s = {
      seed: seed, rs: seed | 0, time: 0, status: 'playing', overReason: '',
      score: 0, placed: 0, cursor: 12, board: [], queue: [], tileTimer: TILE_TIME,
      prev: emptyPrev(), flash: 0, lastGain: 0, lastIdx: -1, msg: '', event: '', eventSeq: 0
    };
    for (var i = 0; i < CELLS; i++) s.board.push(-1);
    fillQueue(s);
    return s;
  }

  function gainAt(board, idx, type) {
    var x = idx % N, y = Math.floor(idx / N), g = 1;
    var nb = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
    for (var i = 0; i < 4; i++) {
      var nx = nb[i][0], ny = nb[i][1];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      var t = board[ny * N + nx];
      if (t >= 0) g += PAIR[type][t];
    }
    return g;
  }

  function fire(s, name) { s.event = name; s.eventSeq++; }
  function lose(s, reason) { s.status = 'over'; s.overReason = reason; fire(s, 'over'); }

  function step(s, input, dt) {
    var p = s.prev, e = {};
    KEYS.forEach(function (k) { e[k] = !!input[k] && !p[k]; });
    var cur = emptyPrev();
    KEYS.forEach(function (k) { cur[k] = !!input[k]; });
    s.prev = cur;

    if (s.status !== 'playing') {
      if (e.restart || e.action) {
        var np = createState(s.seed + 1);
        np.prev = cur;
        Object.keys(s).forEach(function (k) { delete s[k]; });
        Object.keys(np).forEach(function (k) { s[k] = np[k]; });
      }
      return;
    }

    s.time += dt;
    s.flash = Math.max(0, s.flash - dt);
    s.tileTimer -= dt;
    if (s.tileTimer <= 0) { s.tileTimer = 0; lose(s, 'Süre doldu: kareyi zamanında yerleştirmedin'); return; }

    var x = s.cursor % N, y = Math.floor(s.cursor / N), act = e.action;
    if (e.left) x = Math.max(0, x - 1);
    if (e.right) x = Math.min(N - 1, x + 1);
    if (e.up) y = Math.max(0, y - 1);
    if (e.down) y = Math.min(N - 1, y + 1);
    s.cursor = y * N + x;
    if (typeof input.cell === 'number' && input.cell >= 0 && input.cell < CELLS) { s.cursor = input.cell; act = true; }
    if (!act) return;

    if (s.board[s.cursor] >= 0) { s.msg = 'Kare dolu'; s.flash = 0.2; s.lastIdx = s.cursor; s.lastGain = 0; fire(s, 'bad'); return; }
    var type = s.queue.shift();
    var g = gainAt(s.board, s.cursor, type);
    s.board[s.cursor] = type;
    s.score += g; s.placed++;
    s.tileTimer = TILE_TIME; s.flash = 0.35; s.lastGain = g; s.lastIdx = s.cursor; s.msg = '';
    fillQueue(s);
    fire(s, g > 0 ? 'place' : 'bad');
    var q = QUOTA[s.placed];
    if (q !== undefined && s.score < q) {
      lose(s, 'Kota tutmadı: ' + s.placed + '. yerleşimde en az ' + q + ' puan gerekirdi, sende ' + s.score);
    } else if (s.placed >= CELLS) {
      s.status = 'won'; fire(s, 'won');
    }
  }

  var api = { createState: createState, step: step, gainAt: gainAt, QUOTA: QUOTA, PAIR: PAIR, N: N, TILE_TIME: TILE_TIME };
  if (typeof module !== 'undefined') module.exports = api;
  if (typeof window !== 'undefined') window.GameLogic = api;
})();

</script>
<script>
// Komşu Bahçe — yalnızca çizim.
(function () {
  'use strict';
  var GX = 40, GY = 160, CS = 80, N = 5;
  var COL = ['#58b368', '#4a90d9', '#e8b93c'];
  var NAMES = ['Tarla', 'Kuyu', 'Kovan'];

  function cellAt(x, y) {
    var cx = Math.floor((x - GX) / CS), cy = Math.floor((y - GY) / CS);
    if (cx < 0 || cy < 0 || cx >= N || cy >= N) return -1;
    return cy * N + cx;
  }

  function tile(ctx, type, cx, cy, r) {
    ctx.fillStyle = COL[type];
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 2;
    if (type === 0) {
      ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
      ctx.beginPath();
      for (var i = -1; i <= 1; i++) { ctx.moveTo(cx - r, cy + i * r * 0.5); ctx.lineTo(cx + r, cy + i * r * 0.5); }
      ctx.stroke();
    } else if (type === 1) {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.beginPath();
      for (var k = 0; k < 6; k++) {
        var a = Math.PI / 6 + k * Math.PI / 3;
        var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  function draw(ctx, s, view) {
    view = view || {};
    ctx.fillStyle = '#1b2430';
    ctx.fillRect(0, 0, 480, 640);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e8eef5';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillText('Komşu Bahçe', 40, 30);
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Puan: ' + s.score, 40, 58);
    var nextQ = 5 * (Math.floor(s.placed / 5) + 1);
    var q = s.placed >= 25 ? 60 : (view.quota ? view.quota[nextQ] : nextQ);
    ctx.fillText('Yerleşim: ' + s.placed + '/25   Kota (' + nextQ + '.): ' + q, 40, 82);
    ctx.fillText('Rekor: ' + (view.best || 0), 40, 106);

    // sıradaki parçalar
    ctx.textAlign = 'right';
    ctx.fillText('Sıradaki:', 330, 62);
    for (var i = 0; i < 3; i++) {
      var qt = s.queue[i];
      if (qt === undefined) continue;
      tile(ctx, qt, 360 + i * 44, 56, i === 0 ? 17 : 12);
    }
    ctx.textAlign = 'left';
    if (s.queue[0] !== undefined) ctx.fillText(NAMES[s.queue[0]], 345, 92);

    // süre çubuğu
    var frac = Math.max(0, Math.min(1, s.tileTimer / (view.tileTime || 12)));
    ctx.fillStyle = '#33404f';
    ctx.fillRect(40, 124, 400, 10);
    ctx.fillStyle = frac < 0.3 ? '#e0584f' : '#8fd0a0';
    ctx.fillRect(40, 124, 400 * frac, 10);

    // ızgara
    for (var c = 0; c < 25; c++) {
      var x = GX + (c % N) * CS, y = GY + Math.floor(c / N) * CS;
      ctx.fillStyle = (c % 2) ? '#26323f' : '#2b3846';
      ctx.fillRect(x, y, CS, CS);
      if (s.board[c] >= 0) tile(ctx, s.board[c], x + CS / 2, y + CS / 2, 28);
    }
    // imleç + gölge önizleme
    var cx = GX + (s.cursor % N) * CS, cy = GY + Math.floor(s.cursor / N) * CS;
    if (s.status === 'playing' && s.board[s.cursor] < 0 && s.queue[0] !== undefined) {
      ctx.globalAlpha = 0.45;
      tile(ctx, s.queue[0], cx + CS / 2, cy + CS / 2, 28);
      ctx.globalAlpha = 1;
      if (view.preview !== undefined) {
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 14px system-ui, sans-serif';
        ctx.fillText((view.preview >= 0 ? '+' : '') + view.preview, cx + CS / 2, cy + CS - 6);
      }
    }
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.strokeRect(cx + 2, cy + 2, CS - 4, CS - 4);

    // yerleştirme geri bildirimi
    if (s.flash > 0 && s.lastIdx >= 0) {
      var fx = GX + (s.lastIdx % N) * CS, fy = GY + Math.floor(s.lastIdx / N) * CS;
      ctx.globalAlpha = Math.min(1, s.flash * 3);
      ctx.fillStyle = s.lastGain > 0 ? '#9be3a8' : '#e0584f';
      ctx.fillRect(fx, fy, CS, CS);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillText(s.msg || ((s.lastGain >= 0 ? '+' : '') + s.lastGain), fx + CS / 2, fy + CS / 2 - 20 * (0.35 - s.flash) / 0.35);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#aab6c4';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('Komşu başına: Tarla+Kuyu +4 · Tarla+Kovan +3 · Kuyu+Kovan -2 · aynı tür -1', 240, 580);
    ctx.fillText('Her yerleşim +1 taban puan' + (view.muted ? '   (ses kapalı)' : ''), 240, 600);

    if (s.status !== 'playing') {
      ctx.fillStyle = 'rgba(10,14,20,0.82)';
      ctx.fillRect(40, 250, 400, 170);
      ctx.fillStyle = s.status === 'won' ? '#9be3a8' : '#ff8a80';
      ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.fillText(s.status === 'won' ? 'Bahçe tamam!' : 'Bitti', 240, 292);
      ctx.fillStyle = '#e8eef5';
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText(s.status === 'won' ? ('Tüm kareler doldu. Puan: ' + s.score) : s.overReason, 240, 326);
      ctx.fillText('Puan: ' + s.score + '   Rekor: ' + (view.best || 0), 240, 356);
      ctx.fillText('Yeniden başlamak için R / boşluk / tıkla', 240, 394);
    }
  }

  var api = { draw: draw, cellAt: cellAt };
  if (typeof module !== 'undefined') module.exports = api;
  if (typeof window !== 'undefined') window.GameRender = api;
})();

</script>
<script>
// Komşu Bahçe — döngü, girdi, ses.
(function () {
  'use strict';
  var DT = 1 / 60;
  var MAP = {
    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
    ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
    ' ': 'action', Enter: 'action', r: 'restart', R: 'restart'
  };

  function bootstrap() {
    var L = window.GameLogic, R = window.GameRender;
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var state = L.createState((Date.now() & 0xffffff) || 1);
    var input = { left: false, right: false, up: false, down: false, action: false, restart: false, cell: -1 };
    var latch = {};
    var best = 0, muted = false, audio = null, lastSeq = 0, acc = 0, last = 0;
    try { best = parseInt(window.localStorage.getItem('komsubahce-best'), 10) || 0; } catch (err) { best = 0; }

    function initAudio() {
      if (audio) return;
      try { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); } catch (err) { audio = null; }
    }
    function tone(f, d, type) {
      if (!audio || muted) return;
      try {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = type || 'square'; o.frequency.value = f;
        g.gain.value = 0.06;
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + d);
      } catch (err) { /* sessiz devam */ }
    }
    function saveBest() {
      if (state.score > best) {
        best = state.score;
        try { window.localStorage.setItem('komsubahce-best', String(best)); } catch (err) { /* kayıt yok */ }
      }
    }
    function sfx() {
      if (state.eventSeq === lastSeq) return;
      lastSeq = state.eventSeq;
      if (state.event === 'place') tone(440 + Math.max(0, state.lastGain) * 60, 0.1);
      else if (state.event === 'bad') tone(140, 0.15, 'sawtooth');
      else if (state.event === 'over') { tone(110, 0.3, 'sawtooth'); saveBest(); }
      else if (state.event === 'won') { tone(660, 0.12); tone(880, 0.25); saveBest(); }
    }

    window.addEventListener('keydown', function (e) {
      initAudio();
      if (e.key === 'm' || e.key === 'M') { muted = !muted; return; }
      var k = MAP[e.key];
      if (!k) return;
      if (e.preventDefault) e.preventDefault();
      input[k] = true; latch[k] = true;
    });
    window.addEventListener('keyup', function (e) {
      var k = MAP[e.key];
      if (k) input[k] = false;
    });
    if (canvas.addEventListener) {
      canvas.addEventListener('pointerdown', function (e) {
        initAudio();
        if (state.status !== 'playing') { latch.restart = true; return; }
        var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: 480, height: 640 };
        var x = (e.clientX - r.left) * (480 / (r.width || 480)), y = (e.clientY - r.top) * (640 / (r.height || 640));
        var c = R.cellAt(x, y);
        if (c >= 0) latch.cell = c;
      });
    }

    function frame(now) {
      var ms = now || 0;
      acc += Math.min(0.25, Math.max(0, (ms - last) / 1000));
      last = ms;
      var steps = 0, first = true;
      while (acc >= DT && steps < 5) {
        var inp = {
          left: input.left || !!latch.left, right: input.right || !!latch.right,
          up: input.up || !!latch.up, down: input.down || !!latch.down,
          action: input.action || !!latch.action, restart: input.restart || !!latch.restart,
          cell: first && typeof latch.cell === 'number' ? latch.cell : -1
        };
        if (first) latch = {};
        first = false;
        L.step(state, inp, DT);
        acc -= DT; steps++;
      }
      if (steps === 5) acc = 0;
      if (state.score > best && state.status === 'playing') { /* rekor sadece bitişte kaydedilir */ }
      sfx();
      var view = { best: Math.max(best, state.score), muted: muted, quota: L.QUOTA, tileTime: L.TILE_TIME };
      if (state.board[state.cursor] < 0 && state.queue.length) view.preview = L.gainAt(state.board, state.cursor, state.queue[0]);
      R.draw(ctx, state, view);
      window.requestAnimationFrame(frame);
    }
    window.requestAnimationFrame(frame);
    return { getState: function () { return state; } };
  }

  if (typeof window !== 'undefined') {
    window.GameMain = { bootstrap: bootstrap };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap); else bootstrap();
  }
  if (typeof module !== 'undefined') module.exports = { bootstrap: bootstrap };
})();

</script>
</body>
</html>
