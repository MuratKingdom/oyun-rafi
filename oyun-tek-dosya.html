<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bopgate</title>
<style>
  :root {
    --font: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
    --cyan: #5ac8fa; --mor: #b39dfa; --altin: #ffd166; --turuncu: #ff9f43; --pembe: #ff5d7a; --yesil: #46d39a;
    --metin: #e8ecf1; --soluk: #8fa3c4;
    --cam: rgba(16,24,44,0.86); --cizgi: rgba(90,200,250,0.35);
  }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(120% 80% at 50% 0%, #121c36 0%, #05070c 60%) #05070c;
    color: var(--metin);
    font-family: var(--font);
    height: 100%;
    overflow: hidden;
    /* Dokunurken kaydırma, yakınlaştırma, metin seçme ve uzun-basma menüsü olmasın */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas {
    display: block;
    background: #0b1220;
    border: 1px solid var(--cizgi);
    border-radius: 14px;
    box-shadow: 0 0 28px rgba(90,200,250,0.16), inset 0 0 0 1px rgba(255,255,255,0.03);
    /* Mantıksal alan 520 x --h (main.js ayarlar: 540–1000). Oranı koruyarak ekrana sığ;
       uzun telefonda alan da uzadığı için üstte/altta boşluk kalmaz. */
    --h: 540;
    width: min(98vw, 760px, calc((100dvh - 76px) * 520 / var(--h)));
    aspect-ratio: 520 / var(--h);
    height: auto;
  }
  @supports not (height: 100dvh) {
    canvas { width: min(98vw, 760px, calc((100vh - 76px) * 520 / var(--h))); }
  }
  #hint {
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: #61708d;
    text-align: center;
    max-width: 500px;
    padding: 0 8px;
  }
  .dugmeler { display: flex; gap: 8px; justify-content: center; min-height: 0; padding: 0 8px; box-sizing: border-box; max-width: 100%; }
  .dugmeler button { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform 0.08s ease; }
  .dugmeler button:active { transform: scale(0.95); }
  #magazaBtn {
    font: 800 15px var(--font); letter-spacing: 0.02em;
    color: #1a1206; background: linear-gradient(180deg, #ffe08a, var(--turuncu)); border: 0; border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
    box-shadow: 0 0 18px rgba(255,159,67,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  #gorevBtn {
    font: 800 15px var(--font); letter-spacing: 0.02em;
    color: var(--metin); background: var(--cam); border: 1px solid var(--cizgi); border-radius: 999px;
    padding: 10px 18px; cursor: pointer; box-shadow: 0 0 14px rgba(90,200,250,0.18);
  }
  #gorevBtn[hidden], #liderBtn[hidden] { display: none; }
  #muzikBtn, #sesBtn, #dilBtn, #liderBtn {
    font: inherit; font-size: 18px; width: 44px; height: 44px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(143,163,196,0.35); background: var(--cam); color: var(--metin); cursor: pointer;
  }
  #dilBtn { font: 900 13px var(--font); letter-spacing: 0.04em; }
  #muzikBtn.kapali { opacity: 0.45; text-decoration: line-through; }
  #devamBtn {
    font: 900 15px var(--font); color: #fff; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ff8aa0, #e0405e);
    box-shadow: 0 0 20px rgba(255,93,122,0.55), inset 0 1px 0 rgba(255,255,255,0.4);
    padding: 10px 20px; cursor: pointer; animation: nabiz 1s ease-in-out infinite;
  }
  #devamBtn[hidden], #reklamDevamBtn[hidden], #ikiKatBtn[hidden] { display: none; }
  #reklamDevamBtn, #ikiKatBtn {
    font: 900 15px var(--font); color: #05070c; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    background: linear-gradient(180deg, #a6ecff, var(--cyan)); box-shadow: 0 0 18px rgba(90,200,250,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  #ikiKatBtn { color: #1a1206; background: linear-gradient(180deg, #ffe08a, var(--turuncu)); box-shadow: 0 0 18px rgba(255,159,67,0.5); animation: nabiz 1.2s ease-in-out infinite; }
  @keyframes nabiz { 50% { transform: scale(1.06); } }

  /* --- Mağaza ve görevler paneli --- */
  #magaza {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(3,5,10,0.78);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
  }
  #magaza[hidden], #magazaBtn[hidden] { display: none; }
  #magaza .panel {
    width: min(440px, 100%); max-height: 100%;
    display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(180deg, rgba(24,34,60,0.97), rgba(10,14,26,0.97));
    border: 1px solid var(--cizgi); border-radius: 22px; padding: 16px;
    box-shadow: 0 0 34px rgba(90,200,250,0.22), inset 0 1px 0 rgba(255,255,255,0.06);
    box-sizing: border-box;
  }
  #magaza header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #magaza h2 {
    margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--mor)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #magaza .cuzdan {
    color: var(--altin); font-weight: 900; font-size: 17px; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,209,102,0.12); border: 1px solid rgba(255,209,102,0.45);
  }
  #magaza .kapat {
    font: 800 14px var(--font); color: var(--metin); background: rgba(255,255,255,0.06);
    border: 1px solid rgba(143,163,196,0.35); border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  #magaza .sekmeler {
    display: grid; grid-template-columns: repeat(4, 1fr) 0.7fr; gap: 4px; padding: 4px;
    background: rgba(0,0,0,0.3); border-radius: 14px;
  }
  #magaza [data-sekme] {
    font: 800 14px var(--font); color: var(--soluk); background: transparent; border: 0;
    border-radius: 10px; padding: 9px 4px; cursor: pointer;
  }
  #magaza [data-sekme][aria-selected="true"] {
    color: #05070c; background: linear-gradient(180deg, #8fe0ff, var(--cyan));
    box-shadow: 0 0 14px rgba(90,200,250,0.5);
  }
  #magaza .liste { overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 2px; }
  #magaza .urun {
    display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(143,163,196,0.18); border-radius: 16px; padding: 10px;
  }
  #magaza .urun:has(.kusanildi) { border-color: rgba(90,200,250,0.6); box-shadow: 0 0 14px rgba(90,200,250,0.2); }
  #magaza .onizleme { width: 76px; height: 55px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  #magaza .ad { font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
  @media (max-width: 400px) {
    #magaza .panel { padding: 12px; }
    #magaza .urun { grid-template-columns: 60px minmax(0, 1fr) auto; gap: 9px; padding: 8px; }
    #magaza .onizleme { width: 60px; height: 44px; }
    #magaza .guc .basamak { width: 60px; letter-spacing: 1px; }
    #magaza .urun button { min-width: 80px; font-size: 13px; padding: 0 10px; }
    #magaza .ad { font-size: 15px; }
  }
  #magaza .urun button {
    font: 900 14px var(--font); min-width: 96px; min-height: 42px;
    border-radius: 999px; border: 0; cursor: pointer; color: #05070c;
    background: linear-gradient(180deg, #8fe0ff, var(--cyan));
  }
  #magaza .urun button.al {
    color: #1a1206; background: linear-gradient(180deg, #ffe08a, var(--turuncu));
    box-shadow: 0 0 12px rgba(255,159,67,0.35);
  }
  #magaza .urun button.kusanildi {
    background: transparent; color: var(--cyan); border: 1px solid rgba(90,200,250,0.5); cursor: default; box-shadow: none;
  }
  #magaza .urun button:disabled.al { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
  #magaza .not { font-size: 12px; color: var(--soluk); margin: 0; line-height: 1.4; }
  #magaza .urun button.para {
    color: #fff; background: linear-gradient(180deg, #c58bff, #7a4dff); box-shadow: 0 0 14px rgba(150,100,255,0.45);
  }
  #magaza .urun button.para:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; }
  #magaza .urun.premium { border-color: rgba(197,139,255,0.45); }
  #magaza .paket { grid-template-columns: 44px minmax(0, 1fr) auto; }
  #magaza .paket .paket-ikon { font-size: 30px; text-align: center; filter: drop-shadow(0 0 8px rgba(197,139,255,0.6)); }
  #magaza .paket .etki { display: block; font-size: 12.5px; color: var(--soluk); margin-top: 3px; font-weight: 500; }
  #magaza .paket.en-iyi { border-color: rgba(255,209,102,0.7); box-shadow: 0 0 16px rgba(255,209,102,0.25); }
  #magaza .geri-yukle {
    font: 800 13px var(--font); color: var(--soluk); background: transparent; border: 1px solid rgba(143,163,196,0.35);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; align-self: center;
  }
  #magaza .guc .basamak { width: 76px; text-align: center; color: var(--altin); font-size: 18px; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,209,102,0.6); }
  #magaza .guc .etki { display: block; font-size: 12.5px; color: var(--soluk); margin-top: 3px; font-weight: 500; }
  #magaza .seri {
    margin: 0; padding: 10px 12px; border-radius: 14px; color: var(--altin); font-weight: 800; font-size: 14px;
    background: rgba(255,209,102,0.08); border: 1px solid rgba(255,209,102,0.3);
  }
  #magaza .gorev {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 10px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(143,163,196,0.18); border-radius: 16px; padding: 12px 14px;
  }
  #magaza .gorev .ad { font-size: 15px; }
  #magaza .gorev .odul { color: var(--altin); font-size: 13px; font-weight: 800; white-space: nowrap; }
  #magaza .gorev .cubuk { grid-column: 1 / -1; height: 8px; background: rgba(0,0,0,0.35); border-radius: 4px; overflow: hidden; }
  #magaza .gorev .cubuk i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--mor)); border-radius: 4px; box-shadow: 0 0 8px rgba(90,200,250,0.6); }
  #magaza .gorev.bitti { border-color: rgba(70,211,154,0.5); }
  #magaza .gorev.bitti .cubuk i { background: var(--yesil); box-shadow: 0 0 8px rgba(70,211,154,0.6); }
  #magaza .gorev.bitti .ad { color: var(--yesil); }
  @media (prefers-reduced-motion: reduce) { #devamBtn { animation: none; } .dugmeler button { transition: none; } }
  @media (pointer: coarse) {
    #hint .kb { display: none; }
  }
  /* Dar telefon: dört düğme tek satıra sığsın (ayrıntılı kurallardan sonra gelmeli) */
  @media (max-width: 440px) {
    .dugmeler { gap: 5px; padding: 0 6px; }
    #magazaBtn, #gorevBtn { padding: 8px 10px; font-size: 12.5px; }
    #muzikBtn, #sesBtn, #dilBtn, #liderBtn { width: 34px; height: 34px; font-size: 15px; }
    #dilBtn { font-size: 11px; }
  }
  @media (max-width: 380px) {
    #magazaBtn, #gorevBtn { padding: 7px 8px; font-size: 12px; }
    #muzikBtn, #sesBtn, #dilBtn, #liderBtn { width: 31px; height: 31px; font-size: 14px; }
  }
  @media (max-width: 340px) {
    .dugmeler { gap: 3px; padding: 0 3px; }
    #magazaBtn, #gorevBtn { padding: 6px 7px; font-size: 11px; letter-spacing: 0; }
    #muzikBtn, #sesBtn, #dilBtn, #liderBtn { width: 27px; height: 27px; font-size: 12px; }
    #dilBtn { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="540"></canvas>
  <div id="hint"><span data-i18n="Ekranın herhangi bir yerine basılı tut: yükseklik kazan">Ekranın herhangi bir yerine basılı tut: yükseklik kazan</span><span class="kb" data-i18n=" · Boşluk / ↑ · R: yeniden · M: ses · P: duraklat"> · Boşluk / ↑ · R: yeniden · M: ses · P: duraklat</span></div>
  <div class="dugmeler"><button id="devamBtn" type="button" data-ui hidden>❤ Devam</button><button id="reklamDevamBtn" type="button" data-ui hidden>📺 Reklamla devam</button><button id="ikiKatBtn" type="button" data-ui hidden>📺 ★ x2</button><button id="magazaBtn" type="button" data-ui hidden data-i18n="🛒 Mağaza">🛒 Mağaza</button><button id="gorevBtn" type="button" data-ui hidden>📋 Görevler</button><button id="liderBtn" class="ikon" type="button" data-ui hidden aria-label="Liderlik tablosu" data-i18n-aria="Liderlik tablosu">🏆</button><button id="muzikBtn" class="ikon" type="button" data-ui aria-label="Müzik" data-i18n-aria="Müzik">🎵</button><button id="sesBtn" class="ikon" type="button" data-ui aria-label="Efekt sesleri" data-i18n-aria="Efekt sesleri">🔊</button><button id="dilBtn" class="ikon" type="button" data-ui aria-label="Dil" data-i18n-aria="Dil">TR</button></div>
</div>
<div id="magaza" data-ui hidden role="dialog" aria-label="Mağaza">
  <div class="panel">
    <header><h2 data-i18n="Mağaza">Mağaza</h2><span class="cuzdan">★ 0</span><button class="kapat" type="button" data-i18n="Kapat">Kapat</button></header>
    <div class="sekmeler" role="tablist">
      <button type="button" role="tab" data-sekme="ball" aria-selected="true" data-i18n="Top">Top</button>
      <button type="button" role="tab" data-sekme="map" aria-selected="false" data-i18n="Harita">Harita</button>
      <button type="button" role="tab" data-sekme="upg" aria-selected="false" data-i18n="Güç">Güç</button>
      <button type="button" role="tab" data-sekme="quests" aria-selected="false" data-i18n="Görevler">Görevler</button>
      <button type="button" role="tab" data-sekme="premium" aria-selected="false">💎</button>
    </div>
    <div class="liste"></div>
    <p class="not" data-i18n="Yıldız kazanmak için: oyunda yıldız topla, günlük görevleri bitir, her 10 bölümlük eşik +5.">Yıldız kazanmak için: oyunda yıldız topla, günlük görevleri bitir, her 10 bölümlük eşik +5.</p>
  </div>
</div>
<script>

//
// Kaynak dil Türkçedir: kod metinleri Türkçe yazar ve L('Türkçe metin', { parametre }) ile gösterir.
// İngilizce seçiliyse EN sözlüğünde Türkçe metnin karşılığı aranır; yoksa Türkçe metin kalır
// (eksik çeviri oyunu bozmaz, testler sözlüğün eksiksiz olduğunu ayrıca denetler: T39).
// Parametreler {ad} biçimindedir: L('Bölüm {n}', { n: 3 }) → "Bölüm 3" / "Level 3".
// Dil seçimi: kayıtlı tercih ('bopgate-dil') yoksa cihaz dili; Türkçe değilse İngilizce.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; dosya kendi kapsamında çalışır.
(function () {

var STORAGE_KEY = 'bopgate-dil';
var LANGS = ['tr', 'en'];

var EN = {

<script>
// Sekme Gücü — saf oyun mantığı (DOM/canvas/window kullanılmaz)
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

var CANVAS_W = 520;
var CANVAS_H = 540;
var BALL_X = 160;
var BALL_R = 12;
var FLOOR_Y = 480;
var CEIL_Y = 30;
var GRAVITY = 900;
var THRUST = -700;
var BOUNCE_V = -480;
var MAX_VY = 900;
var SPEED0 = 200;
var SPEED_MAX = 340;
var GAP_H0 = 170;
var GAP_MIN = 120;
// Zorluk eğrisi: doğrusal değil, doygunluğa giden üstel yaklaşım.
// İlk dakikada hızlı sertleşir, sonra yavaşlar ve bir tavanda durur;
// böylece uzun koşular adil kalır, "sonsuz hızlanma" ile zorla bitmez.
var DIFF_TAU = 75;
var WALL_W = 28;
var SPAWN_GRACE = 2.2;
var SPAWN_INTERVAL_MIN = 1.3;
var SPAWN_INTERVAL_MAX = 1.9;
var SPAWN_RAMP = 0.01;

function nextRand(state) {
  state.rngA = (state.rngA + 0x6D2B79F5) | 0;
  var t = state.rngA;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// 0 (başlangıç) → 1 (tavan) arasında, t saniyede.
function difficulty(t) {
  return 1 - Math.exp(-t / DIFF_TAU);
}

// Sonsuz bölge ilerlemesi: ilk eşiğe kadar 0, sonra ENDLESS_LEVELS bölümde 1'e çıkar
function endless(level) {
  return Math.max(0, Math.min(1, ((level || 1) - LEVEL_COUNT) / ENDLESS_LEVELS));
}

// --- Bölümler ---------------------------------------------------------------
// Her bölüm GATES_PER_LEVEL kapıdır. Oyun sonsuzdur: bitiş yok, yalnız ölünce biter.
// Her LEVEL_COUNT bölümde bir eşik geçilir (state.milestones; ödülde bonus).
// Eşik sonrası (sonsuz bölge) zorluk ENDLESS_LEVELS bölüm boyunca yavaşça bir tavana çıkar:
// hız +ENDLESS_SPEED, kapı en dar GAP_MIN - ENDLESS_GAP, doğma aralığı ENDLESS_SPAWN_MIN'e iner.
// Tavanda bile her dizilim geçilebilir kalır (MAX_JUMP, bot ölçümü: README).
// Yeni öğeler bölümle açılır:
//   2+  yıldız: kapının ortasında durur; toplanınca bir kalkan verir (en çok 1)
//   3+  hareketli kapı: boşluk yukarı-aşağı salınır, genliği bölümle büyür
//   4+  nefes alan kapı: ağız ortası sabit kalır, boyu daralıp genişler (hareketliyle birleşmez)
//   5+  güç: kapının ortasında yıldız yerine çıkabilir —
//         ⏱ yavaşlatma (dünya POWER_SLOW_F hızında akar) ya da küçülme (top yarıçapı POWER_SMALL_F)
//   6+  çift duvar: art arda iki duvar, boşlukları birbirine kaydırılmış
//   7+  zemin dikeni: duvarın hemen ardında zeminde dikenli şerit; üstüne sekmek öldürür,
//       basılı tutup havada kalarak geçilir
// Kalkan, bir duvar ya da diken çarpmasını yutar (tavanı değil).
var LEVEL_COUNT = 10; // eşik uzunluğu (bölüm)
var ENDLESS_LEVELS = 20;
var ENDLESS_SPEED = 40;
var ENDLESS_GAP = 15;
var ENDLESS_SPAWN_MIN = 1.15;
var GATES_PER_LEVEL = 8;
var STAR_FROM = 2;
var MOVE_FROM = 3;
var DOUBLE_FROM = 6;
var PULSE_FROM = 4;
var POWER_FROM = 5;
var SPIKE_FROM = 7;
var POWER_SLOW_F = 0.65;
var POWER_SLOW_T = 4;
var POWER_SMALL_F = 0.6;
var POWER_SMALL_T = 6;
var PULSE_MIN = 0.72; // nefes alan kapı en dar halinde normal boyun bu oranı
var SPIKE_DX = 30;    // duvarın arka kenarından şeridin başına
var SPIKE_W = 70;
var STAR_R = 9;
var MAX_SHIELD = 1;
var DOUBLE_DX = 96;
var DOUBLE_SHIFT = 46;
var MARGIN = 40;
// Art arda iki kapının ağız üstü arasındaki en büyük fark. Top yalnızca zeminden
// sekerek yükselir (basılı tutmak düşüşü yavaşlatır, havada tutmaz); alçak bir
// kapıdan hemen sonra çok yüksek bir kapı hızlanan oyunda fiziksel olarak
// yetişilemez olabiliyordu. Bu sınır her dizilimi oynanabilir tutar.
var MAX_JUMP = 150;

// --- Geometri --------------------------------------------------------------
// Oyun alanının mantıksal yüksekliği cihaza göre değişebilir (dikey telefonda uzun).
// Genişlik ve zaman sabit kalır; dikey olan her şey (yerçekimi, itiş, sekme hızı,
// kapı boyu, salınım, sıçrama sınırı) alanla aynı oranda (k) ölçeklenir. Böylece
// oyun geometrik olarak aynı kalır: botla ölçülen denge her ekran boyunda geçerli.
var MIN_H = 540;
var MAX_H = 1000;

function makeGeo(height) {
  var H = Math.round(Math.max(MIN_H, Math.min(MAX_H, height || CANVAS_H)));
  var floorY = H - (CANVAS_H - FLOOR_Y);
  return { H: H, ceilY: CEIL_Y, floorY: floorY, k: (floorY - CEIL_Y) / (FLOOR_Y - CEIL_Y) };
}

// opts.height: mantıksal alan yüksekliği (540–1000); verilmezse 540 (klasik kare alan)
// opts.mods: mağazadaki kalıcı güçlendirmeler { maxShield, startShield, powerMul, magnet }
function createState(seed, opts) {
  var g = makeGeo(opts && opts.height);
  var m = (opts && opts.mods) || {};
  var maxShield = typeof m.maxShield === 'number' ? m.maxShield : MAX_SHIELD;
  return {
    maxShield: maxShield,
    powerMul: m.powerMul || 1,
    magnet: m.magnet || 1,
    revives: 0,
    geo: g,
    rngA: (seed || 1) >>> 0,
    y: g.floorY - BALL_R - 60 * g.k,
    vy: 0,
    t: 0,
    speed: SPEED0,
    gapH: GAP_H0 * g.k,
    lastGapY: -1,
    spawnTimer: SPAWN_GRACE,
    obstacles: [],
    bounces: 0,
    score: 0,
    level: 1,
    stars: 0,
    shield: Math.min(maxShield, m.startShield || 0),
    shieldUsed: 0,
    movingPassed: 0,
    milestones: 0,
    slowT: 0,
    smallT: 0,
    powers: 0,
    spikesPassed: 0,
    distance: 0,
    status: 'playing',
    overReason: ''
  };
}

function clampGapY(g, gapY, gapH) {
  var minTop = g.ceilY + MARGIN * g.k;
  var maxTop = g.floorY - MARGIN * g.k - gapH;
  if (maxTop < minTop) maxTop = minTop;
  return Math.max(minTop, Math.min(maxTop, gapY));
}

function makeWall(state, x, baseY, gapH) {
  var lv = state.level;
  var w = { x: x, baseY: baseY, gapY: baseY, gapH: gapH, baseH: gapH, passed: false, hit: false,
    move: null, star: null, pulse: null, power: null, spike: null };
  if (lv >= MOVE_FROM && nextRand(state) < Math.min(0.7, 0.18 * (lv - MOVE_FROM + 1))) {
    w.move = {
      amp: Math.min(48, 22 + 4 * (lv - MOVE_FROM)) * state.geo.k,
      freq: 0.9 + nextRand(state) * 0.8,
      phase: nextRand(state) * Math.PI * 2
    };
  }
  if (!w.move && lv >= PULSE_FROM && nextRand(state) < Math.min(0.45, 0.15 * (lv - PULSE_FROM + 1))) {
    w.pulse = { freq: 1.6 + nextRand(state) * 0.8, phase: nextRand(state) * Math.PI * 2 };
  }
  if (lv >= POWER_FROM && nextRand(state) < 0.16) {
    w.power = { kind: nextRand(state) < 0.5 ? 'slow' : 'small', taken: false };
  } else if (lv >= STAR_FROM && nextRand(state) < 0.4) {
    w.star = { taken: false };
  }
  if (lv >= SPIKE_FROM && nextRand(state) < Math.min(0.4, 0.2 + 0.07 * (lv - SPIKE_FROM))) {
    w.spike = { dx: SPIKE_DX, w: SPIKE_W, hit: false, passed: false };
  }
  return w;
}

function spawn(state) {
  var g = state.geo;
  var gapH = state.gapH;
  var minTop = g.ceilY + MARGIN * g.k;
  var maxTop = g.floorY - MARGIN * g.k - gapH;
  var span = Math.max(10, maxTop - minTop);
  var gapY = minTop + nextRand(state) * span;
  if (state.lastGapY >= 0) {
    var jump = MAX_JUMP * g.k;
    gapY = Math.max(state.lastGapY - jump, Math.min(state.lastGapY + jump, gapY));
  }
  gapY = clampGapY(g, gapY, gapH);
  state.obstacles.push(makeWall(state, CANVAS_W + WALL_W, gapY, gapH));
  state.lastGapY = gapY;
  if (state.level >= DOUBLE_FROM && nextRand(state) < 0.3) {
    var shift = (nextRand(state) < 0.5 ? -1 : 1) * DOUBLE_SHIFT * g.k;
    var second = makeWall(state, CANVAS_W + WALL_W + DOUBLE_DX, clampGapY(g, gapY + shift, gapH), gapH);
    second.move = null; // çift duvarın ikincisi sabit: iki hareketli üst üste adil değil
    second.pulse = null;
    second.spike = null; // iki duvarın arasına diken koyma: yer yok
    if (state.obstacles[state.obstacles.length - 1].spike) state.obstacles[state.obstacles.length - 1].spike = null;
    state.obstacles.push(second);
    state.lastGapY = second.gapY;
    return DOUBLE_DX / state.speed; // sonraki duvar ikinci parçaya normal aralıkla gelsin
  }
  return 0;
}

// Topun anlık yarıçapı (küçülme gücü açıkken daha küçük)
function radius(state) {
  return state.smallT > 0 ? BALL_R * POWER_SMALL_F : BALL_R;
}

// Engelin altındaki diken şeridi topun x'ini örtüyor mu
function spikeUnderBall(o, r) {
  if (!o.spike || o.spike.hit) return false;
  var x0 = o.x + WALL_W + o.spike.dx;
  return x0 < BALL_X + r && x0 + o.spike.w > BALL_X - r;
}

function step(state, input, dt) {
  if (state.status !== 'playing') return state;

  var g = state.geo || (state.geo = makeGeo(CANVAS_H));
  if (state.slowT > 0) state.slowT = Math.max(0, state.slowT - dt);
  if (state.smallT > 0) state.smallT = Math.max(0, state.smallT - dt);
  var r = radius(state);
  // Yavaşlatma yalnız dünyayı (duvarların kayması, doğma sıklığı) etkiler; topun
  // düşüşü aynı kalır ki kontrol hissi değişmesin.
  var wf = state.slowT > 0 ? POWER_SLOW_F : 1;
  var accel = GRAVITY * g.k;
  if (input.action) accel += THRUST * g.k;
  state.vy += accel * dt;
  var maxVy = MAX_VY * g.k;
  if (state.vy > maxVy) state.vy = maxVy;
  if (state.vy < -maxVy) state.vy = -maxVy;
  state.y += state.vy * dt;

  if (state.y + r >= g.floorY) {
    state.y = g.floorY - r;
    state.vy = BOUNCE_V * g.k;
    state.bounces++;
    for (var si = 0; si < state.obstacles.length; si++) {
      var so = state.obstacles[si];
      if (!spikeUnderBall(so, r)) continue;
      if (state.shield > 0) {
        state.shield--;
        state.shieldUsed++;
        so.spike.hit = true;
      } else {
        state.status = 'over';
        state.overReason = 'Dikene düştün';
        return state;
      }
    }
  }

  if (state.y - r <= g.ceilY) {
    state.status = 'over';
    state.overReason = 'Tavana çarptın';
    return state;
  }

  state.t += dt;
  var d = difficulty(state.t);
  var e = endless(state.level);
  state.speed = SPEED0 + (SPEED_MAX + ENDLESS_SPEED * e - SPEED0) * d;
  state.gapH = (GAP_H0 - (GAP_H0 - (GAP_MIN - ENDLESS_GAP * e)) * d) * g.k;

  state.spawnTimer -= dt * wf;
  if (state.spawnTimer <= 0) {
    var extra = spawn(state);
    var interval = SPAWN_INTERVAL_MAX - state.t * SPAWN_RAMP;
    var imin = SPAWN_INTERVAL_MIN - (SPAWN_INTERVAL_MIN - ENDLESS_SPAWN_MIN) * e;
    if (interval < imin) interval = imin;
    state.spawnTimer = interval + extra;
  }

  for (var i = 0; i < state.obstacles.length; i++) {
    var o = state.obstacles[i];
    o.x -= state.speed * wf * dt;
    if (o.move) {
      o.gapY = clampGapY(g, o.baseY + o.move.amp * Math.sin(o.move.phase + state.t * o.move.freq), o.gapH);
    }
    if (o.pulse) {
      // 0..1 arası nefes; ağız ortası sabit
      var b = 0.5 + 0.5 * Math.sin(o.pulse.phase + state.t * o.pulse.freq);
      var bh = o.baseH || o.gapH;
      o.gapH = bh * (PULSE_MIN + (1 - PULSE_MIN) * b);
      o.gapY = o.baseY + (bh - o.gapH) / 2;
    }

    // Yıldız: kapının ortasında
    if (o.star && !o.star.taken) {
      var sx = o.x + WALL_W / 2;
      var sy = o.gapY + o.gapH / 2;
      var pr = r + STAR_R * (state.magnet || 1);
      if (Math.abs(sx - BALL_X) < pr && Math.abs(sy - state.y) < pr) {
        o.star.taken = true;
        state.stars++;
        var cap = typeof state.maxShield === 'number' ? state.maxShield : MAX_SHIELD;
        if (state.shield < cap) state.shield++;
      }
    }
    // Güç: yıldızla aynı yerde; alınınca süresi (yeniden) başlar
    if (o.power && !o.power.taken) {
      var px = o.x + WALL_W / 2;
      var py = o.gapY + o.gapH / 2;
      var pr2 = r + STAR_R * (state.magnet || 1);
      if (Math.abs(px - BALL_X) < pr2 && Math.abs(py - state.y) < pr2) {
        o.power.taken = true;
        state.powers++;
        if (o.power.kind === 'slow') state.slowT = POWER_SLOW_T * (state.powerMul || 1);
        else state.smallT = POWER_SMALL_T * (state.powerMul || 1);
      }
    }
    if (o.spike && !o.spike.passed && o.x + WALL_W + o.spike.dx + o.spike.w < BALL_X - r) {
      o.spike.passed = true;
      if (!o.spike.hit) state.spikesPassed++;
    }

    if (!o.passed && o.x + WALL_W < BALL_X) {
      o.passed = true;
      state.score++;
      if (o.move) state.movingPassed++;
      if (state.score % GATES_PER_LEVEL === 0) {
        if (state.level % LEVEL_COUNT === 0) state.milestones++;
        state.level++;
      }
    }
    if (!o.hit && o.x < BALL_X + r && o.x + WALL_W > BALL_X - r) {
      if (state.y - r < o.gapY || state.y + r > o.gapY + o.gapH) {
        if (state.shield > 0) {
          state.shield--;
          state.shieldUsed++;
          o.hit = true; // kalkan bu duvarı deler; aynı duvar ikinci kez öldürmez
        } else {
          state.status = 'over';
          state.overReason = 'Duvara çarptın';
          return state;
        }
      }
    }
  }
  var kept = [];
  for (var j = 0; j < state.obstacles.length; j++) {
    var oj = state.obstacles[j];
    var tail = oj.spike ? WALL_W + oj.spike.dx + oj.spike.w : WALL_W;
    if (oj.x + tail > -10) kept.push(oj);
  }
  state.obstacles = kept;

  state.distance += state.speed * wf * dt;
  return state;
}

// Ölünce devam (yıldızla ödenir, ödemeyi main.js/shop.js yapar): top ortaya alınır,
// önündeki REVIVE_CLEAR px içindeki ve altındaki engeller kaldırılır, yeni duvar biraz gecikir.
var REVIVE_CLEAR = 300;
var REVIVE_GRACE = 1.2;
function revive(state) {
  if (state.status !== 'over') return false;
  var g = state.geo || makeGeo(CANVAS_H);
  var kept = [];
  for (var i = 0; i < state.obstacles.length; i++) {
    var o = state.obstacles[i];
    var tail = o.x + WALL_W + (o.spike ? o.spike.dx + o.spike.w : 0);
    if (tail < BALL_X - BALL_R - 4 || o.x > BALL_X + REVIVE_CLEAR) kept.push(o);
  }
  state.obstacles = kept;
  state.y = (g.ceilY + g.floorY) / 2;
  state.vy = 0;
  state.spawnTimer = Math.max(state.spawnTimer, REVIVE_GRACE);
  state.status = 'playing';
  state.overReason = '';
  state.revives = (state.revives || 0) + 1;
  return true;
}

var CONST = {
  CANVAS_W: CANVAS_W, CANVAS_H: CANVAS_H, BALL_X: BALL_X, BALL_R: BALL_R,

<script>
// Sekme Gücü (Bopgate) — gerçek parayla satın alma ve ödüllü reklam (saf mantık + sağlayıcı sarmalayıcı)
//
// Ürünler tek seferliktir (Play'de "yönetilen, tüketilmeyen" ürün). Fiyatı Play Console belirler;
// burada yalnız önerilen fiyat (suggest) ve ürünün verdiği haklar durur.
// Haklar profilde tutulur: p.ent = { noads: bool, products: [ürün kimlikleri] }. Bir ürünün
// hakkı bir kez uygulanır (yıldız hediyesi tekrar verilmez); geri yüklemede eksikler uygulanır.
//
// Sağlayıcı: Android paketinde window.BopgateNative (android-paket/bridge.js) gerçek Play Billing
// ve AdMob'a bağlanır. Tarayıcıda yerel köprü yoktur: satın alma ve reklam kapalıdır (dürüstçe
// "uygulamada" yazar). Testler ve elle deneme için sahte sağlayıcı (mockProvider) vardır;
// tarayıcıda adres çubuğuna ?demo-odeme eklenirse o kullanılır (gerçek para yok).
//
// Ödüllü reklam yerleri: 'devam' (koşu başına 1 bedava devam) ve 'iki_kat' (koşunun yıldızını
// ikiye katlar, günde en çok AD_X2_PER_DAY kez). Reklamsız hakkı olan oyuncu reklam izlemeden
// aynı ödülü alır. Ara reklam ve banner yoktur.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; dosya kendi kapsamında çalışır.
(function () {

var AD_X2_PER_DAY = 5;
var PRODUCT_RE = /^bopgate\.[a-z.]{3,40}$/;

var PRODUCTS = [
  { id: 'bopgate.reklamsiz', name: 'Reklamsız', suggest: '₺49,99',
    desc: 'Reklam izlemeden ödül: bedava devam ve ★ x2 anında', grants: { noads: true } },
  { id: 'bopgate.destekci', name: 'Destekçi paketi', suggest: '₺149,99', best: true,
    desc: 'Reklamsız + Alev topu + Nebula haritası + ★ 1000', grants: { noads: true, items: [['ball', 'alev'], ['map', 'nebula']], coins: 1000 } },
  { id: 'bopgate.ozellik.paket', name: 'Güç paketi', suggest: '₺99,99',
    desc: 'Bütün güçlendirmeler son basamakta', grants: { maxUpgrades: true } },
  { id: 'bopgate.top.alev', name: 'Alev topu', suggest: '₺29,99',
    desc: 'Yalnız satın alınabilen top', grants: { items: [['ball', 'alev']] } },
  { id: 'bopgate.top.kristal', name: 'Kristal topu', suggest: '₺29,99',
    desc: 'Yalnız satın alınabilen top', grants: { items: [['ball', 'kristal']] } },
  { id: 'bopgate.harita.nebula', name: 'Nebula haritası', suggest: '₺39,99',
    desc: 'Yalnız satın alınabilen harita, kendi müziğiyle', grants: { items: [['map', 'nebula']] } }
];

function product(id) {
  for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i];
  return null;
}
function ids() { return PRODUCTS.map(function (p) { return p.id; }); }

function ent(p) {
  if (!p.ent || typeof p.ent !== 'object') p.ent = { noads: false, products: [] };
  if (!Array.isArray(p.ent.products)) p.ent.products = [];
  return p.ent;
}
function owned(p, id) { return ent(p).products.indexOf(id) >= 0; }
function hasNoAds(p) { return !!ent(p).noads; }

// Bir ürünün haklarını profile uygular. Yeni uygulandıysa true; zaten varsa false (hediye tekrar yok).
function grant(Shop, p, id) {
  var pr = product(id);
  if (!pr || owned(p, id)) return false;
  var e = ent(p);
  e.products.push(id);
  var g = pr.grants;
  if (g.noads) e.noads = true;
  (g.items || []).forEach(function (it) {
    if (p.owned[it[0]].indexOf(it[1]) < 0) p.owned[it[0]].push(it[1]);
  });
  if (g.coins) p.coins = Math.min(999999, p.coins + g.coins);
  if (g.maxUpgrades) Shop.UPGRADES.forEach(function (u) { p.upg[u.id] = u.prices.length; });
  return true;
}

// --- Ödüllü reklam günlük sayacı (profilde: p.ads = { day, x2 }) ---------------
function adState(p, day) {
  if (!p.ads || typeof p.ads !== 'object' || p.ads.day !== day) p.ads = { day: day, x2: 0 };
  return p.ads;
}
function x2Left(p, day) { return Math.max(0, AD_X2_PER_DAY - adState(p, day).x2); }
function useX2(p, day) {
  var s = adState(p, day);
  if (s.x2 >= AD_X2_PER_DAY) return false;
  s.x2++;
  return true;
}

// --- Sağlayıcılar --------------------------------------------------------------
// call: köprüyü çağıran fonksiyon. Köprü anında fırlatsa da, reddetse de oyun yedek sonucu alır.
function softly(call, fallback) {
  try {
    return Promise.resolve(call()).then(function (v) { return v == null ? fallback : v; }, function () { return fallback; });
  } catch (e) {
    return Promise.resolve(fallback);
  }
}

// native: window.BopgateNative ya da null. Dönen nesne hiçbir zaman fırlatmaz.
function provider(native) {
  if (!native || !native.iap || !native.ads) {
    return {
      platform: 'web', canBuy: false, canAds: false,
      products: function () { return Promise.resolve([]); },
      buy: function (id) { return Promise.resolve({ ok: false, id: id, reason: 'yok' }); },
      restore: function () { return Promise.resolve([]); },
      rewarded: function () { return Promise.resolve({ rewarded: false }); }
    };
  }
  return {
    platform: native.platform || 'android', canBuy: true, canAds: true,
    products: function (list) { return softly(function () { return native.iap.products(list || ids()); }, []); },
    buy: function (id) { return softly(function () { return native.iap.buy(id); }, { ok: false, id: id, reason: 'hata' }); },
    restore: function () { return softly(function () { return native.iap.restore(); }, []); },
    rewarded: function (placement) { return softly(function () { return native.ads.rewarded(placement); }, { rewarded: false }); }
  };
}

// Testler ve ?demo-odeme için: gerçek para ve reklam yok, her şey anında olur.
// opts: { adResult: true|false, buyResult: true|false, owned: [ids] }
function mockProvider(opts) {
  opts = opts || {};
  var calls = { buy: 0, ads: 0, restore: 0 };
  var bought = (opts.owned || []).slice();
  return {
    platform: 'demo', canBuy: true, canAds: true, calls: calls,
    products: function (list) {
      return Promise.resolve((list || ids()).map(function (id) { var p = product(id); return { id: id, price: p ? p.suggest : '?' }; }));
    },
    buy: function (id) {
      calls.buy++;
      var ok = opts.buyResult !== false && !!product(id);
      if (ok && bought.indexOf(id) < 0) bought.push(id);
      return Promise.resolve(ok ? { ok: true, id: id } : { ok: false, id: id, reason: 'iptal' });
    },
    restore: function () { calls.restore++; return Promise.resolve(bought.slice()); },
    rewarded: function () { calls.ads++; return Promise.resolve({ rewarded: opts.adResult !== false }); }
  };
}

// Reklamsız hakkı varsa reklam gösterilmeden ödül verilir.
function rewardedOrSkip(prov, p, placement) {
  if (hasNoAds(p)) return Promise.resolve({ rewarded: true, skipped: true });
  if (!prov.canAds) return Promise.resolve({ rewarded: false });
  return prov.rewarded(placement);
}

var Monetize = {
  PRODUCTS: PRODUCTS, PRODUCT_RE: PRODUCT_RE, AD_X2_PER_DAY: AD_X2_PER_DAY,
  product: product, ids: ids, ent: ent, owned: owned, hasNoAds: hasNoAds, grant: grant,
  x2Left: x2Left, useX2: useX2, provider: provider, mockProvider: mockProvider, rewardedOrSkip: rewardedOrSkip
};
if (typeof module !== 'undefined') module.exports = Monetize;
if (typeof window !== 'undefined') window.GameMonetize = Monetize;
})();

<script>
// Sekme Gücü (Bopgate) — bulut kayıt birleştirme (saf mantık; DOM yok)
//
// Android'de Play Games kayıtlı oyunu (window.BopgateNative.games.saveGame / loadGame) profili
// cihazlar arasında taşır. İki kayıt (bu cihaz + bulut) çakışırsa hiçbir kazanım kaybolmasın diye
// birleştirilir: sahip olunan görünümler ve satın alma hakları birleşimi, güçlendirme basamakları ve
// rekor en büyüğü, cüzdan en büyüğü (iki cihazda ayrı ayrı biriken yıldız toplanmaz — çift sayım
// olmasın), kuşanılan görünüm bu cihazınki. Bulut verisi her zaman Shop.sanitize'dan geçer.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; dosya kendi kapsamında çalışır.
(function () {

var VERSION = 1;

function pack(profile, best) {
  return JSON.stringify({ v: VERSION, profile: profile, best: best || 0 });
}

// Bozuk / tanınmayan veri → null
function unpack(Shop, text) {
  try {
    var d = JSON.parse(text);
    if (!d || d.v !== VERSION || typeof d.profile !== 'object') return null;
    var best = Math.floor(Number(d.best));
    return { profile: Shop.sanitize(d.profile), best: isFinite(best) && best > 0 ? Math.min(best, 1e6) : 0 };
  } catch (e) {
    return null;
  }
}

function merge(Shop, local, localBest, remote) {
  if (!remote) return { profile: local, best: localBest || 0, changed: false };
  var before = pack(local, localBest);
  var p = Shop.sanitize(JSON.parse(JSON.stringify(local)));
  var r = remote.profile;
  p.coins = Math.max(p.coins, r.coins);
  ['ball', 'map'].forEach(function (k) {
    r.owned[k].forEach(function (id) { if (p.owned[k].indexOf(id) < 0) p.owned[k].push(id); });
  });
  Shop.UPGRADES.forEach(function (u) { p.upg[u.id] = Math.max(p.upg[u.id] || 0, r.upg[u.id] || 0); });
  r.ent.products.forEach(function (id) { if (p.ent.products.indexOf(id) < 0) p.ent.products.push(id); });
  p.ent.noads = p.ent.noads || r.ent.noads;
  // sahip olunan her şey yerleşti; premium kuralları için son bir doğrulama
  p = Shop.sanitize(p);
  var best = Math.max(localBest || 0, remote.best || 0);
  return { profile: p, best: best, changed: pack(p, best) !== before };
}

var Cloud = { VERSION: VERSION, pack: pack, unpack: unpack, merge: merge };
if (typeof module !== 'undefined') module.exports = Cloud;
if (typeof window !== 'undefined') window.GameCloud = Cloud;
})();

</script>
<script>
// Sekme Gücü — günlük görevler ve giriş serisi (saf mantık; DOM yok)
//
// Her gün 3 görev: tarih anahtarından (YYYY-AA-GG) deterministik seçilir, yani aynı gün
// aynı cihazda hep aynı görevler gelir. Tamamlanan görevin ödülü kendiliğinden verilir.
// Giriş serisi: ardışık her gün ilk açılışta 3, 4, 5, 6, 7 (tavan) yıldız; gün atlanırsa sıfırlanır.
// Kayıt ayrı anahtardadır ('sekmeguc-gunluk'); bozuk/eski kayıt güvenle yeniden kurulur.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

// Dil: i18n.js yüklüyse çevirir, değilse Türkçe metni parametreleriyle doldurur
function tx(s, p) {
  var I = typeof window !== 'undefined' && window.GameI18n;
  if (I) return I.L(s, p);
  return String(s).replace(/\{(\w+)\}/g, function (m, k) { return p && p[k] != null ? String(p[k]) : m; });
}

var DAILY_KEY = 'sekmeguc-gunluk';
var QUESTS_PER_DAY = 3;

// kind: run_* tek koşuda, day_* gün boyunca birikir
var TEMPLATES = [
  { kind: 'run_stars', targets: [3, 5, 8], rewards: [5, 6, 8], text: 'Bir koşuda {n} yıldız topla' },
  { kind: 'run_gates', targets: [10, 20, 30], rewards: [4, 6, 8], text: 'Bir koşuda {n} kapı geç' },
  { kind: 'reach_level', targets: [3, 4, 6], rewards: [4, 6, 9], text: '{n}. bölüme ulaş' },
  { kind: 'day_gates', targets: [25, 40, 60], rewards: [4, 6, 8], text: 'Bugün toplam {n} kapı geç' },
  { kind: 'day_runs', targets: [3, 5], rewards: [3, 5], text: 'Bugün {n} oyun oyna' },
  { kind: 'day_shield', targets: [1, 2], rewards: [4, 6], text: 'Kalkanla {n} çarpmadan kurtul' },
  { kind: 'day_moving', targets: [3, 6], rewards: [4, 6], text: '{n} hareketli (mor) kapıdan geç' },
  // 'win' adı eski kayıtlarla uyum için kaldı: oyun sonsuz, görev ilk eşiği (10. bölüm) geçmek
  { kind: 'win', targets: [1], rewards: [15], text: '10. bölümü geç (ilk eşik)' }
];

function pad(n) { return (n < 10 ? '0' : '') + n; }
function dayKey(date) {
  var d = date || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
// İki gün anahtarı arasındaki takvim farkı (gün)
function dayDiff(a, b) {
  function toUtc(k) { var p = k.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  return Math.round((toUtc(b) - toUtc(a)) / 86400000);
}
function validKey(k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); }

function hash(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function describe(q) {
  var tpl = null;
  for (var i = 0; i < TEMPLATES.length; i++) if (TEMPLATES[i].kind === q.kind) tpl = TEMPLATES[i];
  return tpl ? tx(tpl.text, { n: q.target }) : q.kind;
}

// Günün 3 görevi: farklı türlerden, tarihten deterministik
function generate(key) {
  var h = hash('sekmeguc:' + key);
  var pool = TEMPLATES.slice();
  var out = [];
  while (out.length < QUESTS_PER_DAY && pool.length) {
    h = (Math.imul(h, 1103515245) + 12345) >>> 0;
    var tpl = pool.splice(h % pool.length, 1)[0];
    h = (Math.imul(h, 1103515245) + 12345) >>> 0;
    var ti = h % tpl.targets.length;
    out.push({ kind: tpl.kind, target: tpl.targets[ti], reward: tpl.rewards[ti], progress: 0, done: false });
  }
  return out;
}

function fresh() {
  return { day: '', streak: 0, lastLogin: '', quests: [] };
}

function sanitize(raw) {
  var d = fresh();
  if (!raw || typeof raw !== 'object') return d;
  if (validKey(raw.day)) d.day = raw.day;
  if (validKey(raw.lastLogin)) d.lastLogin = raw.lastLogin;
  var st = Math.floor(Number(raw.streak));
  d.streak = isFinite(st) && st > 0 ? Math.min(st, 3650) : 0;
  // Görevler kayıttan değil, günün anahtarından yeniden üretilir; kayıttan yalnız ilerleme alınır
  if (d.day) {
    d.quests = generate(d.day);
    var saved = Array.isArray(raw.quests) ? raw.quests : [];
    for (var i = 0; i < d.quests.length; i++) {
      var s = saved[i];
      if (s && s.kind === d.quests[i].kind) {
        var pr = Math.floor(Number(s.progress));
        d.quests[i].progress = isFinite(pr) && pr > 0 ? Math.min(pr, d.quests[i].target) : 0;
        d.quests[i].done = !!s.done && d.quests[i].progress >= d.quests[i].target;
      }
    }
  }
  return d;
}

function load(storage) {
  try {
    var txt = storage && storage.getItem(DAILY_KEY);
    return sanitize(txt ? JSON.parse(txt) : null);
  } catch (e) {
    return fresh();
  }
}
function save(storage, d) {
  try { if (storage) storage.setItem(DAILY_KEY, JSON.stringify(d)); } catch (e) {}
}

function loginRewardFor(streak) { return Math.min(7, 2 + streak); }

// Günün ilk açılışı: görevleri yenile, seriyi ilerlet. Dönen: { coins, streak } (yeni gün değilse coins 0)
function ensureDay(d, key) {
  var res = { coins: 0, streak: d.streak };
  if (d.day !== key) {
    d.day = key;
    d.quests = generate(key);
  }
  if (d.lastLogin !== key) {
    var gap = d.lastLogin ? dayDiff(d.lastLogin, key) : 99;
    d.streak = gap === 1 ? d.streak + 1 : 1;
    d.lastLogin = key;
    res.coins = loginRewardFor(d.streak);
    res.streak = d.streak;
  }
  return res;
}

// Bir koşu bitti: ilerlemeyi işle. run: { stars, score, level, shieldUsed, movingPassed, status }
// Dönen: yeni tamamlanan görevler [{ text, reward }]; ödüller toplamı çağıran tarafından cüzdana eklenir
function applyRun(d, run) {
  var done = [];
  for (var i = 0; i < d.quests.length; i++) {
    var q = d.quests[i];
    if (q.done) continue;
    var v;
    switch (q.kind) {
      case 'run_stars': v = Math.max(q.progress, run.stars || 0); break;
      case 'run_gates': v = Math.max(q.progress, run.score || 0); break;
      case 'reach_level': v = Math.max(q.progress, run.level || 1); break;
      case 'day_gates': v = q.progress + (run.score || 0); break;
      case 'day_runs': v = q.progress + 1; break;
      case 'day_shield': v = q.progress + (run.shieldUsed || 0); break;
      case 'day_moving': v = q.progress + (run.movingPassed || 0); break;
      case 'win': v = (run.level || 1) > 10 || run.status === 'won' ? 1 : q.progress; break;
      default: v = q.progress;
    }
    q.progress = Math.min(q.target, v);
    if (q.progress >= q.target) {
      q.done = true;
      done.push({ text: describe(q), reward: q.reward });
    }
  }
  return done;
}

var Quests = {
  DAILY_KEY: DAILY_KEY, TEMPLATES: TEMPLATES, dayKey: dayKey, dayDiff: dayDiff,
  generate: generate, describe: describe, fresh: fresh, sanitize: sanitize,
  load: load, save: save, ensureDay: ensureDay, applyRun: applyRun, loginRewardFor: loginRewardFor
};
if (typeof module !== 'undefined') module.exports = Quests;
if (typeof window !== 'undefined') window.GameQuests = Quests;
})();

</script>
<script>
// Sekme Gücü — ses ve müzik: ayarlar, efekt tablosu, prosedürel müzik (saf mantık; WebAudio yok)
//
// Müzik dosya değildir: her harita kendi tonu ve dizisiyle 4 ölçülük bir döngü çalar
// (bas + arpej + ezgi). Ezgi harita adından belirlenimli üretilir; tempo bölümle hızlanır.
// Çalma işini main.js yapar; burada yalnız "hangi nota, ne zaman" hesaplanır ki test edilebilsin.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

var SETTINGS_KEY = 'sekmeguc-ses';
var STEPS_PER_BAR = 16;
var BARS = 4;
var BPM0 = 100;
var BPM_STEP = 4;
var BPM_MAX = 136;

// --- Ayarlar ---------------------------------------------------------------
function defaults() { return { music: true, sfx: true }; }
function sanitize(raw) {
  var s = defaults();
  if (raw && typeof raw === 'object') {
    if (raw.music === false) s.music = false;
    if (raw.sfx === false) s.sfx = false;
  }
  return s;
}
function load(storage) {
  try {
    var t = storage && storage.getItem(SETTINGS_KEY);
    return sanitize(t ? JSON.parse(t) : null);
  } catch (e) { return defaults(); }
}
function save(storage, s) {
  try { if (storage) storage.setItem(SETTINGS_KEY, JSON.stringify(sanitize(s))); } catch (e) {}
}

// --- Nota yardımcıları -----------------------------------------------------
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

var MINOR = [0, 2, 3, 5, 7, 8, 10];
var MAJOR = [0, 2, 4, 5, 7, 9, 11];
var DORIAN = [0, 2, 3, 5, 7, 9, 10];
var PENTA = [0, 2, 4, 7, 9, 12, 14];

// Harita → ton (MIDI kök), dizi, akor dizisi (dizi derecesi), dalga biçimi
var TUNES = {
  gece: { root: 57, scale: MINOR, prog: [0, 5, 2, 6], lead: 'triangle' },      // La minör
  gunbatimi: { root: 60, scale: MAJOR, prog: [0, 4, 5, 3], lead: 'sine' },     // Do majör
  orman: { root: 62, scale: DORIAN, prog: [0, 3, 0, 4], lead: 'triangle' },    // Re dorian
  neon: { root: 55, scale: MINOR, prog: [0, 6, 5, 4], lead: 'square' },        // Sol minör
  buz: { root: 64, scale: PENTA, prog: [0, 3, 4, 2], lead: 'sine' },           // Mi pentatonik
  nebula: { root: 53, scale: DORIAN, prog: [0, 2, 5, 3], lead: 'sine' }         // Fa dorian (premium harita)
};

function tune(mapId) { return TUNES[mapId] || TUNES.gece; }

function hash(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// Dizi derecesinden MIDI (oktav taşmalarını sarar)
function degree(t, d, octave) {
  var n = t.scale.length;
  var o = Math.floor(d / n);
  var i = ((d % n) + n) % n;
  return t.root + t.scale[i] + 12 * (o + (octave || 0));
}

function bpm(level) {
  return Math.min(BPM_MAX, BPM0 + BPM_STEP * Math.max(0, (level || 1) - 1));
}
function stepDur(level) { return 60 / bpm(level) / 4; } // 16'lık nota süresi (sn)

// Bir ölçünün notaları: [{ step, ch: 'bass'|'arp'|'lead', freq, len (adım), type }]
// level ilerledikçe katmanlar eklenir: 1–2 bas+arpej, 3+ ezgi, 6+ bas sekizliğe çıkar.
function bar(mapId, barIndex, level) {
  var t = tune(mapId);
  var chord = t.prog[((barIndex % BARS) + BARS) % BARS];
  var notes = [];
  var bassEvery = level >= 6 ? 2 : 4;
  for (var s = 0; s < STEPS_PER_BAR; s += bassEvery) {
    var bd = chord + ((s / bassEvery) % 2 === 1 && bassEvery === 4 ? 4 : 0);
    notes.push({ step: s, ch: 'bass', freq: midiToFreq(degree(t, bd, -2)), len: bassEvery === 2 ? 1.5 : 3, type: 'triangle' });
  }
  var arp = [0, 2, 4, 2];
  for (var a = 0; a < STEPS_PER_BAR; a += 2) {
    notes.push({ step: a, ch: 'arp', freq: midiToFreq(degree(t, chord + arp[(a / 2) % 4], 0)), len: 1, type: 'square' });
  }
  if (level >= 3) {
    // Ezgi: harita + ölçüden belirlenimli; akor tonlarına yakın, ara sıra sus
    var h = hash(mapId + ':' + (((barIndex % BARS) + BARS) % BARS));
    for (var m = 0; m < STEPS_PER_BAR; m += 4) {
      h = (Math.imul(h, 1103515245) + 12345) >>> 0;
      if ((h >>> 8) % 5 === 0) continue;
      var off = [0, 2, 4, 5, 7][(h >>> 12) % 5];
      notes.push({ step: m + ((h >>> 20) % 2) * 2, ch: 'lead', freq: midiToFreq(degree(t, chord + off, 1)), len: 2, type: t.lead });
    }
  }
  notes.sort(function (x, y) { return x.step - y.step; });
  return notes;
}

// İleriye bakan sıralayıcı: her çağrıda [now, now + horizon) aralığına düşen adımları
// play(note, time) ile bir kez verir. Tempo değişirse sonraki adımdan itibaren uygulanır.
function createSequencer(startTime) {
  return { next: startTime || 0, step: 0, bar: 0 };
}
function pump(seq, now, horizon, mapId, level, play) {
  if (seq.next < now - 0.25) seq.next = now; // sekme arkaplandaydı: geri kalanı atla
  var count = 0;
  while (seq.next < now + horizon && count < 64) {
    var notes = bar(mapId, seq.bar, level);
    var sd = stepDur(level);
    for (var i = 0; i < notes.length; i++) {
      if (notes[i].step === seq.step) play(notes[i], seq.next, notes[i].len * sd);
    }
    seq.next += sd;
    seq.step++;
    if (seq.step >= STEPS_PER_BAR) { seq.step = 0; seq.bar = (seq.bar + 1) % BARS; }
    count++;
  }
  return count;
}

// --- Efektler -------------------------------------------------------------
// Her efekt notalar dizisi: { f: Hz, d: sn, at: başlangıç gecikmesi, type, to?: Hz (kayma) }
var SFX = {
  bounce: [{ f: 180, to: 120, d: 0.07, at: 0, type: 'square' }],
  gate: [{ f: 660, d: 0.08, at: 0, type: 'sine' }],
  star: [{ f: 990, d: 0.07, at: 0, type: 'triangle' }, { f: 1320, d: 0.09, at: 0.06, type: 'triangle' }],
  slow: [{ f: 880, to: 330, d: 0.28, at: 0, type: 'sine' }],
  small: [{ f: 600, to: 1500, d: 0.2, at: 0, type: 'sine' }],
  shield: [{ f: 300, to: 180, d: 0.14, at: 0, type: 'square' }],
  level: [{ f: 523, d: 0.08, at: 0, type: 'sine' }, { f: 784, d: 0.12, at: 0.08, type: 'sine' }],
  win: [{ f: 523, d: 0.1, at: 0, type: 'sine' }, { f: 659, d: 0.1, at: 0.1, type: 'sine' }, { f: 784, d: 0.1, at: 0.2, type: 'sine' }, { f: 1046, d: 0.3, at: 0.3, type: 'triangle' }],
  over: [{ f: 220, to: 70, d: 0.4, at: 0, type: 'sawtooth' }],
  buy: [{ f: 880, d: 0.06, at: 0, type: 'triangle' }, { f: 1175, d: 0.08, at: 0.05, type: 'triangle' }],
  quest: [{ f: 784, d: 0.1, at: 0, type: 'triangle' }, { f: 1046, d: 0.14, at: 0.09, type: 'triangle' }]
};

// Kapı sesi skorla hafifçe yükselir (tavanlı)
function gateFreq(score) { return 660 + Math.min(score, 30) * 12; }

var AudioAPI = {
  SETTINGS_KEY: SETTINGS_KEY, STEPS_PER_BAR: STEPS_PER_BAR, BARS: BARS, BPM_MAX: BPM_MAX,
  defaults: defaults, sanitize: sanitize, load: load, save: save,
  midiToFreq: midiToFreq, tune: tune, TUNES: TUNES, bpm: bpm, stepDur: stepDur, bar: bar,
  createSequencer: createSequencer, pump: pump, SFX: SFX, gateFreq: gateFreq
};
if (typeof module !== 'undefined') module.exports = AudioAPI;
if (typeof window !== 'undefined') window.GameAudio = AudioAPI;
})();

</script>
<script>
// Sekme Gücü (Bopgate) — yalnızca çizim, state değiştirmez. Görsel dil: neon arcade.
// view: { best, muted, phase: 'ready'|'playing'|'paused'|'over'|'won', fx, touch, newBest, canRestart,
//         theme: {deco, c:{...}}, skin: {shape, color}, coins, earned, time }  (theme/skin: shop.js kataloğu)
//   fx: { particles: [{x,y,life,max,color}], shake: 0..1, squash: 0..1, trail: [{x,y}],
//         rings: [{x,y,life,max,color}], scorePop: 0..1 }
//   time: saniye cinsinden saat (yalnız süs animasyonları: nabız, parıltı)
// Gradyan, gölge ve birleşim modu olmayan bağlamlarda (testlerdeki sahte bağlam) düz renge düşer.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

// Dil: i18n.js yüklüyse çevirir, değilse Türkçe metni parametreleriyle doldurur
function L(s, p) {
  var I = typeof window !== 'undefined' && window.GameI18n;
  if (I) return I.L(s, p);
  return String(s).replace(/\{(\w+)\}/g, function (m, k) { return p && p[k] != null ? String(p[k]) : m; });
}

var TITLE = 'BOPGATE';
var FONT = "ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif";
var W0 = 520;
// Dikey ölçüler oyun durumunun geometrisinden gelir (uzun telefonda alan uzar); setGeo ayarlar.
var DEFAULT_GEO = { H: 540, ceilY: 30, floorY: 480 };
var H0 = 540;
var FLOOR_Y = 480;
var CEIL_Y = 30;
function setGeo(g) {
  g = g || DEFAULT_GEO;
  H0 = g.H; FLOOR_Y = g.floorY; CEIL_Y = g.ceilY;
}
var BALL_X = 160;
var BALL_R = 12;
var WALL_W = 28;
var SMALL_F = 0.6; // logic.js POWER_SMALL_F ile aynı
var PULSE_EDGE = '#7dffb0';
var SPIKE_COL = '#ff5d6c';
var GOLD = '#ffd166';
var PINK = '#ff7a90';

function ballR(state) { return state.smallT > 0 ? BALL_R * SMALL_F : BALL_R; }
function font(weight, size) { return weight + ' ' + size + 'px ' + FONT; }

// --- Renk ve çizim yardımcıları ----------------------------------------------
function hexRgb(h) {
  if (typeof h !== 'string' || h.charAt(0) !== '#' || h.length !== 7) return null;
  return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return c ? 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')' : h;
}
function mix(a, b, t) {
  var x = hexRgb(a), y = hexRgb(b);
  if (!x || !y) return a;
  var o = '#';
  for (var i = 0; i < 3; i++) {
    var v = Math.round(x[i] + (y[i] - x[i]) * t);
    o += (v < 16 ? '0' : '') + v.toString(16);
  }
  return o;
}

// Işıma: gölge bulanıklığıyla. Açık temada kapalıdır (beyaz zeminde ışıma kirli görünür).

// Güç simgesi: yavaşlatma = saat, küçülme = içe bakan oklar

  ctx.save();
  ctx.lineWidth = 2;
  var col = kind === 'slow' ? '#6fe0ff' : '#ff9df0';
  glow(ctx, col, 12);
  ctx.fillStyle = kind === 'slow' ? '#123047' : '#3d1f45';
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  noGlow(ctx);

    ctx.beginPath();

    ctx.moveTo(cx, cy); ctx.lineTo(cx + r * 0.5, cy + r * 0.2);

    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2); ctx.fill();
  }

function spikes(ctx, x0, w, y) {
  var n = Math.max(3, Math.round(w / 12));
  var tw = w / n;
  ctx.save();
  glow(ctx, SPIKE_COL, 10);
  ctx.fillStyle = SPIKE_COL;
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    ctx.moveTo(x0 + i * tw, y);
    ctx.lineTo(x0 + i * tw + tw / 2, y - 12);
    ctx.lineTo(x0 + (i + 1) * tw, y);
  }
  ctx.fill();
  ctx.restore();
}

function starPath(ctx, cx, cy, r) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var rr = i % 2 === 0 ? r : r * 0.45;
    var px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;

var DEFAULT_THEME = { deco: 'dots', c: { bg: '#0b1220', line: '#223352', wall: '#1f3150', wallPassed: '#16233b', wallMove: '#2b2650', edge: '#5ac8fa', edgeMove: '#b39dfa', deco: 'rgba(200,220,255,0.35)' } };
var DEFAULT_SKIN = { shape: 'circle', color: '#5ac8fa' };

// Top şekli (0,0 merkezli). Mağaza önizlemesi de bunu kullanır.
// opts.shine: üstte parlama + hacim gradyanı; opts.glow: çevresine ışıma (bulanıklık px)
function drawBall(ctx, shape, r, color, opts) {
  opts = opts || {};
  ctx.save();
  if (opts.glow) glow(ctx, color, opts.glow);
  ctx.fillStyle = opts.shine
    ? rad(ctx, -r * 0.35, -r * 0.4, r * 0.1, r * 1.4, [[0, mix(color, '#ffffff', 0.55)], [0.55, color], [1, mix(color, '#000000', 0.35)]], color)
    : color;
  ctx.beginPath();
  if (shape === 'square') {
    rrect(ctx, -r * 0.9, -r * 0.9, r * 1.8, r * 1.8, r * 0.3);
  } else if (shape === 'diamond') {
    ctx.moveTo(0, -r * 1.15); ctx.lineTo(r * 1.0, 0); ctx.lineTo(0, r * 1.15); ctx.lineTo(-r * 1.0, 0);
    ctx.closePath();
  } else if (shape === 'star') {
    starPath(ctx, 0, 0, r * 1.25);
  } else if (shape === 'hex') {
    for (var hi = 0; hi < 6; hi++) {
      var ha = Math.PI / 6 + hi * Math.PI / 3;
      if (hi === 0) ctx.moveTo(Math.cos(ha) * r * 1.1, Math.sin(ha) * r * 1.1); else ctx.lineTo(Math.cos(ha) * r * 1.1, Math.sin(ha) * r * 1.1);
    }
    ctx.closePath();
  } else if (shape === 'flame') {
    // Damla: altta yuvarlak gövde, üstte sivri alev ucu
    ctx.arc(0, r * 0.2, r * 0.9, Math.PI * 0.05, Math.PI * 0.95);
    ctx.lineTo(-r * 0.55, -r * 0.35);
    ctx.lineTo(0, -r * 1.35);
    ctx.lineTo(r * 0.55, -r * 0.35);
    ctx.closePath();
  } else {
    ctx.arc(0, 0, r, 0, Math.PI * 2);
  }
  ctx.fill();
  noGlow(ctx);
  if (shape === 'flame') {
    // İç alev
    ctx.fillStyle = mix(color, '#ffe08a', 0.7);
    ctx.beginPath();
    ctx.arc(0, r * 0.35, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
  } else if (shape === 'hex') {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -r * 0.95); ctx.lineTo(r * 0.55, r * 0.95);
    ctx.moveTo(r * 0.55, -r * 0.95); ctx.lineTo(-r * 0.55, r * 0.95);
    ctx.stroke();
  }
  if (shape === 'ring') {
    ctx.strokeStyle = mix(color, '#ffffff', 0.25);
    ctx.lineWidth = 2;
    ctx.save();
    ctx.scale(1, 0.35);
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (opts.shine) {
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-r * 0.35, -r * 0.4, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Arka plan süsü: kaymalı (paralaks) ama deterministik; dist = katedilen yol.
function drawDeco(ctx, theme, dist, geo) {
  if (geo) setGeo(geo);
  var col = theme.c.deco;
  var d = dist || 0;
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  var i, x;
  if (theme.deco === 'sun') {
    // Ufukta çizgili neon güneş; oyun alanında engel gibi görünmesin diye soluk
    var sr = 70;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = lin(ctx, 0, FLOOR_Y - sr, 0, FLOOR_Y, [[0, 'rgba(255,200,110,0.30)'], [1, 'rgba(255,90,150,0.16)']], col);
    ctx.beginPath();
    ctx.arc(390, FLOOR_Y, sr, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    for (i = 0; i < 3; i++) ctx.fillRect(0, FLOOR_Y - 14 - i * 16, W0, 1);
  } else if (theme.deco === 'trees') {
    for (i = 0; i < 9; i++) {
      x = ((i * 83 - d * 0.25) % (W0 + 80) + W0 + 80) % (W0 + 80) - 40;
      var h = 60 + (i * 37) % 70;
      ctx.beginPath();
      ctx.moveTo(x, FLOOR_Y); ctx.lineTo(x + 26, FLOOR_Y - h); ctx.lineTo(x + 52, FLOOR_Y);
      ctx.closePath();
      ctx.fill();
    }
  } else if (theme.deco === 'grid') {
    ctx.lineWidth = 1;
    var off = (d * 0.5) % 40;
    for (x = -off; x < W0; x += 40) { ctx.beginPath(); ctx.moveTo(x, CEIL_Y); ctx.lineTo(x, FLOOR_Y); ctx.stroke(); }
    for (var y = CEIL_Y; y < FLOOR_Y; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W0, y); ctx.stroke(); }
  } else if (theme.deco === 'nebula') {
    // Yavaş kayan renkli bulutsular + yıldız tozu
    var blobs = [['rgba(255,90,210,0.16)', 0, 0.3, 150], ['rgba(90,220,255,0.13)', 260, 0.55, 180], ['rgba(170,110,255,0.15)', 470, 0.2, 130]];
    for (i = 0; i < blobs.length; i++) {
      var bx = ((blobs[i][1] - d * 0.05) % (W0 + 300) + W0 + 300) % (W0 + 300) - 150;
      var byy = CEIL_Y + (FLOOR_Y - CEIL_Y) * blobs[i][2];
      ctx.fillStyle = rad(ctx, bx, byy, 0, blobs[i][3], [[0, blobs[i][0]], [1, 'rgba(0,0,0,0)']], blobs[i][0]);
      ctx.beginPath(); ctx.arc(bx, byy, blobs[i][3], 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = col;
    for (i = 0; i < 40; i++) {
      x = ((i * 47 - d * 0.12) % W0 + W0) % W0;
      ctx.fillRect(x, CEIL_Y + 6 + ((i * 89) % (FLOOR_Y - CEIL_Y - 12)), i % 5 === 0 ? 2.5 : 1.5, i % 5 === 0 ? 2.5 : 1.5);
    }
  } else if (theme.deco === 'flakes') {
    for (i = 0; i < 26; i++) {
      x = ((i * 61 - d * 0.15) % W0 + W0) % W0;
      var fy = CEIL_Y + 10 + ((i * 97) % (FLOOR_Y - CEIL_Y - 20));
      ctx.fillRect(x - 1.5, fy - 1.5, 3, 3);
    }
  } else {
    // İki katman yıldız: uzak (küçük, yavaş) ve yakın (büyük, hızlı) — derinlik hissi
    for (i = 0; i < 30; i++) {
      x = ((i * 53 - d * 0.1) % W0 + W0) % W0;
      ctx.fillRect(x, CEIL_Y + 8 + ((i * 71) % (FLOOR_Y - CEIL_Y - 16)), 2, 2);
    }
    ctx.globalAlpha = 0.6;
    for (i = 0; i < 12; i++) {
      x = ((i * 97 - d * 0.3) % W0 + W0) % W0;
      ctx.beginPath();
      ctx.arc(x, CEIL_Y + 20 + ((i * 131) % (FLOOR_Y - CEIL_Y - 40)), 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// Gök, zemin ızgarası, neon tavan/zemin çizgisi
function drawStage(ctx, theme, dist) {
  var tc = theme.c, light = isLight(theme);
  ctx.fillStyle = lin(ctx, 0, 0, 0, H0, light
    ? [[0, mix(tc.bg, '#ffffff', 0.5)], [1, tc.bg]]
    : [[0, mix(tc.bg, tc.edge, 0.12)], [0.55, tc.bg], [1, mix(tc.bg, '#000000', 0.45)]], tc.bg);
  ctx.fillRect(0, 0, W0, H0);
  if (!light) {
    // Ufuk ışığı: zeminin hemen üstünde yumuşak bir parlama
    ctx.fillStyle = lin(ctx, 0, FLOOR_Y - 140, 0, FLOOR_Y, [[0, rgba(tc.edge, 0)], [1, rgba(tc.edge, 0.10)]], 'rgba(0,0,0,0)');
    ctx.fillRect(0, FLOOR_Y - 140, W0, 140);
  }
  drawDeco(ctx, theme, dist);

  // Zemin: perspektif ızgara (ufuk = zemin çizgisi), yolla birlikte akar
  var floorH = H0 - FLOOR_Y;
  ctx.fillStyle = lin(ctx, 0, FLOOR_Y, 0, H0, [[0, mix(tc.bg, tc.edge, light ? 0.18 : 0.10)], [1, light ? tc.bg : mix(tc.bg, '#000000', 0.5)]], tc.bg);
  ctx.fillRect(0, FLOOR_Y, W0, floorH);
  ctx.save();
  ctx.strokeStyle = rgba(tc.edge, light ? 0.35 : 0.22);
  ctx.lineWidth = 1;
  var off = ((dist || 0) * 0.6) % 48;
  for (var i = -12; i <= 12; i++) {
    var xt = W0 / 2 + i * 48 - off;
    ctx.beginPath();
    ctx.moveTo(xt, FLOOR_Y);
    ctx.lineTo(W0 / 2 + (xt - W0 / 2) * 3.2, H0);
    ctx.stroke();
  }
  for (var k = 1; k <= 4; k++) {
    var yy = FLOOR_Y + floorH * (k * k) / 20;
    if (yy >= H0) break;
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W0, yy); ctx.stroke();
  }
  ctx.restore();

  // HUD şeridi (tavanın üstü)
  ctx.fillStyle = light ? rgba('#ffffff', 0.55) : 'rgba(3,5,10,0.55)';
  ctx.fillRect(0, 0, W0, CEIL_Y);

  // Neon tavan ve zemin çizgileri
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = tc.edge;
  glow(ctx, tc.edge, 10);
  ctx.beginPath(); ctx.moveTo(0, CEIL_Y); ctx.lineTo(W0, CEIL_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(W0, FLOOR_Y); ctx.stroke();
  ctx.restore();
}

function drawWall(ctx, o, tc, light) {
  var neon = o.passed ? tc.line : (o.move ? tc.edgeMove : (o.pulse ? PULSE_EDGE : tc.edge));
  var base = o.passed || o.hit ? tc.wallPassed : (o.move ? tc.wallMove : tc.wall);
  ctx.save();
  ctx.globalAlpha = o.hit ? 0.45 : 1;
  // Gövde: yandan ışık alan silindir hissi
  ctx.fillStyle = lin(ctx, o.x, 0, o.x + WALL_W, 0,
    [[0, mix(base, neon, o.passed ? 0.05 : 0.28)], [0.45, base], [1, mix(base, '#000000', light ? 0.08 : 0.35)]], base);
  var topH = o.gapY - CEIL_Y;
  var botY = o.gapY + o.gapH;
  ctx.fillRect(o.x, CEIL_Y, WALL_W, topH);
  ctx.fillRect(o.x, botY, WALL_W, FLOOR_Y - botY);
  ctx.strokeStyle = rgba(neon, o.passed ? 0.15 : 0.45);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(o.x + 0.75, CEIL_Y, WALL_W - 1.5, topH);
  ctx.strokeRect(o.x + 0.75, botY, WALL_W - 1.5, FLOOR_Y - botY);
  // Kapı ağzı: iki kenar arası yumuşak ışık perdesi
  if (!o.passed && !o.hit) {
    ctx.fillStyle = lin(ctx, 0, o.gapY, 0, botY,
      [[0, rgba(neon, 0.22)], [0.25, rgba(neon, 0.03)], [0.75, rgba(neon, 0.03)], [1, rgba(neon, 0.22)]], 'rgba(0,0,0,0)');
    ctx.fillRect(o.x, o.gapY, WALL_W, o.gapH);
  }
  // Ağız kapakları: parlayan yuvarlak çubuklar
  if (!o.passed) glow(ctx, neon, 14);
  ctx.fillStyle = neon;
  rrect(ctx, o.x - 4, o.gapY - 7, WALL_W + 8, 7, 3.5); ctx.fill();
  rrect(ctx, o.x - 4, botY, WALL_W + 8, 7, 3.5); ctx.fill();
  ctx.restore();
}

function questLines(view) {
  var q = view.questDone || [];
  var out = [];
  for (var i = 0; i < q.length && i < 3; i++) {
    out.push({ text: L('✓ {t}  +{r} ★', { t: q[i].text, r: q[i].reward }), font: font(600, 15), color: '#46d39a', h: 24 });
  }
  return out;
}

// Ortalanmış yarı saydam kart; satırlar { text, font, color, h, glow, pill }
function card(ctx, rows, accent, light, w) {
  var pad = 26, total = 0, i;
  for (i = 0; i < rows.length; i++) total += rows[i].h || 30;
  w = w || 420;
  var h = total + pad * 2;
  var x = (W0 - w) / 2, y = Math.max(CEIL_Y + 10, (H0 - h) / 2);
  ctx.save();
  glow(ctx, accent, 24);
  ctx.fillStyle = light ? 'rgba(255,255,255,0.92)' : lin(ctx, 0, y, 0, y + h, [[0, 'rgba(22,30,52,0.94)'], [1, 'rgba(10,14,26,0.94)']], 'rgba(14,20,36,0.94)');
  rrect(ctx, x, y, w, h, 22);
  ctx.fill();
  noGlow(ctx);
  ctx.strokeStyle = rgba(accent, 0.7);
  ctx.lineWidth = 2;
  rrect(ctx, x, y, w, h, 22);
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var cy = y + pad;
  for (i = 0; i < rows.length; i++) {
    var r = rows[i], rh = r.h || 30;
    if (r.text) {
      if (r.pill) {
        ctx.fillStyle = rgba(r.pill, 0.18);
        rrect(ctx, W0 / 2 - r.pillW / 2, cy + 3, r.pillW, rh - 6, (rh - 6) / 2);
        ctx.fill();
      }
      ctx.font = r.font || font(500, 17);
      ctx.fillStyle = r.color || (light ? '#12324a' : '#e8ecf1');
      if (r.glow) glow(ctx, r.glow, 16);
      ctx.fillText(r.text, W0 / 2, cy + rh / 2);
      noGlow(ctx);
    }
    cy += rh;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawLogo(ctx, cx, cy, theme, t) {
  var tc = theme.c, light = isLight(theme);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = font(900, 66);
  var a = tc.edge, b = tc.edgeMove;

  ctx.fillText(TITLE, cx, cy);

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = light ? rgba('#ffffff', 0.9) : rgba('#ffffff', 0.35);
  if (ctx.strokeText) ctx.strokeText(TITLE, cx, cy);

}

function pillButton(ctx, cx, cy, w, h, text, t) {

  ctx.translate(cx, cy);
  ctx.scale(s, s);
  glow(ctx, '#ffb347', 22);

  rrect(ctx, -w / 2, -h / 2, w, h, h / 2);
  ctx.fill();
  noGlow(ctx);
  ctx.fillStyle = '#1a1206';
  ctx.font = font(900, 26);

function chip(ctx, cx, cy, text, color, light) {
  ctx.save();
  ctx.font = font(700, 16);
  var w = ctx.measureText ? Math.max(90, ctx.measureText(text).width + 32) : 140;
  ctx.fillStyle = light ? rgba('#ffffff', 0.8) : 'rgba(10,16,30,0.8)';

function dim(ctx, light) {
  ctx.fillStyle = light ? 'rgba(232,243,251,0.55)' : 'rgba(3,5,10,0.62)';
  ctx.fillRect(0, 0, W0, H0);
}

function draw(ctx, state, view) {
  view = view || {};
  var fx = view.fx || {};
  var best = view.best || 0;
  var phase = view.phase || state.status;
  var t = view.time || state.t || 0;
  setGeo(state.geo);
  // Canvas piksel boyutu main.js'de DPR'ye göre ayarlanır; burada mantıksal 520 x H ile çizilir.
  var scale = ctx.canvas.width / W0;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  var theme = view.theme || DEFAULT_THEME;
  var tc = theme.c;
  var light = isLight(theme);
  glowOn = !light;
  var skin = view.skin || DEFAULT_SKIN;
  var textCol = tc.text || '#e8ecf1';
  var textDim = tc.textDim || '#9fb3d1';
  drawStage(ctx, theme, state.distance);

  // Ekran sarsıntısı (≤ 200 ms, zamanlamayı main.js yapar)
  var shake = fx.shake || 0;
  if (shake > 0) {
    var amp = 7 * shake;
    ctx.translate((Math.random() * 2 - 1) * amp, (Math.random() * 2 - 1) * amp);
  }

  var i;
  for (i = 0; i < state.obstacles.length; i++) {
    var o = state.obstacles[i];
    drawWall(ctx, o, tc, light);
    if (o.spike) {
      ctx.globalAlpha = o.spike.hit ? 0.3 : 1;
      spikes(ctx, o.x + WALL_W + o.spike.dx, o.spike.w, FLOOR_Y);
      ctx.globalAlpha = 1;
    }
  }

  // Yıldızlar (kapı ortasında; toplanınca kalkan) — hafif nabız ve ışıma
  var pulse = 1 + 0.12 * Math.sin(t * 6);
  for (i = 0; i < state.obstacles.length; i++) {
    var so = state.obstacles[i];
    if (!so.star || so.star.taken) continue;
    ctx.save();
    glow(ctx, GOLD, 14);
    starShape(ctx, so.x + WALL_W / 2, so.gapY + so.gapH / 2, 10 * pulse, GOLD);
    ctx.restore();
  }
  for (i = 0; i < state.obstacles.length; i++) {
    var po = state.obstacles[i];
    if (!po.power || po.power.taken) continue;
    powerIcon(ctx, po.power.kind, po.x + WALL_W / 2, po.gapY + po.gapH / 2, 10 * pulse);
  }
  var R0 = ballR(state);
  var ballCol = state.status === 'over' ? '#e05656' : skin.color;

  // Kapı geçiş halkaları
  var rings = fx.rings || [];
  ctx.save();
  for (i = 0; i < rings.length; i++) {
    var rg = rings[i], k = 1 - Math.max(0, rg.life / rg.max);
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = 3 * (1 - k) + 1;
    glow(ctx, rg.color, 12);
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, R0 + 6 + 46 * k, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // Işık izi: topun arkasında incelen parlak kuyruk
  // Dünya sola aktığı için eski konumlar sola kaydırılır; parçalar kalınlaşarak topa bağlanır.
  var trail = fx.trail || [];
  ctx.save();
  additive(ctx, true);
  ctx.lineCap = 'round';
  ctx.strokeStyle = ballCol;
  var n = trail.length;
  for (var tr = 0; tr < n; tr++) {
    var a = (tr + 1) / n;
    var x0 = trail[tr].x - (n - tr) * 5, y0 = trail[tr].y;
    var x1 = tr + 1 < n ? trail[tr + 1].x - (n - tr - 1) * 5 : BALL_X;
    var y1 = tr + 1 < n ? trail[tr + 1].y : state.y;
    ctx.globalAlpha = 0.45 * a;
    ctx.lineWidth = R0 * 1.6 * a;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();

  // Top — zemine çarpınca kısa basılma
  var sq = fx.squash || 0;
  var sx = 1 + 0.35 * sq;
  var sy = 1 - 0.3 * sq;
  ctx.save();
  ctx.translate(BALL_X, state.y + R0 * (1 - sy));
  ctx.scale(sx, sy);
  drawBall(ctx, skin.shape, R0, ballCol, { shine: true, glow: 18 });
  ctx.restore();

  // Kalkan: dönen çift halka
  if (state.shield > 0 && state.status === 'playing') {
    ctx.save();
    glow(ctx, GOLD, 12);
    ctx.strokeStyle = rgba(GOLD, 0.9);
    ctx.lineWidth = 2.5;
    var rot = t * 3;
    ctx.beginPath(); ctx.arc(BALL_X, state.y, R0 + 6, rot, rot + Math.PI * 1.4); ctx.stroke();
    ctx.strokeStyle = rgba(GOLD, 0.45);
    ctx.beginPath(); ctx.arc(BALL_X, state.y, R0 + 6, rot + Math.PI * 1.55, rot + Math.PI * 1.9); ctx.stroke();
    ctx.restore();
  }

  // Parçacıklar (ışıklı, toplanır renk)
  var ps = fx.particles || [];
  ctx.save();
  additive(ctx, true);
  for (var p = 0; p < ps.length; p++) {
    var q = ps[p];
    var life = Math.max(0, q.life / q.max);
    ctx.globalAlpha = life;
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y, 1.5 + 2 * life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHud(ctx, state, view, tc, textCol, textDim);

  // Bölüm geçişi yazısı (main.js süreyi tutar)
  if (view.banner && view.banner.a > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, view.banner.a);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var by = CEIL_Y + 110;
    ctx.fillStyle = textCol;
    ctx.font = font(900, 40);
    glow(ctx, tc.edge, 20);
    var I = typeof window !== 'undefined' && window.GameI18n;
    ctx.fillText(view.banner.title.toLocaleUpperCase(I && I.getLang() === 'en' ? 'en' : 'tr'), W0 / 2, by);
    noGlow(ctx);
    if (view.banner.sub) {
      ctx.font = font(700, 17);
      ctx.fillStyle = GOLD;
      ctx.fillText(view.banner.sub, W0 / 2, by + 38);
    }
    ctx.restore();
  }

  if (view.muted) {
    ctx.fillStyle = textDim;
    ctx.font = font(600, 14);
    ctx.fillText(L('sessiz'), 14, FLOOR_Y + 28);
  }

  drawScreens(ctx, state, view, phase, theme, best, t);
}

function drawHud(ctx, state, view, tc, textCol, textDim) {
  var fx = view.fx || {};
  var per = view.gatesPerLevel || 8;
  ctx.save();
  // Skor: ortada büyük, geçişte kısa sıçrama
  var pop = fx.scorePop || 0;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = font(900, Math.round(26 + 8 * pop));
  ctx.fillStyle = textCol;
  glow(ctx, tc.edge, 10 + 10 * pop);
  ctx.fillText(String(state.score), W0 / 2, CEIL_Y / 2 + 1);
  noGlow(ctx);
  // Sol: bölüm + 8 parçalı ilerleme
  ctx.textAlign = 'left';
  ctx.font = font(800, 12);
  ctx.fillStyle = textDim;
  ctx.fillText(L('BÖLÜM {n}', { n: state.level }), 14, 10);
  var done = state.score % per;
  for (var s = 0; s < per; s++) {
    ctx.fillStyle = s < done ? tc.edge : rgba(tc.edge, 0.2);
    rrect(ctx, 14 + s * 11, 18, 9, 5, 2.5);
    ctx.fill();
  }
  // Sağ: rekor
  ctx.textAlign = 'right';
  ctx.font = font(800, 12);
  ctx.fillStyle = textDim;
  ctx.fillText(L('REKOR'), W0 - 14, 10);
  ctx.font = font(800, 14);
  ctx.fillStyle = textCol;
  ctx.fillText(String(view.best || 0), W0 - 14, 22);
  ctx.restore();

  // Kalkanlar (kapasite güçlendirmesiyle 3'e kadar): sağ altta birer yıldız
  ctx.save();
  glow(ctx, GOLD, 8);
  for (var sh = 0; sh < (state.shield || 0); sh++) starShape(ctx, W0 - 24 - sh * 20, FLOOR_Y + 24, 8, GOLD);
  ctx.restore();
  // Etkin güçler ve kalan süre (zeminin altında, sağda)
  var hx = W0 - 52 - Math.max(0, (state.shield || 0) - 1) * 20;
  [['slow', state.slowT], ['small', state.smallT]].forEach(function (pw) {
    if (!(pw[1] > 0)) return;
    powerIcon(ctx, pw[0], hx, FLOOR_Y + 24, 9);
    ctx.fillStyle = textDim;
    ctx.font = font(700, 13);
    ctx.textAlign = 'right';
    ctx.fillText(Math.ceil(pw[1]) + 's', hx - 13, FLOOR_Y + 29);
    ctx.textAlign = 'left';
    hx -= 56;
  });
}

function drawScreens(ctx, state, view, phase, theme, best, t) {
  var tc = theme.c, light = isLight(theme);
  var tapWord = L(view.touch ? 'Dokun' : 'Boşluk / dokun');
  var hasCoins = typeof view.coins === 'number';
  if (phase === 'ready') {
    dim(ctx, light);
    var ly = Math.max(CEIL_Y + 90, H0 * 0.3);
    drawLogo(ctx, W0 / 2, ly, theme, t);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(600, 17);
    ctx.fillStyle = tc.textDim || '#9fb3d1';
    ctx.fillText(L('Basılı tut · yüksel · kapıdan geç'), W0 / 2, ly + 52);
    ctx.restore();
    var by = Math.min(ly + 170, H0 - 230);
    pillButton(ctx, W0 / 2, by, 230, 66, L('▶  OYNA'), t);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = font(600, 15);
    ctx.fillStyle = tc.textDim || '#9fb3d1';
    ctx.fillText(L('{w} ve başla', { w: tapWord }), W0 / 2, by + 58);
    ctx.restore();
    var cy = by + 104;
    chip(ctx, W0 / 2 - 82, cy, '🏆 ' + best, tc.edge, light);
    if (hasCoins) chip(ctx, W0 / 2 + 82, cy, '★ ' + view.coins, GOLD, light);
    if (view.notice) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = font(800, 16);
      ctx.fillStyle = '#46d39a';
      glow(ctx, '#46d39a', 10);
      ctx.fillText(view.notice, W0 / 2, cy + 52);
      ctx.restore();
    }
  } else if (phase === 'paused') {
    dim(ctx, light);
    card(ctx, [
      { text: L('DURAKLATILDI'), font: font(900, 28), glow: tc.edge, h: 46 },
      { text: L('{w} ve devam et', { w: tapWord }), font: font(600, 17), color: tc.edge, h: 30 }
    ], tc.edge, light, 360);
  } else if (phase === 'over' || phase === 'won') {
    // Oyun sonsuz: tek bitiş ekranı. 'won' yalnız eski durumlar için aynı ekrana düşer.
    dim(ctx, light);
    var ms = state.milestones || 0;
    var body = light ? '#12324a' : '#e8ecf1';
    var muted = light ? '#4f7591' : '#9fb3d1';
    var rows = [
      { text: L('OYUN BİTTİ'), font: font(900, 30), color: '#ff5d7a', glow: '#ff5d7a', h: 44 },
      { text: L(state.overReason), font: font(500, 16), color: muted, h: 26 },
      { text: String(state.score), font: font(900, 76), color: body, glow: tc.edge, h: 84 },
      { text: L('KAPI'), font: font(800, 13), color: muted, h: 22 }
    ];
    if (view.newBest) rows.push({ text: L('★ YENİ REKOR ★'), font: font(900, 18), color: GOLD, glow: GOLD, pill: GOLD, pillW: 210, h: 40 });
    else rows.push({ text: L('Rekor: {n}', { n: best }), font: font(700, 16), color: body, h: 32 });
    rows.push({ text: L('Bölüm {n}', { n: state.level }) + (ms ? '  ·  ' + L('{n} eşik', { n: ms }) : ''), font: font(600, 15), color: ms ? GOLD : muted, h: 28 });
    if (hasCoins && view.earned) rows.push({ text: L('+{e} ★   (cüzdan ★ {c})', { e: view.earned, c: view.coins }), font: font(800, 18), color: GOLD, h: 34 });
    else if (hasCoins) rows.push({ text: L('Cüzdan ★ {n}', { n: view.coins }), font: font(700, 15), color: GOLD, h: 30 });
    rows = rows.concat(questLines(view));
    if (view.revive) {
      var rv = view.revive;
      var adWord = L(rv.noads ? 'bedava' : 'reklamla');
      var how = rv.cost && rv.ad ? L('★ {n} ya da {ad}', { n: rv.cost, ad: adWord }) : rv.cost ? '★ ' + rv.cost : adWord;
      rows.push({ text: L('❤ Devam: {how} · aşağıda', { how: how }) + (view.touch || !rv.cost ? '' : ' · C'), font: font(800, 16), color: PINK, h: 34 });
    }
    rows.push(view.canRestart
      ? { text: L('{w}: tekrar oyna', { w: L(view.touch ? 'Dokun' : 'Dokun ya da R') }), font: font(800, 17), color: tc.edge, glow: tc.edge, h: 38 }
      : { text: ' ', h: 38 });
    card(ctx, rows, view.newBest ? GOLD : '#ff5d7a', light, 420);
  }
}

var RenderAPI = { draw: draw, drawBall: drawBall, drawDeco: drawDeco, DEFAULT_GEO: DEFAULT_GEO, TITLE: TITLE };
if (typeof module !== 'undefined') module.exports = RenderAPI;
if (typeof window !== 'undefined') window.GameRender = RenderAPI;
})();

<script>
// Sekme Gücü — döngü, girdi, ses, efektler; logic + render'ı bağlar
//
// Akış (phase): ready → playing ⇄ paused → over → (dokun/R) → playing  (oyun sonsuz; kazanma yok)
// Mobil: ekranın her yeri dokunma alanıdır; parmak canvas dışına kayınca da bırakma
// algılanır; sekme arka plana geçince oyun kendiliğinden duraklar.
// Tarayıcıda bütün betikler aynı genel kapsamı paylaşır; aynı adlı değişken ve
// fonksiyonlar birbirini ezmesin diye dosya kendi kapsamında çalışır. Dışarıya yalnız
// window.Game* ve module.exports çıkar.
(function () {

var SHAKE_MS = 180;
var SQUASH_MS = 120;
var TRAIL_LEN = 10;
var RING_S = 0.35; // kapı geçiş halkasının ömrü (sn)
var POP_S = 0.25;  // skor sıçramasının süresi (sn)
var REVIVE_MS = 5000; // ölünce "★ ile devam" teklifinin süresi

// Dil: i18n.js yüklüyse çevirir, değilse Türkçe metni parametreleriyle doldurur
function L(s, p) {
  var I = typeof window !== 'undefined' && window.GameI18n;
  if (I) return I.L(s, p);
  return String(s).replace(/\{(\w+)\}/g, function (m, k) { return p && p[k] != null ? String(p[k]) : m; });
}

function bootstrap() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DT = 1 / 60;
  var C = window.GameLogic.CONST;

  // Keskin çizim: canvas'ın piksel boyutu ekran yoğunluğuna göre, görünen boyutu CSS'ten.
  var dpr = Math.min(3, Math.max(1, (window.devicePixelRatio || 1)));
  canvas.width = Math.round(C.CANVAS_W * dpr);
  canvas.height = Math.round(C.CANVAS_H * dpr);

    if (!w || !h) return C.CANVAS_H;
    var availW = Math.min(w * 0.98, 760);
    var availH = Math.max(200, h - HUD_PX);
    return Math.round(C.CANVAS_W * availH / availW);

  var muted = !sound.sfx && !sound.music;
  var best = 0;
  // Mağaza profili (cüzdan + sahip olunan/kuşanılan görünümler)
  var Shop = window.GameShop || null;
