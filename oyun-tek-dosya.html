<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çark Vardiyası</title>
<style>
  html, body { margin: 0; background: #0e1015; color: #ddd; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
  canvas { max-width: 100%; height: auto; background: #161a22; touch-action: none; }
  p { margin: 8px 0; font-size: 15px; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<p id="hint">Oklar/WASD: seç · Boşluk/E veya tık: onar · R: yeniden · M: ses</p>
<script>
'use strict';
// Çark Vardiyası: saf oyun mantığı (DOM yok).
var COLS = 4, ROWS = 3, N = COLS * ROWS;
var WIN_TIME = 120, MIN_WORKING = 3, REPAIR_CD = 0.2, BREAK_FEE = 6;

function rnd(s) {
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  var t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function createState(seed) {
  var s = {
    status: 'playing', overReason: '', score: 0, time: 0, coins: 30, earned: 0,
    cursor: 0, cd: 0, seed: seed | 0, rng: seed | 0, repairs: 0, events: [], machines: []
  };
  for (var i = 0; i < N; i++) s.machines.push({ dur: 100, k: 0.6 + 0.8 * rnd(s) });
  return s;
}

function repairCost(m) {
  return (m.dur <= 0 ? BREAK_FEE : 0) + Math.ceil((100 - m.dur) * 0.05);
}

function working(s) {
  var c = 0;
  for (var i = 0; i < N; i++) if (s.machines[i].dur > 0) c++;
  return c;
}

function tryRepair(s) {
  var m = s.machines[s.cursor];
  if (s.cd > 0) return;
  if (m.dur > 95) { s.events.push('full'); return; }
  var cost = repairCost(m);
  if (s.coins < cost) { s.events.push('poor'); return; }
  s.coins -= cost;
  m.dur = 100;
  s.cd = REPAIR_CD;
  s.repairs++;
  s.events.push('repair');
}

function step(s, input, dt) {
  if (s.status !== 'playing') return s;
  s.events = [];
  s.time += dt;
  s.cd = Math.max(0, s.cd - dt);
  if (input.dx || input.dy) {
    var c = s.cursor % COLS, r = Math.floor(s.cursor / COLS);
    c = (c + (input.dx || 0) + COLS) % COLS;
    r = (r + (input.dy || 0) + ROWS) % ROWS;
    s.cursor = r * COLS + c;
    s.events.push('move');
  }
  if (typeof input.pick === 'number' && input.pick >= 0 && input.pick < N) {
    s.cursor = input.pick;
    tryRepair(s);
  } else if (input.repair) {
    tryRepair(s);
  }
  var wear = 3 + 0.04 * s.time;
  for (var i = 0; i < N; i++) {
    var m = s.machines[i];
    if (m.dur <= 0) continue;
    var gain = m.dur / 100 * dt;
    s.earned += gain;
    s.coins += gain;
    m.dur = Math.max(0, m.dur - wear * m.k * dt);
    if (m.dur === 0) s.events.push('break');
  }
  s.score = Math.floor(s.earned);
  if (working(s) < MIN_WORKING) {
    s.status = 'over';
    s.overReason = 'Çarklar durdu: ' + MIN_WORKING + ' makineden azı çalışıyor';
    s.events.push('over');
  } else if (s.time >= WIN_TIME) {
    s.status = 'won';
    s.events.push('won');
  }
  return s;
}

var GameLogic = { createState: createState, step: step, working: working, repairCost: repairCost, COLS: COLS, ROWS: ROWS, N: N, WIN_TIME: WIN_TIME };
if (typeof module !== 'undefined') module.exports = GameLogic;
if (typeof window !== 'undefined') window.GameLogic = GameLogic;

</script>
<script>
'use strict';
// Çark Vardiyası: yalnızca çizim.
var LAYOUT = { x0: 60, y0: 120, cw: 120, ch: 100, gap: 10, cols: 4 };

function cellRect(i) {
  var c = i % LAYOUT.cols, r = Math.floor(i / LAYOUT.cols);
  return { x: LAYOUT.x0 + c * (LAYOUT.cw + LAYOUT.gap), y: LAYOUT.y0 + r * (LAYOUT.ch + LAYOUT.gap), w: LAYOUT.cw, h: LAYOUT.ch };
}

function cellAt(x, y) {
  for (var i = 0; i < 12; i++) {
    var q = cellRect(i);
    if (x >= q.x && x < q.x + q.w && y >= q.y && y < q.y + q.h) return i;
  }
  return -1;
}

function draw(ctx, state, view) {
  var W = 640, H = 480;
  var shake = view && view.shake ? view.shake : 0;
  ctx.fillStyle = '#161a22';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 8, (Math.random() - 0.5) * shake * 8);
  for (var i = 0; i < state.machines.length; i++) {
    var m = state.machines[i], q = cellRect(i);
    var d = m.dur / 100;
    ctx.fillStyle = m.dur <= 0 ? '#3a1f22' : '#232a36';
    ctx.fillRect(q.x, q.y, q.w, q.h);
    var cx = q.x + q.w / 2, cy = q.y + 40;
    ctx.strokeStyle = m.dur <= 0 ? '#7a3b40' : (d < 0.35 ? '#e0a040' : '#6fc3a0');
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.stroke();
    var a0 = state.time * 3 * d;
    for (var t = 0; t < 8; t++) {
      var a = a0 + t * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 20, cy + Math.sin(a) * 20);
      ctx.lineTo(cx + Math.cos(a) * 27, cy + Math.sin(a) * 27);
      ctx.stroke();
    }
    ctx.fillStyle = '#0d0f14';
    ctx.fillRect(q.x + 10, q.y + 80, q.w - 20, 8);
    ctx.fillStyle = d < 0.35 ? '#e0a040' : '#6fc3a0';
    ctx.fillRect(q.x + 10, q.y + 80, (q.w - 20) * d, 8);
    if (i === state.cursor) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.strokeRect(q.x - 2, q.y - 2, q.w + 4, q.h + 4);
    }
  }
  ctx.restore();
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillStyle = '#e8ecf1';
  ctx.textAlign = 'left';
  ctx.fillText('Skor: ' + state.score, 60, 40);
  ctx.fillText('Kasa: ' + Math.floor(state.coins), 200, 40);
  ctx.fillText('Kalan: ' + Math.max(0, Math.ceil(120 - state.time)) + ' sn', 330, 40);
  ctx.fillText('Rekor: ' + (view && view.best ? view.best : 0), 480, 40);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = '#8ea0b8';
  ctx.fillText('Çarkları sağlam tut: 3\'ten az çark kalırsa vardiya biter. Onarım parayla.', 60, 80);
  if (state.status !== 'playing') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '28px system-ui, sans-serif';
    ctx.fillText(state.status === 'won' ? 'Vardiya bitti, kazandın' : 'Vardiya bitti', W / 2, 210);
    ctx.font = '18px system-ui, sans-serif';
    if (state.status === 'over') ctx.fillText(state.overReason, W / 2, 250);
    ctx.fillText('Skor: ' + state.score + '  ·  R veya boşluk: yeniden başla', W / 2, 290);
  }
}

var GameRender = { draw: draw, cellAt: cellAt };
if (typeof module !== 'undefined') module.exports = GameRender;
if (typeof window !== 'undefined') window.GameRender = GameRender;

</script>
<script>
'use strict';
// Çark Vardiyası: döngü, girdi, ses.
function bootstrap() {
  var L = (typeof window !== 'undefined' && window.GameLogic) || require('./logic.js');
  var R = (typeof window !== 'undefined' && window.GameRender) || require('./render.js');
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DT = 1 / 60;
  var best = 0;
  try { best = parseInt(localStorage.getItem('carkvardiya-best') || '0', 10) || 0; } catch (e) { best = 0; }
  var seed = 7;
  var state = L.createState(seed);
  var pending = { dx: 0, dy: 0, repair: false, pick: null };
  var acc = 0, last = null, overFrames = 0, shake = 0, muted = false, actx = null;

  function beep(f, d) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; g.gain.value = 0.05;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + d);
    } catch (e) { actx = null; }
  }

  function restart() {
    seed = (seed * 31 + 17) % 100000;
    state = L.createState(seed);
    overFrames = 0;
  }

  function onEvents(ev) {
    for (var i = 0; i < ev.length; i++) {
      if (ev[i] === 'repair') beep(660, 0.08);
      else if (ev[i] === 'break') { beep(120, 0.2); shake = 0.2; }
      else if (ev[i] === 'poor') beep(200, 0.1);
      else if (ev[i] === 'move') beep(440, 0.02);
      else if (ev[i] === 'over') { beep(90, 0.4); shake = 0.2; }
      else if (ev[i] === 'won') beep(880, 0.4);
    }
  }

  function finish() {
    if (state.score > best) {
      best = state.score;
      try { localStorage.setItem('carkvardiya-best', String(best)); } catch (e) { /* kayıt yok */ }
    }
  }

  function onKey(e) {
    var k = e.key, c = e.code;
    var used = true;
    if (k === 'r' || k === 'R' || c === 'KeyR') { restart(); }
    else if (k === 'm' || k === 'M' || c === 'KeyM') { muted = !muted; }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') pending.dx = -1;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') pending.dx = 1;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') pending.dy = -1;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') pending.dy = 1;
    else if (k === ' ' || k === 'Enter' || k === 'e' || k === 'E') {
      if (state.status !== 'playing') { if (overFrames > 24) restart(); }
      else pending.repair = true;
    } else used = false;
    if (used && e.preventDefault) e.preventDefault();
  }

  function onPointer(e) {
    if (state.status !== 'playing') { if (overFrames > 24) restart(); return; }
    var rect = canvas.getBoundingClientRect();
    var sx = canvas.width / (rect.width || canvas.width);
    var sy = canvas.height / (rect.height || canvas.height);
    var i = R.cellAt((e.clientX - rect.left) * sx, (e.clientY - rect.top) * sy);
    if (i >= 0) pending.pick = i;
  }

  window.addEventListener('keydown', onKey);
  canvas.addEventListener('pointerdown', onPointer);

  function frame(ts) {
    if (last === null) last = ts;
    acc += Math.min((ts - last) / 1000, 0.25);
    last = ts;
    var n = 0;
    while (acc >= DT && n < 5) {
      var input = pending;
      pending = { dx: 0, dy: 0, repair: false, pick: null };
      var was = state.status;
      L.step(state, input, DT);
      onEvents(state.events);
      if (was === 'playing' && state.status !== 'playing') finish();
      if (state.status !== 'playing') overFrames++;
      acc -= DT; n++;
    }
    if (n === 5) acc = 0;
    shake = Math.max(0, shake - 1 / 60);
    R.draw(ctx, state, { best: best, shake: shake });
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
  return { getState: function () { return state; }, setState: function (s) { state = s; } };
}

if (typeof window !== 'undefined') {
  window.GameMain = { bootstrap: bootstrap };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap); else bootstrap();
}
if (typeof module !== 'undefined') module.exports = { bootstrap: bootstrap };

</script>
</body>
</html>
