<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanca Tırmanışı</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; color: #ddd; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; max-height: 90vh; max-width: 100vw; aspect-ratio: 360 / 640; touch-action: none; }
  p { margin: 6px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="game" width="360" height="640"></canvas>
<p>Boşluk: kanca at/çek · bırak: fırla · ←/→: yön · R: yeniden · M: ses</p>
<script>
/* logic.js */
// Kanca Tırmanışı — saf oyun mantığı (DOM yok, canvas yok)
'use strict';

const C = {
  W: 360, H: 640,
  R: 9,              // oyuncu yarıçapı
  G: 900,            // yerçekimi px/s^2
  PULL: 1500,        // kanca çekiş ivmesi
  RANGE: 240,        // kanca menzili
  SNAP: 14,          // bu mesafede kancaya asılı kalır
  BREAK: 1.1,        // çapa bu kadar saniye yük taşırsa kırılır
  AIR: 520,          // havada yatay kontrol ivmesi
  MAXV: 900,         // hız tavanı
  FOG0: 26,          // sis başlangıç hızı px/s
  FOG_K: 0.03,       // yükseklik başına sis hızlanması
  FOG_MAX: 150,
  FOG_LEAD: 60,      // sis ekranın altından en fazla bu kadar aşağıda bekler
  WIN_H: 10000,      // 1000 m = kazanma
};

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// PRNG durumu state içinde sayı olarak tutulur (JSON ile karşılaştırılabilir)
function rnd(s) {
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function createState(seed) {
  seed = (seed >>> 0) || 1;
  const s = {
    seed: seed,
    rng: (mulberry32(seed)() * 4294967296) | 0,
    status: 'playing',
    overReason: '',
    started: false,
    time: 0,
    px: C.W / 2, py: -C.R, vx: 0, vy: 0,
    hook: -1,          // takılı çapa indeksi
    hanging: false,
    prevAction: false,
    anchors: [],       // {x, y, wear, broken}
    topY: 0,           // üretilmiş en üst sıra
    lastX: C.W / 2,
    camY: -C.H * 0.7,
    fogY: 300,
    maxH: 0,
    score: 0,
    events: [],
  };
  genAnchors(s);
  return s;
}

function rowGap(h) { return 75 + Math.min(70, h / 60); }

function genAnchors(s) {
  while (s.topY > s.camY - C.H) {
    const h = -s.topY;
    s.topY -= rowGap(h);
    let x = s.lastX + (rnd(s) * 2 - 1) * 150;
    x = Math.max(30, Math.min(C.W - 30, x));
    s.anchors.push({ x: Math.round(x), y: Math.round(s.topY), wear: 0, broken: false });
    s.lastX = x;
    const second = rnd(s) < Math.max(0.15, 0.6 - h / 8000);
    if (second) {
      const x2 = 30 + rnd(s) * (C.W - 60);
      if (Math.abs(x2 - x) > 60) s.anchors.push({ x: Math.round(x2), y: Math.round(s.topY + (rnd(s) * 30 - 15)), wear: 0, broken: false });
    }
  }
  // ekranın çok altında kalan çapaları at (indeksler kaymasın diye yalnızca takılı değilken)
  if (s.hook < 0 && s.anchors.length > 60) {
    s.anchors = s.anchors.filter(a => a.y < s.fogY + 40);
  }
}

// Kancanın hedefi: menzildeki, oyuncunun üstündeki çapalardan en iyisi
function pickTarget(s, input) {
  let best = -1, bestScore = -Infinity;
  for (let i = 0; i < s.anchors.length; i++) {
    const a = s.anchors[i];
    if (a.broken) continue;
    const dx = a.x - s.px, dy = s.py - a.y;
    if (dy < 20) continue;
    if (dx * dx + dy * dy > C.RANGE * C.RANGE) continue;
    let sc = dy - 0.5 * Math.abs(dx);
    if (input.left && dx < 0) sc += 120;
    if (input.right && dx > 0) sc += 120;
    if (sc > bestScore) { bestScore = sc; best = i; }
  }
  return best;
}

function finish(s, reason) {
  s.status = 'over';
  s.overReason = reason;
  s.hook = -1; s.hanging = false;
  s.events.push({ type: 'over' });
}

function step(s, input, dt) {
  if (s.status !== 'playing') { s.prevAction = !!input.action; return s; }
  const pressed = !!input.action && !s.prevAction;
  s.prevAction = !!input.action;
  if (!s.started && (pressed || input.left || input.right)) s.started = true;
  s.time += dt;

  // kanca at / bırak
  if (pressed && s.hook < 0) {
    const t = pickTarget(s, input);
    if (t >= 0) { s.hook = t; s.hanging = false; s.events.push({ type: 'hook' }); }
    else s.events.push({ type: 'miss' });
  }
  if (!input.action && s.hook >= 0) {
    s.hook = -1; s.hanging = false; s.events.push({ type: 'release' });
  }

  if (s.hook >= 0) {
    const a = s.anchors[s.hook];
    a.wear += dt;
    if (a.wear >= C.BREAK) {
      a.broken = true; s.hook = -1; s.hanging = false;
      s.events.push({ type: 'break', x: a.x, y: a.y });
    }
  }

  if (s.hook >= 0) {
    const a = s.anchors[s.hook];
    const dx = a.x - s.px, dy = a.y - s.py;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (s.hanging || d < C.SNAP) {
      if (!s.hanging) s.events.push({ type: 'snap' });
      s.hanging = true;
      s.px = a.x; s.py = a.y + C.SNAP * 0.5; s.vx = 0; s.vy = 0;
    } else {
      s.vx += (dx / d) * C.PULL * dt;
      s.vy += (dy / d) * C.PULL * dt + C.G * 0.3 * dt;
    }
  } else {
    s.vy += C.G * dt;
    if (input.left) s.vx -= C.AIR * dt;
    if (input.right) s.vx += C.AIR * dt;
    s.vx *= 1 - 0.6 * dt;
  }

  const sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
  if (sp > C.MAXV) { s.vx *= C.MAXV / sp; s.vy *= C.MAXV / sp; }
  if (!s.hanging) { s.px += s.vx * dt; s.py += s.vy * dt; }

  // duvarlar ve başlangıç zemini (y = 0)
  if (s.px < C.R) { s.px = C.R; s.vx = Math.abs(s.vx) * 0.5; }
  if (s.px > C.W - C.R) { s.px = C.W - C.R; s.vx = -Math.abs(s.vx) * 0.5; }
  if (s.py > -C.R) { s.py = -C.R; if (s.vy > 0) s.vy = 0; s.vx *= 1 - 4 * dt; }

  // kamera yalnızca yukarı gider
  const want = s.py - C.H * 0.55;
  if (want < s.camY) s.camY += (want - s.camY) * Math.min(1, 6 * dt);

  // sis
  const h = Math.max(0, -s.py);
  if (h > s.maxH) s.maxH = h;
  s.score = Math.floor(s.maxH / 10);
  if (s.started) {
    const fogV = Math.min(C.FOG_MAX, C.FOG0 + C.FOG_K * s.maxH);
    s.fogY -= fogV * dt;
    s.fogY = Math.min(s.fogY, s.camY + C.H + C.FOG_LEAD);
  }
  genAnchors(s);

  if (s.py + C.R * 0.5 > s.fogY) {
    finish(s, 'Sis seni yuttu (' + s.score + ' m)');
  } else if (s.maxH >= C.WIN_H) {
    s.status = 'won';
    s.overReason = '';
    s.events.push({ type: 'won' });
  }
  return s;
}

if (typeof module !== 'undefined') module.exports = { createState, step, pickTarget, C };
if (typeof window !== 'undefined') window.GameLogic = { createState, step, pickTarget, C };

</script>
<script>
/* render.js */
// Kanca Tırmanışı — yalnızca çizim
'use strict';

function draw(ctx, s, view) {
  const W = 360, H = 640;
  const L = (typeof window !== 'undefined' && window.GameLogic) || view.logic;
  const cam = s.camY;
  const shake = view.shake || 0;
  ctx.save();
  if (shake > 0) ctx.translate((view.jx || 0) * shake, (view.jy || 0) * shake);

  // arka plan: yükseldikçe koyulaşan gök
  const t = Math.min(1, s.maxH / 10000);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgb(' + Math.round(40 - 30 * t) + ',' + Math.round(60 - 40 * t) + ',' + Math.round(110 - 50 * t) + ')');
  g.addColorStop(1, 'rgb(' + Math.round(90 - 50 * t) + ',' + Math.round(120 - 70 * t) + ',' + Math.round(160 - 60 * t) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // yükseklik çizgileri (her 50 m)
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '10px system-ui, sans-serif';
  const step = 500;
  for (let y = Math.floor(cam / step) * step; y < cam + H; y += step) {
    if (y > 0) continue;
    const sy = y - cam;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    ctx.fillText((-y / 10) + ' m', 4, sy - 3);
  }

  // başlangıç zemini
  if (-cam < H + 20) {
    ctx.fillStyle = '#3d4a3a';
    ctx.fillRect(0, -cam, W, H);
  }

  // menzil halkası (yalnızca kanca boşken)
  if (s.status === 'playing' && s.hook < 0) {
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(s.px, s.py - cam, 240, Math.PI, 2 * Math.PI); ctx.stroke();
  }

  // hedef önizlemesi
  let target = -1;
  if (s.status === 'playing' && s.hook < 0 && L && L.pickTarget) target = L.pickTarget(s, view.input || {});

  // çapalar
  for (let i = 0; i < s.anchors.length; i++) {
    const a = s.anchors[i];
    if (a.broken) continue;
    const sy = a.y - cam;
    if (sy < -20 || sy > H + 20) continue;
    const wear = Math.min(1, a.wear / 1.1);
    ctx.fillStyle = 'rgb(' + Math.round(220 + 35 * wear) + ',' + Math.round(200 - 150 * wear) + ',' + Math.round(120 - 80 * wear) + ')';
    ctx.beginPath(); ctx.arc(a.x, sy, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(a.x, sy, 7, 0, Math.PI * 2); ctx.stroke();
    if (i === target) {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(a.x, sy, 12, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.lineWidth = 1;
  }

  // ip
  if (s.hook >= 0) {
    const a = s.anchors[s.hook];
    ctx.strokeStyle = '#f2e6c9'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.px, s.py - cam); ctx.lineTo(a.x, a.y - cam); ctx.stroke();
    ctx.lineWidth = 1;
  }

  // oyuncu
  ctx.fillStyle = s.status === 'over' ? '#888' : '#ff7a3c';
  ctx.beginPath(); ctx.arc(s.px, s.py - cam, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(s.px + 3, s.py - cam - 2, 2.5, 0, Math.PI * 2); ctx.fill();

  // parçacıklar
  const parts = view.particles || [];
  for (const p of parts) {
    ctx.fillStyle = 'rgba(255,220,150,' + Math.max(0, p.life / p.max).toFixed(2) + ')';
    ctx.fillRect(p.x - 2, p.y - cam - 2, 4, 4);
  }

  // sis
  const fy = s.fogY - cam;
  if (fy < H) {
    const fg = ctx.createLinearGradient(0, fy - 40, 0, fy + 40);
    fg.addColorStop(0, 'rgba(200,190,230,0)');
    fg.addColorStop(1, 'rgba(200,190,230,0.95)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, fy - 40, W, 80);
    ctx.fillStyle = 'rgba(200,190,230,0.95)';
    ctx.fillRect(0, fy + 40, W, H);
  }
  ctx.restore();

  // HUD: skor/ilerleme
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, 28);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Yükseklik: ' + s.score + ' / 1000 m', 8, 19);
  ctx.textAlign = 'right';
  ctx.fillText('Rekor: ' + (view.best || 0) + ' m' + (view.muted ? '  (ses kapalı)' : ''), W - 8, 19);
  ctx.textAlign = 'center';
  ctx.font = '13px system-ui, sans-serif';
  if (!s.started && s.status === 'playing') {
    ctx.fillStyle = '#fff';
    ctx.fillText('Boşluk: kancayı at, basılı tut: çek, bırak: fırla', W / 2, H / 2 + 40);
  }

  if (s.status === 'over' || s.status === 'won') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H / 2 - 70, W, 140);
    ctx.fillStyle = s.status === 'won' ? '#9f9' : '#fbb';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText(s.status === 'won' ? 'Zirveye ulaştın!' : s.overReason, W / 2, H / 2 - 25);
    ctx.fillStyle = '#fff';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText('Yükseklik: ' + s.score + ' m   Rekor: ' + (view.best || 0) + ' m', W / 2, H / 2 + 8);
    ctx.fillText('R / Boşluk / tıklama: yeniden başla', W / 2, H / 2 + 38);
  }
  ctx.textAlign = 'left';
}

if (typeof module !== 'undefined') module.exports = { draw };
if (typeof window !== 'undefined') window.GameRender = { draw };

</script>
<script>
/* main.js */
// Kanca Tırmanışı — döngü, girdi, ses
'use strict';

function bootstrap() {
  const L = window.GameLogic, R = window.GameRender;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DT = 1 / 60;
  const input = { left: false, right: false, action: false };
  const view = { best: 0, muted: false, particles: [], shake: 0, jx: 0, jy: 0, input: input, logic: L };
  let seed = 1 + Math.floor(Math.random() * 1e9);
  let state = L.createState(seed);
  let acc = 0, last = null, overAt = 0;
  let audio = null;

  try { view.best = parseInt(localStorage.getItem('kancatirmanis.best') || '0', 10) || 0; } catch (e) { view.best = 0; }

  function ensureAudio() {
    if (audio || view.muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    } catch (e) { audio = null; }
  }
  function tone(freq, dur, type, vol) {
    if (!audio || view.muted) return;
    try {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(audio.destination);
      const t = audio.currentTime;
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sessiz devam */ }
  }
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 120;
      view.particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5, max: 0.5 });
    }
  }

  function restart() {
    seed = (seed + 7919) >>> 0;
    state = L.createState(seed);
    view.particles.length = 0; view.shake = 0;
    acc = 0;
  }

  function handleEvents() {
    for (const e of state.events) {
      if (e.type === 'hook') tone(660, 0.07, 'square');
      else if (e.type === 'snap') { tone(880, 0.05, 'triangle'); burst(state.px, state.py, 5); }
      else if (e.type === 'release') tone(440, 0.05, 'sine');
      else if (e.type === 'miss') tone(160, 0.08, 'sawtooth', 0.04);
      else if (e.type === 'break') { tone(220, 0.15, 'sawtooth'); burst(e.x, e.y, 10); view.shake = 0.15; }
      else if (e.type === 'over' || e.type === 'won') {
        tone(e.type === 'won' ? 990 : 110, 0.35, e.type === 'won' ? 'triangle' : 'sawtooth', 0.08);
        view.shake = 0.2; overAt = state.time;
        if (state.score > view.best) {
          view.best = state.score;
          try { localStorage.setItem('kancatirmanis.best', String(view.best)); } catch (err) { /* kayıt yok */ }
        }
      }
    }
    state.events.length = 0;
  }

  function isOver() { return state.status !== 'playing'; }

  const KEYS = { ' ': 'action', 'Spacebar': 'action', 'ArrowUp': 'action', 'w': 'action', 'W': 'action',
    'ArrowLeft': 'left', 'a': 'left', 'A': 'left', 'ArrowRight': 'right', 'd': 'right', 'D': 'right' };

  window.addEventListener('keydown', function (e) {
    ensureAudio();
    const k = e.key;
    if (k === 'r' || k === 'R' || e.code === 'KeyR') { e.preventDefault && e.preventDefault(); restart(); return; }
    if (k === 'm' || k === 'M') { view.muted = !view.muted; return; }
    const m = KEYS[k];
    if (!m) return;
    if (e.preventDefault) e.preventDefault();
    if (isOver()) { if (m === 'action' && !e.repeat) restart(); return; }
    input[m] = true;
  });
  window.addEventListener('keyup', function (e) {
    const m = KEYS[e.key];
    if (m) { input[m] = false; if (e.preventDefault) e.preventDefault(); }
  });

  // dokunma/fare: basılı tut = kanca; ekranın sol/sağ üçte biri yön tercihi
  function pdown(e) {
    ensureAudio();
    if (e.preventDefault) e.preventDefault();
    if (isOver()) { restart(); return; }
    let x = 180;
    if (e.offsetX !== undefined && canvas.clientWidth) x = e.offsetX * 360 / canvas.clientWidth;
    input.left = x < 120; input.right = x > 240; input.action = true;
  }
  function pup(e) { input.action = false; input.left = false; input.right = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', pdown);
    canvas.addEventListener('pointerup', pup);
    canvas.addEventListener('pointercancel', pup);
  }

  function frame(ts) {
    if (last === null) last = ts;
    acc += Math.min(0.25, (ts - last) / 1000);
    last = ts;
    let n = 0;
    while (acc >= DT && n < 5) {
      L.step(state, input, DT);
      handleEvents();
      for (const p of view.particles) { p.x += p.vx * DT; p.y += p.vy * DT; p.life -= DT; }
      view.particles = view.particles.filter(p => p.life > 0);
      if (view.shake > 0) view.shake = Math.max(0, view.shake - DT);
      acc -= DT; n++;
    }
    if (n === 5) acc = 0;
    view.jx = (Math.random() * 2 - 1) * 30; view.jy = (Math.random() * 2 - 1) * 30;
    R.draw(ctx, state, view);
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);

  window.__game = { get state() { return state; }, set state(v) { state = v; }, input: input, view: view };
}

if (typeof window !== 'undefined') {
  window.GameMain = { bootstrap };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
}
if (typeof module !== 'undefined') module.exports = { bootstrap };

</script>
</body>
</html>
