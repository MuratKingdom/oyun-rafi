# Bopgate Android derlemesi (GitHub'ın sunucularında; bilgisayarda Android Studio gerekmez)
#
# Her çalışmada:
#   • Oyun testleri (node test.js, node test-dom.js) — kırmızıysa derleme yapılmaz.
#   • Debug APK → "bopgate-debug-apk" eseri. Telefona doğrudan kurulur (bilinmeyen kaynak izni).
#     Debug imza anahtarı Actions önbelleğinde saklanır: her APK aynı anahtarla imzalanır, telefonda
#     eski sürüm silinmeden üstüne kurulur (adb install -r). Anahtarı yalnız oyun/sekmeguc'a push
#     kaydeder; PR derlemeleri onu okur. Bu, Android'in herkese açık debug anahtarı türündendir —
#     yayın (Play) imzası değildir, yayın imzası aşağıdaki sırlardan gelir.
# İmza sırları tanımlıysa ek olarak:
#   • İmzalı AAB → "bopgate-release-aab" eseri. Play Console'a (dahili test) yüklenir.
#
# Gerekli GitHub Secrets (yalnız imzalı AAB için; ASLA dosyaya ya da sohbete yazılmaz):
#   BOPGATE_KEYSTORE_BASE64   upload keystore dosyasının base64 hali
#   BOPGATE_KEYSTORE_PASSWORD keystore şifresi
#   BOPGATE_KEY_ALIAS         anahtar adı
#   BOPGATE_KEY_PASSWORD      anahtar şifresi
# Kurulum adımları: android-paket/README.md → "GitHub Actions ile derleme".
name: Bopgate Android

on:
  push:
    branches: [oyun/sekmeguc]
  pull_request:
    branches: [oyun/sekmeguc]
  workflow_dispatch:

concurrency:
  group: bopgate-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      KS_B64: ${{ secrets.BOPGATE_KEYSTORE_BASE64 }}
      # versionCode: her çalışmada artar (Play aynı numarayı ikinci kez kabul etmez)
      BOPGATE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Oyun testleri
        run: |
          node test.js
          node test-dom.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Yalnız gereken paketler: eski 'tools' paketi artık yok, varsayılan kurulum onu isteyip düşüyor
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Capacitor bağımlılıkları
        working-directory: android-paket
        run: npm ci

      - name: Oyunu pakete hazırla (www/) ve eşitle
        working-directory: android-paket
        run: |
          node hazirla.js
          npx cap sync android

      # Android Gradle eklentisi debug anahtarını $ANDROID_USER_HOME/debug.keystore'da arar,
      # yoksa yenisini üretir. Klasör açıkça verilir: varsayılan konuma güvenilmez.
      - name: Debug anahtar klasörü
        run: |
          mkdir -p "$RUNNER_TEMP/android-kullanici"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-kullanici" >> "$GITHUB_ENV"

      - name: Debug imza anahtarını önbellekten al
        id: debug-anahtar
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/android-kullanici/debug.keystore
          key: bopgate-debug-keystore-v1

      - name: Debug APK
        working-directory: android-paket/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Debug imza anahtarını önbelleğe kaydet (yalnız ilk kez, yalnız oyun/sekmeguc'ta)
        if: github.event_name != 'pull_request' && steps.debug-anahtar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/android-kullanici/debug.keystore
          key: bopgate-debug-keystore-v1

      - uses: actions/upload-artifact@v4
        with:
          name: bopgate-debug-apk
          path: android-paket/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # APK yalnız v2/v3 şemasıyla imzalı (keytool -printcert bunu okuyamaz): apksigner kullanılır
      - name: Debug imza parmak izi (her derlemede aynı olmalı)
        run: |
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            echo "::error::debug.keystore $ANDROID_USER_HOME içinde yok; bulunanlar:"
            find / -name debug.keystore -not -path '*/proc/*' 2>/dev/null || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            android-paket/android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256'

      - name: İmza dosyasını sırlardan kur (yalnız sırlar varsa)
        if: env.KS_B64 != ''
        working-directory: android-paket/android
        env:
          KS_PASS: ${{ secrets.BOPGATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOPGATE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BOPGATE_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > bopgate-upload.jks
          {
            echo "storeFile=bopgate-upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: İmzalı AAB (Play Console için)
        if: env.KS_B64 != ''
        working-directory: android-paket/android
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: env.KS_B64 != ''
        with:
          name: bopgate-release-aab
          path: android-paket/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: İmza dosyalarını sil
        if: always()
        working-directory: android-paket/android
        run: rm -f bopgate-upload.jks keystore.properties
